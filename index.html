<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>최강 목표</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-black text-slate-100 min-h-screen selection:bg-orange-500 selection:text-white relative">
  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = "https://tuvzubjiucnlvtdagqqe.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_WG9ZK-Xugns3X_fsksQ2jw_9XV7UQCD";

    let supabase;
    try {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
        }
      });
    } catch (e) {
      console.warn("Supabase 클라이언트 생성 경고:", e.message);
    }

    // 커스텀 토스트 알림 (기본 alert 대체)
    window.customAlert = (msg) => {
      const container = document.getElementById('toast-container') || (() => {
        const c = document.createElement('div');
        c.id = 'toast-container';
        c.className = 'fixed top-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 w-[90%] max-w-sm';
        document.body.appendChild(c);
        return c;
      })();
      const toast = document.createElement('div');
      toast.className = 'bg-slate-800 border border-slate-700 text-slate-100 px-5 py-3 rounded-xl shadow-2xl flex items-start gap-3 text-sm animate-fadeIn break-all';
      toast.innerHTML = `<svg class="shrink-0 mt-0.5" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> <div>${msg}</div>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    };

    const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    const Icon = ({ name, size = 20, className = "" }) => {
      const spanRef = React.useRef(null);
      React.useEffect(() => {
        if (spanRef.current && window.lucide && window.lucide.icons[name]) {
          spanRef.current.innerHTML = '';
          try {
            const svg = window.lucide.createElement(window.lucide.icons[name]);
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            svg.setAttribute('stroke-width', '2');
            if (className) svg.setAttribute('class', className);
            spanRef.current.appendChild(svg);
          } catch (e) {
            console.error("아이콘 렌더링 에러:", e);
          }
        }
      }, [name, size, className]);
      return <span ref={spanRef} className={`inline-flex items-center justify-center ${className}`} />;
    };

    const BlurInput = ({ value, onChange, placeholder, type = "text", className }) => {
      const [localValue, setLocalValue] = React.useState(value || '');
      React.useEffect(() => { setLocalValue(value || ''); }, [value]);
      return (
        <input
          type={type}
          value={localValue}
          onChange={(e) => setLocalValue(e.target.value)}
          onBlur={(e) => onChange(e.target.value)}
          placeholder={placeholder}
          className={className}
        />
      );
    };

    const BlurTextarea = ({ value, onChange, placeholder, rows = 2, className }) => {
      const [localValue, setLocalValue] = React.useState(value || '');
      React.useEffect(() => { setLocalValue(value || ''); }, [value]);
      return (
        <textarea
          rows={rows}
          value={localValue}
          onChange={(e) => setLocalValue(e.target.value)}
          onBlur={(e) => onChange(e.target.value)}
          placeholder={placeholder}
          className={className}
        />
      );
    };

    const getKSTYYYYMMDD = (dateVal) => {
      const d = new Date(dateVal);
      const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
      const kstDate = new Date(utc + (9 * 3600000));
      const year = kstDate.getFullYear();
      const month = String(kstDate.getMonth() + 1).padStart(2, '0');
      const day = String(kstDate.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const formatTime = (minutes) => {
      const m = parseInt(minutes, 10) || 0;
      if (m <= 0) return '0분';
      const hrs = Math.floor(m / 60);
      const mins = m % 60;
      if (hrs > 0 && mins > 0) return `${hrs}시간 ${mins}분`;
      if (hrs > 0) return `${hrs}시간`;
      return `${mins}분`;
    };

    const generateGoogleCalendarLink = (plan, goal) => {
      try {
        const dateStr = plan.date || getKSTYYYYMMDD(new Date());
        let timeStr = plan.timeText && plan.timeText.includes(':') ? plan.timeText : "12:00";
        let startDate = new Date(`${dateStr}T${timeStr}:00`);
        if (isNaN(startDate.getTime())) startDate = new Date(`${dateStr}T12:00:00`);

        const duration = parseInt(plan.durationPlanned, 10) || 30;
        const endDate = new Date(startDate.getTime() + duration * 60000);

        const formatGoogleDate = (date) => date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
        const dtStart = formatGoogleDate(startDate);
        const dtEnd = formatGoogleDate(endDate);

        const summary = encodeURIComponent(`[${goal?.title || '최강 목표'}] 실행 계획: ${plan.actionText}`);
        const description = encodeURIComponent(`실행 내용: ${plan.actionText}\n목표 시간: ${formatTime(plan.durationPlanned)}${plan.timeMemo ? '\n상세 메모: ' + plan.timeMemo : ''}`);

        const webUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${summary}&details=${description}&dates=${dtStart}/${dtEnd}`;
        window.open(webUrl, '_blank');
      } catch (err) {
        console.error('구글 캘린더 링크 생성 에러:', err);
      }
    };

    const generateCalendarICS = (plan, goal) => {
      try {
        const dateStr = plan.date || getKSTYYYYMMDD(new Date());
        let timeStr = plan.timeText && plan.timeText.includes(':') ? plan.timeText : "12:00";
        let startDate = new Date(`${dateStr}T${timeStr}:00`);
        if (isNaN(startDate.getTime())) startDate = new Date(`${dateStr}T12:00:00`);

        const duration = parseInt(plan.durationPlanned, 10) || 30;
        const endDate = new Date(startDate.getTime() + duration * 60000);

        const formatICSDate = (date) => date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
        const dtStart = formatICSDate(startDate);
        const dtEnd = formatICSDate(endDate);
        const dtStamp = formatICSDate(new Date());
        
        const escapeICS = (str) => {
          if (!str) return '';
          return str.toString().replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
        };

        const summary = escapeICS(`[${goal?.title || '최강 목표'}] 실행 계획: ${plan.actionText}`);
        const description = escapeICS(`실행 내용: ${plan.actionText}\n목표 시간: ${formatTime(plan.durationPlanned)}${plan.timeMemo ? '\n상세 메모: ' + plan.timeMemo : ''}`);

        const icsContent = [
          'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Goal Tracker//KR', 'CALSCALE:GREGORIAN',
          'BEGIN:VEVENT', `UID:${crypto.randomUUID()}@goaltracker`, `DTSTAMP:${dtStamp}`, `DTSTART:${dtStart}`, `DTEND:${dtEnd}`,
          `SUMMARY:${summary}`, `DESCRIPTION:${description}`,
          'BEGIN:VALARM', 'TRIGGER:-PT10M', 'ACTION:DISPLAY', 'DESCRIPTION:Reminder', 'END:VALARM',
          'END:VEVENT', 'END:VCALENDAR'
        ].join('\r\n');

        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
      } catch (err) {
        console.error('ICS 생성 에러:', err);
      }
    };

    const api = {
      auth: {
        signUp: async (email, password) => {
          if (!supabase) return { error: { message: "Supabase 연결 오류" } };
          return await supabase.auth.signUp({ email, password, options: { data: { role: 'user' } } });
        },
        signIn: async (email, password) => {
          if (!supabase) return { error: { message: "Supabase 연결 오류" } };
          return await supabase.auth.signInWithPassword({ email, password });
        },
        signOut: async () => {
          if (!supabase) return { error: null };
          return await supabase.auth.signOut();
        },
        resetPassword: async (email) => {
          if (!supabase) return { error: { message: "Supabase 연결 오류" } };
          return await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
        },
        updatePassword: async (newPassword) => {
          if (!supabase) return { error: { message: "Supabase 연결 오류" } };
          return await supabase.auth.updateUser({ password: newPassword });
        },
        getUser: async () => {
          if (!supabase) return null;
          const { data: sessionData } = await supabase.auth.getSession();
          if (!sessionData?.session) return null;
          const { data, error } = await supabase.auth.getUser();
          if (error) return null;
          return data?.user || null;
        }
      },
      data: {
        getGoals: async (userId) => {
          if (!supabase) return [];
          const { data, error } = await supabase.from('goals').select('*').eq('user_id', userId);
          if (error) { window.customAlert(`목표 조회 실패: ${error.message} / ${error.details || ''}`); throw error; }
          return data || [];
        },
        saveGoal: async (userId, goal) => {
          if (!supabase) return goal;
          const dbPayload = { ...goal, user_id: userId };
          delete dbPayload.userId;
          if (goal.id) {
            const { data, error } = await supabase.from('goals').update(dbPayload).eq('id', goal.id).select();
            if (error) { window.customAlert(`목표 수정 실패: ${error.message}`); throw error; }
            return data[0];
          } else {
            dbPayload.id = crypto.randomUUID();
            const { data, error } = await supabase.from('goals').insert(dbPayload).select();
            if (error) { window.customAlert(`목표 저장 실패: ${error.message}`); throw error; }
            return data[0];
          }
        },
        deleteGoal: async (goalId) => {
          if (!supabase) return;
          const { error } = await supabase.from('goals').delete().eq('id', goalId);
          if (error) { window.customAlert(`목표 삭제 실패: ${error.message}`); throw error; }
        },
        getPlans: async (userId) => {
          if (!supabase) return [];
          const { data, error } = await supabase.from('plans').select('*').eq('user_id', userId);
          if (error) { window.customAlert(`계획 조회 실패: ${error.message}`); throw error; }
          return data || [];
        },
        savePlan: async (userId, plan) => {
          if (!supabase) return plan;
          const { timeMemo, userId: _, ...restPlan } = plan; 
          const dbPayload = { ...restPlan, user_id: userId };
          let resultData;
          if (plan.id) {
            const { data, error } = await supabase.from('plans').update(dbPayload).eq('id', plan.id).select();
            if (error) { window.customAlert(`계획 수정 실패: ${error.message}`); throw error; }
            resultData = data[0];
          } else {
            dbPayload.id = crypto.randomUUID();
            const { data, error } = await supabase.from('plans').insert(dbPayload).select();
            if (error) { window.customAlert(`계획 저장 실패: ${error.message}`); throw error; }
            resultData = data[0];
          }
          if (timeMemo) resultData.timeMemo = timeMemo;
          return resultData;
        },
        deletePlan: async (planId) => {
          if (!supabase) return;
          const { error } = await supabase.from('plans').delete().eq('id', planId);
          if (error) { window.customAlert(`계획 삭제 실패: ${error.message}`); throw error; }
        },
        getHabits: async (userId) => {
          if (!supabase) return [];
          const { data, error } = await supabase.from('habits').select('*').eq('user_id', userId);
          if (error) { window.customAlert(`습관 조회 실패: ${error.message}`); throw error; }
          return data.map(d => ({ id: d.id, userId: d.user_id, title: d.title, time: d.exec_time, repeatDays: d.repeat_days || [] }));
        },
        saveHabit: async (userId, habit) => {
          if (!supabase) return habit;
          const parsedRepeatDays = (habit.repeatDays || []).map(d => parseInt(d, 10)).filter(n => !isNaN(n));
          const validTime = habit.time && habit.time.trim() !== '' ? habit.time : null;
          const dbPayload = { title: habit.title, exec_time: validTime, repeat_days: parsedRepeatDays, user_id: userId };
          if (habit.id) {
            const { data, error } = await supabase.from('habits').update(dbPayload).eq('id', habit.id).select();
            if (error) { window.customAlert(`습관 수정 실패: ${error.message}`); throw error; }
            window.customAlert('습관이 성공적으로 수정되었습니다!');
            return { id: data[0].id, userId: data[0].user_id, title: data[0].title, time: data[0].exec_time, repeatDays: data[0].repeat_days };
          } else {
            dbPayload.id = crypto.randomUUID();
            const { data, error } = await supabase.from('habits').insert(dbPayload).select();
            if (error) { window.customAlert(`습관 등록 실패: ${error.message}`); throw error; }
            window.customAlert('새로운 습관이 등록되었습니다!');
            return { id: data[0].id, userId: data[0].user_id, title: data[0].title, time: data[0].exec_time, repeatDays: data[0].repeat_days };
          }
        },
        deleteHabit: async (habitId) => {
          if (!supabase) return;
          const { error } = await supabase.from('habits').delete().eq('id', habitId);
          if (error) { window.customAlert(`습관 삭제 실패: ${error.message}`); throw error; }
        },
        getHabitLogs: async (userId) => {
          if (!supabase) return [];
          const { data, error } = await supabase.from('habit_logs').select('*').eq('user_id', userId);
          if (error) { window.customAlert(`습관 기록 조회 실패: ${error.message}`); throw error; }
          return data.map(d => ({ id: d.id, habitId: d.habit_id, userId: d.user_id, date: (d.completed_date || d.date || '').split('T')[0] }));
        },
        toggleHabitLog: async (userId, habitId, dateStr, isCompleted) => {
          if (!supabase) return { error: { message: "Supabase 연결 안됨" } };
          try {
            if (isCompleted) {
              const { error } = await supabase.from('habit_logs').delete().match({ habit_id: habitId, completed_date: dateStr, user_id: userId });
              if (error) throw error;
              return { success: true, action: 'deleted' };
            } else {
              const newLog = { habit_id: habitId, user_id: userId, completed_date: dateStr, is_completed: true };
              const { error } = await supabase.from('habit_logs').upsert(newLog);
              if (error) throw error;
              return { success: true, action: 'inserted' };
            }
          } catch (err) {
            window.customAlert(`체크 상태 저장 실패: ${err.message}`);
            return { error: err };
          }
        },
        /* 가계부 기능 데이터 통신 (Finance) */
        getBudget: async (userId, yearMonth) => {
          if (!supabase) return 0;
          try {
            const { data, error } = await supabase.from('budgets').select('amount').eq('user_id', userId).eq('year_month', yearMonth).maybeSingle();
            if (error) throw error;
            return data ? data.amount : 0;
          } catch (error) { console.error('예산 조회 에러:', error); return 0; }
        },
        saveBudget: async (userId, yearMonth, amount) => {
          if (!supabase) return;
          try {
            const { data: existing } = await supabase.from('budgets').select('id').eq('user_id', userId).eq('year_month', yearMonth).maybeSingle();
            if (existing) {
              const { error } = await supabase.from('budgets').update({ amount }).eq('id', existing.id);
              if (error) throw error;
            } else {
              const { error } = await supabase.from('budgets').insert({ user_id: userId, year_month: yearMonth, amount });
              if (error) throw error;
            }
            window.customAlert('목표 예산이 저장되었습니다.');
          } catch (error) { window.customAlert(`예산 저장 실패: ${error.message}`); }
        },
        getExpenses: async (userId, startDate, endDate) => {
          if (!supabase) return [];
          try {
            const { data, error } = await supabase.from('expenses')
              .select('*').eq('user_id', userId).gte('date', startDate).lte('date', endDate).order('date', { ascending: false });
            if (error) throw error;
            return data || [];
          } catch (error) { console.error('지출내역 조회 에러:', error); return []; }
        },
        saveExpense: async (userId, expenseData) => {
          if (!supabase) return null;
          try {
            const dbPayload = {
              user_id: userId,
              date: expenseData.date,
              type: expenseData.type,
              description: expenseData.description,
              amount: expenseData.amount,
              is_receipted: expenseData.is_receipted || false
            };
            const { data, error } = await supabase.from('expenses').insert(dbPayload).select();
            if (error) throw error;
            return data[0];
          } catch (error) { window.customAlert(`지출내역 저장 실패: ${error.message}`); return null; }
        },
        deleteExpense: async (expenseId) => {
          if (!supabase) return;
          try {
            const { error } = await supabase.from('expenses').delete().eq('id', expenseId);
            if (error) throw error;
          } catch (error) { window.customAlert(`삭제 실패: ${error.message}`); throw error; }
        },
        toggleExpenseReceipt: async (expenseId, isReceipted) => {
          if (!supabase) return;
          try {
            const { error } = await supabase.from('expenses').update({ is_receipted: isReceipted }).eq('id', expenseId);
            if (error) throw error;
          } catch (error) { window.customAlert(`영수 상태 변경 실패: ${error.message}`); throw error; }
        },
        /* 메모 기능 데이터 통신 (Memos) */
        getMemos: async (userId) => {
          if (!supabase) return [];
          try {
            const { data, error } = await supabase.from('memos').select('*').eq('user_id', userId).order('sort_order', { ascending: true });
            if (error) throw error;
            return data || [];
          } catch (error) { console.error('메모 조회 에러:', error); return []; }
        },
        saveMemo: async (userId, memo) => {
          if (!supabase) return memo;
          try {
            const dbPayload = { user_id: userId, title: memo.title, content: memo.content, date: memo.date, sort_order: memo.sort_order || 0 };
            if (memo.id) {
              const { data, error } = await supabase.from('memos').update(dbPayload).eq('id', memo.id).select();
              if (error) throw error;
              return data[0];
            } else {
              dbPayload.id = crypto.randomUUID();
              const { data, error } = await supabase.from('memos').insert(dbPayload).select();
              if (error) throw error;
              return data[0];
            }
          } catch (error) { window.customAlert(`메모 저장 실패: ${error.message}`); throw error; }
        },
        deleteMemo: async (memoId) => {
          if (!supabase) return;
          try {
            const { error } = await supabase.from('memos').delete().eq('id', memoId);
            if (error) throw error;
          } catch (error) { window.customAlert(`메모 삭제 실패: ${error.message}`); throw error; }
        },
        updateMemoOrders: async (memos) => {
          if (!supabase || !memos || memos.length === 0) return;
          try {
            await Promise.all(memos.map((m, idx) => supabase.from('memos').update({ sort_order: idx }).eq('id', m.id)));
          } catch (error) { console.error('메모 순서 저장 에러:', error); }
        }
      }
    };

    const CustomModal = ({ isOpen, title, children, onClose }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fadeIn">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl text-slate-100 flex flex-col max-h-[90vh]">
            <div className="flex justify-between items-center px-6 py-4 border-b border-slate-800 shrink-0">
              <h3 className="text-lg font-bold text-white">{title}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition">
                <Icon name="X" size={20} />
              </button>
            </div>
            <div className="p-6 overflow-y-auto custom-scrollbar">{children}</div>
          </div>
        </div>
      );
    };

    const ConfirmModal = ({ isOpen, message, onConfirm, onClose, isProcessing }) => (
      <CustomModal isOpen={isOpen} title="확인" onClose={onClose}>
        <p className="text-sm text-slate-300 mb-6">{message}</p>
        <div className="flex justify-end gap-3">
          <button onClick={onClose} disabled={isProcessing} className="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium rounded-xl transition disabled:opacity-50">취소</button>

    const GoalFormModal = ({ isOpen, onClose, onSave, goal }) => {

        else { setTitle(''); setCategory('커리어'); setDeadline(''); setMilestones([]); }
        setIsSubmitting(false); setDraggedIndex(null); setDraggedOverIndex(null);
      }, [goal, isOpen]);

      if (!isOpen) return null;

      const handleAddMilestone = () => setMilestones([...milestones, { id: crypto.randomUUID(), title: '', deadline: '', completed: false }]);
      const handleUpdateMilestone = (id, field, value) => setMilestones(milestones.map(m => m.id === id ? { ...m, [field]: value } : m));
      const handleRemoveMilestone = (id) => setMilestones(milestones.filter(m => m.id !== id));
      
      const handleDragStart = (e, index) => { setDraggedIndex(index); e.dataTransfer.effectAllowed = "move"; };
      const handleDragOver = (e, index) => { e.preventDefault(); if (draggedIndex !== null && draggedIndex !== index) setDraggedOverIndex(index); };
      const handleDrop = (e, index) => {
        e.preventDefault();
        if (draggedIndex === null || draggedIndex === index) return;
        const updated = [...milestones]; const item = updated.splice(draggedIndex, 1)[0]; updated.splice(index, 0, item);
        setMilestones(updated); setDraggedIndex(null); setDraggedOverIndex(null);
      };
      const handleDragEnd = () => { setDraggedIndex(null); setDraggedOverIndex(null); };

      const handleSubmit = async (e) => {
        e.preventDefault(); if (isSubmitting) return; setIsSubmitting(true);
        try { const validMilestones = (milestones || []).filter(m => m && m.id && m.title.trim() !== ''); await onSave({ id: goal?.id, title, category, deadline, milestones: validMilestones }); onClose(); }

      return (

    const GoalsView = ({ goals, onSaveGoal, onToggleComplete, onDeleteGoal }) => {
      const [selectedGoal, setSelectedGoal] = React.useState(null);
      const [isModalOpen, setIsModalOpen] = React.useState(false);
      const [goalToDelete, setGoalToDelete] = React.useState(null);
      const [processingIds, setProcessingIds] = React.useState(new Set());
      const [isDeleting, setIsDeleting] = React.useState(false);

      const confirmDelete = async () => { if (goalToDelete) { setIsDeleting(true); try { await onDeleteGoal(goalToDelete); } finally { setGoalToDelete(null); setIsDeleting(false); } } };
      const handleToggle = async (e, goal) => {
        e.stopPropagation(); if (processingIds.has(goal.id)) return; setProcessingIds(prev => new Set(prev).add(goal.id));
        try { await onToggleComplete(goal); } finally { setProcessingIds(prev => { const next = new Set(prev); next.delete(goal.id); return next; }); }
      };
      const calculateDDay = (deadline) => {
        if (!deadline) return '';
        const today = new Date(); today.setHours(0,0,0,0); const target = new Date(deadline); target.setHours(0,0,0,0);
        const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
        if (diff === 0) return 'D-Day'; return diff > 0 ? `D-${diff}` : `D+${Math.abs(diff)}`;
      };

      return (
        <div className="space-y-6 relative z-10">
          <ConfirmModal isOpen={!!goalToDelete} message="목표를 삭제하시겠습니까? 연관된 계획도 영향받을 수 있습니다." onConfirm={confirmDelete} onClose={() => setGoalToDelete(null)} isProcessing={isDeleting} />
          <div className="flex justify-between items-center">
            <div><h2 className="text-xl font-bold text-white">목표 현황</h2><p className="text-xs text-slate-400">명확한 목표와 중간 단계를 수립해 성과를 창출하세요.</p></div>
            <button onClick={() => { setSelectedGoal(null); setIsModalOpen(true); }} className="px-4 py-2 bg-orange-600 hover:bg-orange-500 text-white text-xs font-medium rounded-xl flex items-center gap-1.5 shadow-lg shadow-orange-600/20"><Icon name="Plus" size={16} /> 목표 추가</button>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

            ) : (
              goals.map(goal => {
                const dDay = calculateDDay(goal.deadline); const isOverdue = dDay.startsWith('D+'); const milestones = goal.milestones || []; const completedCount = milestones.filter(m => m.completed).length; const isProcessing = processingIds.has(goal.id);
                return (
                  <div key={goal.id} className={`bg-slate-900 border border-slate-800 p-5 rounded-2xl transition group flex flex-col justify-between ${goal.is_completed ? 'opacity-60 grayscale-[30%]' : 'hover:border-slate-700'}`}>

                      <div className="flex justify-between items-start mb-3">
                        <div className="flex items-center gap-2">
                          <button onClick={(e) => handleToggle(e, goal)} disabled={isProcessing} className={`flex items-center justify-center w-5 h-5 rounded border transition disabled:opacity-50 ${goal.is_completed ? 'bg-orange-500 border-orange-500 text-white' : 'border-slate-500 text-transparent hover:border-orange-500'}`}><Icon name={isProcessing ? "Loader2" : "Check"} size={14} className={isProcessing ? "animate-spin text-white" : ""} /></button>

                        </div>
                        <div className="flex items-center gap-2">
                          <span className={`text-xs font-bold px-2 py-0.5 rounded-md ${isOverdue && !goal.is_completed ? 'bg-red-500/10 text-red-400 border border-red-500/20' : 'bg-slate-800 text-slate-400'}`}>{dDay}</span>
                          <button onClick={(e) => { e.stopPropagation(); setGoalToDelete(goal.id); }} className="text-slate-500 hover:text-red-400 p-1"><Icon name="Trash2" size={16} /></button>
                        </div>
                      </div>
                      <div className="cursor-pointer" onClick={() => { setSelectedGoal(goal); setIsModalOpen(true); }}><h3 className={`font-bold text-base transition mb-2 ${goal.is_completed ? 'text-slate-400 line-through' : 'text-white group-hover:text-orange-400'}`}>{goal.title}</h3></div>

    const ExecutionView = ({ goals, onSavePlan }) => {

    const JournalView = ({ plans, goals, onUpdatePlan, onDeletePlan }) => {

        if (processingIds.has(plan.id)) return; setProcessingIds(prev => new Set(prev).add(plan.id));
        try { const isCompleted = plan.status === 'completed'; await onUpdatePlan({ ...plan, status: isCompleted ? 'planned' : 'completed' }); }

      const sortedPlans = React.useMemo(() => [...plans].sort((a, b) => a.date > b.date ? -1 : a.date < b.date ? 1 : 0), [plans]);

    const HabitFormModal = ({ isOpen, onClose, onSave, habit }) => {

    const HabitsView = ({ habits, habitLogs, onSaveHabit, onDeleteHabit, onToggleHabitLog }) => {
      const [selectedDateObj, setSelectedDateObj] = React.useState(new Date());
      const [isModalOpen, setIsModalOpen] = React.useState(false);
      const [editingHabit, setEditingHabit] = React.useState(null);
      const [habitToDelete, setHabitToDelete] = React.useState(null);
      const [processingIds, setProcessingIds] = React.useState(new Set());
      const [isDeleting, setIsDeleting] = React.useState(false);

      const weekDates = React.useMemo(() => {
        const d = new Date(); const day = d.getDay(); const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        d.setDate(diff); const dates = []; for (let i = 0; i < 7; i++) { dates.push(new Date(d)); d.setDate(d.getDate() + 1); }
        return dates;
      }, []);

      const dayLabels = ['일', '월', '화', '수', '목', '금', '토'];
      const selectedDateStr = getKSTYYYYMMDD(selectedDateObj);
      const selectedDayInt = selectedDateObj.getDay();
      const dailyHabits = habits.filter(h => h.repeatDays && h.repeatDays.includes(selectedDayInt));

      const getLast7ExpectedDates = (habit) => {
        const dates = []; const curr = new Date(selectedDateObj); let iters = 0;
        while(dates.length < 7 && iters < 60) { 
          if (habit.repeatDays.includes(curr.getDay())) dates.unshift(getKSTYYYYMMDD(curr));
          curr.setDate(curr.getDate() - 1); iters++;
        }
        return dates;
      };

      const confirmDelete = async () => { if (habitToDelete) { setIsDeleting(true); try { await onDeleteHabit(habitToDelete); } finally { setHabitToDelete(null); setIsDeleting(false); } } };
      const handleToggleLog = async (habitId, dateStr, isCompleted) => {
        if (processingIds.has(habitId)) return; setProcessingIds(prev => new Set(prev).add(habitId));
        try { await onToggleHabitLog(habitId, dateStr, isCompleted); } finally { setProcessingIds(prev => { const next = new Set(prev); next.delete(habitId); return next; }); }
      };

      return (
        <div className="space-y-6 relative z-10">
          <ConfirmModal isOpen={!!habitToDelete} message="습관을 삭제하시겠습니까? 누적된 달성 기록도 함께 사라집니다." onConfirm={confirmDelete} onClose={() => setHabitToDelete(null)} isProcessing={isDeleting} />

            <div><h2 className="text-xl font-bold text-white">일일 습관</h2><p className="text-xs text-slate-400">꾸준한 반복으로 강력한 성장을 만드세요.</p></div>
            <button onClick={() => { setEditingHabit(null); setIsModalOpen(true); }} className="px-4 py-2 bg-orange-600 hover:bg-orange-500 text-white text-xs font-medium rounded-xl flex items-center gap-1.5 shadow-lg shadow-orange-600/20"><Icon name="Plus" size={16} /> 습관 추가</button>
          </div>
          <div className="flex justify-between items-center bg-slate-900 border border-slate-800 rounded-2xl p-2">
            {weekDates.map(d => {
              const isSelected = getKSTYYYYMMDD(d) === selectedDateStr; const isToday = getKSTYYYYMMDD(d) === getKSTYYYYMMDD(new Date());
              return (
                <button key={d.toISOString()} onClick={() => setSelectedDateObj(new Date(d))} className={`flex flex-col items-center p-2 rounded-xl min-w-[3rem] transition ${isSelected ? 'bg-orange-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                  <span className="text-[10px] mb-1">{dayLabels[d.getDay()]}</span><span className={`text-sm font-bold ${isToday && !isSelected ? 'text-orange-400' : ''}`}>{d.getDate()}</span>
                </button>
              );
            })}
          </div>
          <div className="space-y-4">
            {dailyHabits.length === 0 ? (
              <div className="py-12 text-center bg-slate-900/50 border border-slate-800/80 rounded-2xl"><Icon name="Activity" size={40} className="text-slate-600 mb-2 mx-auto" /><p className="text-sm text-slate-400">이 날짜에 계획된 습관이 없습니다.</p></div>
            ) : (
              dailyHabits.map(habit => {
                const isCompleted = habitLogs.some(log => log.habitId === habit.id && log.date === selectedDateStr);
                const isProcessing = processingIds.has(habit.id);
                const last7Dates = getLast7ExpectedDates(habit); let successCount = 0;
                const dotElements = last7Dates.map(dateStr => {
                  const done = habitLogs.some(log => log.habitId === habit.id && log.date === dateStr); if (done) successCount++;
                  return <div key={dateStr} className={`w-2.5 h-2.5 rounded-full ${done ? 'bg-orange-500 shadow-[0_0_8px_rgba(249,115,22,0.6)]' : 'bg-slate-700'}`} title={`${dateStr}: ${done?'완료':'미완료'}`}></div>;
                });
                return (
                  <div key={habit.id} className={`bg-slate-900 border border-slate-800 p-5 rounded-2xl transition group flex flex-col justify-between ${isCompleted ? 'opacity-70' : 'hover:border-slate-700'}`}>
                    <div className="flex justify-between items-start">
                      <div className="flex items-center gap-3">
                        <button onClick={() => handleToggleLog(habit.id, selectedDateStr, isCompleted)} disabled={isProcessing} className={`flex-shrink-0 flex items-center justify-center w-6 h-6 rounded border transition disabled:opacity-50 ${isCompleted ? 'bg-orange-500 border-orange-500 text-white' : 'border-slate-500 text-transparent hover:border-orange-500'}`}><Icon name={isProcessing ? "Loader2" : "Check"} size={16} className={isProcessing ? "animate-spin text-white" : ""} /></button>
                        <div><span className="text-[10px] text-orange-400 font-semibold mb-0.5 block">{habit.time}</span><h4 className={`text-base font-bold transition ${isCompleted ? 'text-slate-400 line-through' : 'text-white'}`}>{habit.title}</h4></div>
                      </div>
                      <div className="flex items-center gap-1">
                        <button onClick={() => { setEditingHabit(habit); setIsModalOpen(true); }} className="text-slate-500 hover:text-white p-1.5 rounded-lg hover:bg-slate-800 transition"><Icon name="Edit2" size={16} /></button>
                        <button onClick={() => setHabitToDelete(habit.id)} className="text-slate-500 hover:text-red-400 p-1.5 rounded-lg hover:bg-slate-800 transition"><Icon name="Trash2" size={16} /></button>
                      </div>
                    </div>
                    <div className="pt-4 border-t border-slate-800/80 mt-4 flex items-center justify-between">
                      <span className="text-[10px] text-slate-400 font-medium">최근 7회 중 <span className="text-white font-bold">{successCount}</span>회 완료</span><div className="flex gap-1.5">{dotElements}</div>
                    </div>
                  </div>
                );
              })
            )}
          </div>
          <HabitFormModal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} onSave={onSaveHabit} habit={editingHabit} />
        </div>
      );
    };

    const FinanceView = ({ user }) => {
      const [currentDate, setCurrentDate] = React.useState(new Date());
      const [budgetAmount, setBudgetAmount] = React.useState('');
      const [isEditingBudget, setIsEditingBudget] = React.useState(false);
      const [expenses, setExpenses] = React.useState([]);
      const [isLoading, setIsLoading] = React.useState(true);

      // Form State
      const [expDate, setExpDate] = React.useState(getKSTYYYYMMDD(new Date()));
      const [expType, setExpType] = React.useState('지출');
      const [expDesc, setExpDesc] = React.useState('');
      const [expAmount, setExpAmount] = React.useState('');
      const [isSubmitting, setIsSubmitting] = React.useState(false);

      // Calculate date range for current month selection
      const getDateRangeInfo = (dateObj) => {
        const year = dateObj.getFullYear();
        const month = dateObj.getMonth(); 
        
        let prevYear = year;
        let prevMonth = month - 1;
        if (prevMonth < 0) { prevMonth = 11; prevYear -= 1; }
        
        const startStr = `${prevYear}-${String(prevMonth + 1).padStart(2, '0')}-25`;
        const endStr = `${year}-${String(month + 1).padStart(2, '0')}-24`;
        const yearMonth = `${year}-${String(month + 1).padStart(2, '0')}`;
        return { startStr, endStr, yearMonth, displayStr: `${year}년 ${month + 1}월` };
      };

      const rangeInfo = React.useMemo(() => getDateRangeInfo(currentDate), [currentDate]);

      React.useEffect(() => {
        const loadFinanceData = async () => {
          setIsLoading(true);
          try {
            const fetchedBudget = await api.data.getBudget(user.id, rangeInfo.yearMonth);
            setBudgetAmount(fetchedBudget || '');
            const fetchedExpenses = await api.data.getExpenses(user.id, rangeInfo.startStr, rangeInfo.endStr);
            setExpenses(fetchedExpenses);
            setExpDate(getKSTYYYYMMDD(new Date()));
          } catch (e) {
            console.error(e);
          } finally {
            setIsLoading(false);
          }
        };
        loadFinanceData();
      }, [user.id, rangeInfo.yearMonth, rangeInfo.startStr, rangeInfo.endStr]);

      const handlePrevMonth = () => { const newD = new Date(currentDate); newD.setMonth(newD.getMonth() - 1); setCurrentDate(newD); };
      const handleNextMonth = () => { const newD = new Date(currentDate); newD.setMonth(newD.getMonth() + 1); setCurrentDate(newD); };

      const handleSaveBudget = async () => {
        const numAmount = Number(budgetAmount) || 0;
        await api.data.saveBudget(user.id, rangeInfo.yearMonth, numAmount);
        setIsEditingBudget(false);
      };

      const handleAddExpense = async (e) => {
        e.preventDefault();
        if (!expDesc.trim() || !expAmount) return;
        setIsSubmitting(true);
        const newExp = { date: expDate, type: expType, description: expDesc, amount: Number(expAmount), is_receipted: false };
        const savedExp = await api.data.saveExpense(user.id, newExp);
        if (savedExp) setExpenses(prev => [savedExp, ...prev].sort((a,b) => a.date > b.date ? -1 : 1));
        setExpDesc(''); setExpAmount(''); setIsSubmitting(false);
      };

      const handleDeleteExpense = async (id) => {
        if (!confirm('정말 삭제하시겠습니까?')) return;
        await api.data.deleteExpense(id);
        setExpenses(prev => prev.filter(e => e.id !== id));
      };

      const handleToggleReceipt = async (id, currentStatus) => {
        await api.data.toggleExpenseReceipt(id, !currentStatus);
        setExpenses(prev => prev.map(e => e.id === id ? { ...e, is_receipted: !currentStatus } : e));
      };

      const totalExpense = expenses.filter(e => e.type === '지출').reduce((sum, e) => sum + Number(e.amount), 0);
      const remainingBudget = (Number(budgetAmount) || 0) - totalExpense;
      const totalUnpaidBills = expenses.filter(e => e.type === '청구' && !e.is_receipted).reduce((sum, e) => sum + Number(e.amount), 0);

      if (isLoading) return <div className="py-12 flex justify-center"><Icon name="Loader2" className="animate-spin text-orange-500" size={32} /></div>;

      return (
        <div className="space-y-6 relative z-10">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl font-bold text-white flex items-center gap-2"><Icon name="DollarSign" size={20} className="text-orange-500"/> 가계부</h2>
              <p className="text-xs text-slate-400">목표 예산과 지출내역을 효율적으로 관리하세요.</p>
            </div>
            <div className="flex items-center bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 shrink-0">
              <button onClick={handlePrevMonth} className="text-slate-400 hover:text-white p-1"><Icon name="ChevronLeft" size={18}/></button>
              <div className="px-4 text-center">
                <div className="text-sm font-bold text-white w-24">{rangeInfo.displayStr}</div>
                <div className="text-[10px] text-slate-500 tracking-tighter">{rangeInfo.startStr} ~ {rangeInfo.endStr}</div>
              </div>
              <button onClick={handleNextMonth} className="text-slate-400 hover:text-white p-1"><Icon name="ChevronRight" size={18}/></button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col justify-center">
              <span className="text-xs text-slate-400 block mb-1">이번 달 목표 예산</span>
              {isEditingBudget ? (
                <div className="flex gap-2 mt-1">
                  <input type="number" value={budgetAmount} onChange={e => setBudgetAmount(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-white text-lg font-bold focus:outline-none focus:border-orange-500" autoFocus />
                  <button onClick={handleSaveBudget} className="px-3 bg-orange-600 hover:bg-orange-500 text-white rounded-lg text-xs font-semibold">저장</button>
                </div>
              ) : (
                <div className="flex items-center justify-between mt-1 group">
                  <span className="text-3xl font-black text-white">{Number(budgetAmount || 0).toLocaleString()}원</span>
                  <button onClick={() => setIsEditingBudget(true)} className="text-slate-500 opacity-0 group-hover:opacity-100 transition"><Icon name="Edit2" size={18}/></button>
                </div>
              )}
            </div>
            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
              <span className="text-xs text-slate-400 block mb-1">남은 예산</span>
              <span className={`text-3xl font-black mt-1 block ${remainingBudget < 0 ? 'text-red-400' : 'text-emerald-400'}`}>
                {remainingBudget < 0 ? '-' : ''}{Math.abs(remainingBudget).toLocaleString()}원
              </span>
              <p className="text-[10px] text-slate-500 mt-2">총 지출: {totalExpense.toLocaleString()}원</p>
            </div>
            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl relative overflow-hidden">
              <div className="absolute -right-4 -bottom-4 opacity-5"><Icon name="CreditCard" size={100}/></div>
              <span className="text-xs text-slate-400 block mb-1 relative z-10">미결제 청구액 (영수 미체크)</span>
              <span className="text-3xl font-black text-orange-400 mt-1 block relative z-10">{totalUnpaidBills.toLocaleString()}원</span>
            </div>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
            <h3 className="text-sm font-bold text-white mb-4">내역 등록</h3>
            <form onSubmit={handleAddExpense} className="grid grid-cols-1 sm:grid-cols-5 gap-3">
              <input type="date" required value={expDate} onChange={e => setExpDate(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-orange-500" />
              <select value={expType} onChange={e => setExpType(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-orange-500">
                <option value="지출">일반 지출</option>
                <option value="청구">청구 (신용카드 등)</option>
              </select>
              <input type="text" required placeholder="지출/청구 내용" value={expDesc} onChange={e => setExpDesc(e.target.value)} className="w-full sm:col-span-2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-orange-500" />
              <div className="flex gap-2 w-full">
                <input type="number" required placeholder="금액" value={expAmount} onChange={e => setExpAmount(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-orange-500" />
                <button type="submit" disabled={isSubmitting} className="shrink-0 px-4 bg-orange-600 hover:bg-orange-500 text-white rounded-xl text-xs font-bold transition disabled:opacity-50"><Icon name="Plus" size={16}/></button>
              </div>
            </form>
          </div>

          <div className="space-y-3">
            <h3 className="text-sm font-bold text-white px-1">상세 내역</h3>
            {expenses.length === 0 ? (
               <div className="py-10 text-center bg-slate-900/50 border border-slate-800/80 rounded-2xl">
                 <Icon name="FileText" size={40} className="text-slate-600 mb-2 mx-auto" />
                 <p className="text-sm text-slate-400">등록된 내역이 없습니다.</p>
               </div>
            ) : (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg">
                <div className="hidden sm:grid grid-cols-12 gap-2 p-4 bg-slate-950 border-b border-slate-800 text-xs font-semibold text-slate-400">
                  <div className="col-span-2">날짜</div>
                  <div className="col-span-2">유형</div>
                  <div className="col-span-4">내용</div>
                  <div className="col-span-3 text-right">금액</div>
                  <div className="col-span-1 text-center">관리</div>
                </div>
                {expenses.map((exp) => (
                  <div key={exp.id} className={`p-4 border-b border-slate-800/50 transition hover:bg-slate-800/30 flex flex-col sm:grid sm:grid-cols-12 gap-3 sm:gap-2 items-start sm:items-center ${exp.is_receipted && exp.type==='청구' ? 'opacity-60' : ''}`}>
                    <div className="col-span-2 text-xs text-slate-300 font-medium shrink-0">{exp.date}</div>
                    <div className="col-span-2 flex shrink-0">
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md border ${exp.type === '청구' ? 'bg-blue-500/10 text-blue-400 border-blue-500/20' : 'bg-orange-500/10 text-orange-400 border-orange-500/20'}`}>{exp.type}</span>
                    </div>
                    <div className="col-span-4 text-sm text-white font-medium w-full truncate">{exp.description}</div>
                    <div className="col-span-3 text-sm font-bold w-full sm:text-right text-slate-200">{Number(exp.amount).toLocaleString()}원</div>
                    <div className="col-span-1 flex items-center justify-end w-full gap-3 sm:justify-center">
                      {exp.type === '청구' && (
                        <label className="flex items-center gap-1.5 cursor-pointer" title="영수 완료">
                          <input type="checkbox" checked={exp.is_receipted} onChange={() => handleToggleReceipt(exp.id, exp.is_receipted)} className="w-4 h-4 rounded bg-slate-900 border-slate-700 text-orange-500 focus:ring-0" />
                          <span className="text-[10px] text-slate-400 sm:hidden">영수(지불)</span>
                        </label>
                      )}
                      <button onClick={() => handleDeleteExpense(exp.id)} className="text-slate-500 hover:text-red-400 p-1"><Icon name="Trash2" size={16}/></button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    };

    const StatsView = ({ plans, goals }) => {
      const [filter, setFilter] = React.useState('weekly');
      const completedPlans = plans.filter(p => p.status === 'completed');
      const totalPlannedTime = plans.reduce((acc, p) => acc + (parseInt(p.durationPlanned, 10) || 0), 0);
      const totalActualTime = completedPlans.reduce((acc, p) => acc + (parseInt(p.durationActual, 10) || 0), 0);
      const completionRate = plans.length > 0 ? Math.round((completedPlans.length / plans.length) * 100) : 0;

      return (
        <div className="space-y-6 relative z-10">
          <div className="flex justify-between items-center">
            <div><h2 className="text-xl font-bold text-white">통계 리포트</h2><p className="text-xs text-slate-400">달성 추이와 투입 시간을 모니터링합니다.</p></div>
            <div className="flex bg-slate-900 border border-slate-800 rounded-xl p-1 text-xs">
              {['weekly', 'monthly', 'yearly'].map(type => (
                <button key={type} onClick={() => setFilter(type)} className={`px-3 py-1.5 rounded-lg capitalize ${filter === type ? 'bg-orange-600 text-white' : 'text-slate-400 hover:text-white transition'}`}>
                  {type === 'weekly' ? '주간' : type === 'monthly' ? '월간' : '연간'}
                </button>
              ))}
            </div>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl"><span className="text-xs text-slate-400 block mb-1">종합 달성률</span><span className="text-3xl font-black text-orange-400">{completionRate}%</span><p className="text-[10px] text-slate-500 mt-2">총 {plans.length}개 계획 중 {completedPlans.length}개 완료</p></div>
            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl"><span className="text-xs text-slate-400 block mb-1">계획된 목표 시간</span><span className="text-3xl font-black text-white">{formatTime(totalPlannedTime)}</span></div>
            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl"><span className="text-xs text-slate-400 block mb-1">실제 순수 투입 시간</span><span className="text-3xl font-black text-emerald-400">{formatTime(totalActualTime)}</span></div>
        </div>
      </div>
      );
    };

    const MemoModal = ({ isOpen, onClose, onSave, memo }) => {
      const [title, setTitle] = React.useState('');
      const [content, setContent] = React.useState('');
      const [date, setDate] = React.useState(getKSTYYYYMMDD(new Date()));
      const [isSubmitting, setIsSubmitting] = React.useState(false);

      React.useEffect(() => {
        if (memo) {
          setTitle(memo.title || '');
          setContent(memo.content || '');
          setDate(memo.date || getKSTYYYYMMDD(new Date()));
        } else {
          setTitle('');
          setContent('');
          setDate(getKSTYYYYMMDD(new Date()));
        }
        setIsSubmitting(false);
      }, [memo, isOpen]);

      if (!isOpen) return null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (isSubmitting) return;
        setIsSubmitting(true);
        try {
          await onSave({ id: memo?.id, title, content, date, sort_order: memo?.sort_order });
          onClose();
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <CustomModal isOpen={isOpen} title={memo ? "메모 수정" : "새 메모 작성"} onClose={onClose}>
          <form onSubmit={handleSubmit} className="space-y-4">
            <div>
              <label className="block text-xs font-medium text-slate-400 mb-1">메모 제목</label>
              <input type="text" required value={title} onChange={(e) => setTitle(e.target.value)} placeholder="제목을 입력하세요" className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-orange-500" />
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-400 mb-1">작성 일자</label>
              <input type="date" required value={date} onChange={(e) => setDate(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-orange-500" />
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-400 mb-1">메모 내용</label>
              <textarea required rows="6" value={content} onChange={(e) => setContent(e.target.value)} placeholder="내용을 자세히 기록하세요..." className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-orange-500 custom-scrollbar"></textarea>
            </div>
            <div className="pt-2 flex justify-end gap-2 border-t border-slate-800">
              <button type="button" onClick={onClose} disabled={isSubmitting} className="px-4 py-2 text-xs font-medium text-slate-400 hover:text-white bg-slate-800 rounded-lg disabled:opacity-50">취소</button>
              <button type="submit" disabled={isSubmitting} className="px-4 py-2 text-xs font-medium text-white bg-orange-600 hover:bg-orange-500 rounded-lg shadow-lg shadow-orange-600/20 disabled:opacity-50">{isSubmitting ? '저장 중...' : '저장하기'}</button>
            </div>
          </form>
        </CustomModal>
      );
    };

    const MemoView = ({ memos, onSaveMemo, onDeleteMemo, onUpdateOrders }) => {
      const [isModalOpen, setIsModalOpen] = React.useState(false);
      const [selectedMemo, setSelectedMemo] = React.useState(null);
      const [memoToDelete, setMemoToDelete] = React.useState(null);
      const [isDeleting, setIsDeleting] = React.useState(false);
      
      const [localMemos, setLocalMemos] = React.useState([]);
      const [draggedIndex, setDraggedIndex] = React.useState(null);
      const [draggedOverIndex, setDraggedOverIndex] = React.useState(null);

      React.useEffect(() => {
        setLocalMemos([...memos]);
      }, [memos]);

      const confirmDelete = async () => {
        if (memoToDelete) {
          setIsDeleting(true);
          try { await onDeleteMemo(memoToDelete); } 
          finally { setMemoToDelete(null); setIsDeleting(false); setIsModalOpen(false); }
        }
      };

      const handleDragStart = (e, index) => { setDraggedIndex(index); e.dataTransfer.effectAllowed = "move"; };
      const handleDragOver = (e, index) => { e.preventDefault(); if (draggedIndex !== null && draggedIndex !== index) setDraggedOverIndex(index); };
      const handleDrop = (e, index) => {
        e.preventDefault();
        if (draggedIndex === null || draggedIndex === index) return;
        const updated = [...localMemos]; 
        const item = updated.splice(draggedIndex, 1)[0]; 
        updated.splice(index, 0, item);
        setLocalMemos(updated);
        onUpdateOrders(updated);
        setDraggedIndex(null); 
        setDraggedOverIndex(null);
      };
      const handleDragEnd = () => { setDraggedIndex(null); setDraggedOverIndex(null); };

      return (
        <div className="space-y-6 relative z-10">
          <ConfirmModal isOpen={!!memoToDelete} message="메모를 완전히 삭제하시겠습니까?" onConfirm={confirmDelete} onClose={() => setMemoToDelete(null)} isProcessing={isDeleting} />
          <MemoModal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} onSave={onSaveMemo} memo={selectedMemo} />
          
          <div className="flex justify-between items-center">
            <div>
              <h2 className="text-xl font-bold text-white flex items-center gap-2"><Icon name="FileText" size={20} className="text-orange-500"/> 자유 메모</h2>
              <p className="text-xs text-slate-400">자유롭게 아이디어를 기록하고 드래그하여 순서를 변경하세요.</p>
            </div>
            <button onClick={() => { setSelectedMemo(null); setIsModalOpen(true); }} className="px-4 py-2 bg-orange-600 hover:bg-orange-500 text-white text-xs font-medium rounded-xl flex items-center gap-1.5 shadow-lg shadow-orange-600/20"><Icon name="Plus" size={16} /> 새 메모</button>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {localMemos.length === 0 ? (
               <div className="col-span-full py-12 text-center bg-slate-900/50 border border-slate-800/80 rounded-2xl">
                 <Icon name="FileText" size={40} className="text-slate-600 mb-2 mx-auto" />
                 <p className="text-sm text-slate-400">등록된 메모가 없습니다.</p>
               </div>
            ) : (
              localMemos.map((memo, idx) => (
                <div 
                  key={memo.id} 
                  draggable 
                  onDragStart={(e) => handleDragStart(e, idx)} 
                  onDragOver={(e) => handleDragOver(e, idx)} 
                  onDrop={(e) => handleDrop(e, idx)} 
                  onDragEnd={handleDragEnd}
                  className={`bg-slate-900 border border-slate-800 p-5 rounded-2xl transition flex flex-col justify-between cursor-pointer hover:border-slate-700 relative group 
                    ${draggedOverIndex === idx ? 'border-orange-500 bg-slate-800/50' : ''} 
                    ${draggedIndex === idx ? 'opacity-50' : ''}`}
                  onClick={() => { setSelectedMemo(memo); setIsModalOpen(true); }}
                >
                  <div className="absolute top-4 right-4 text-slate-600 group-hover:text-slate-400 transition cursor-grab"><Icon name="GripHorizontal" size={16}/></div>
                  <div>
                    <h3 className="font-bold text-base text-white mb-2 pr-6 line-clamp-1 group-hover:text-orange-400 transition">{memo.title}</h3>
                    <p className="text-xs text-slate-400 line-clamp-3 mb-4">{memo.content}</p>
                  </div>
                  <div className="pt-3 border-t border-slate-800/80 flex items-center justify-between text-[10px] text-slate-500">
                <span>{memo.date}</span>
                <button type="button" onClick={(e) => { e.stopPropagation(); setMemoToDelete(memo.id); }} className="hover:text-red-400 p-1 transition rounded"><Icon name="Trash2" size={14} /></button>
              </div>
            </div>
          ))
        )}
      </div>
    </div>
  );
};

const App = () => {
  const [user, setUser] = React.useState(null);
  const [currentTab, setCurrentTab] = React.useState('goals');
      const [isLoading, setIsLoading] = React.useState(true);
      
      const [goals, setGoals] = React.useState([]);
      const [plans, setPlans] = React.useState([]);
      const [habits, setHabits] = React.useState([]);
      const [habitLogs, setHabitLogs] = React.useState([]);
      const [memos, setMemos] = React.useState([]);
      const [isResetModalOpen, setIsResetModalOpen] = React.useState(false);
      
      const [isDropdownOpen, setIsDropdownOpen] = React.useState(false);
      const dropdownRef = React.useRef(null);

      React.useEffect(() => {
        const handleClickOutside = (e) => { if (dropdownRef.current && !dropdownRef.current.contains(e.target)) setIsDropdownOpen(false); };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      React.useEffect(() => {
        const handleHashChange = () => { const hash = window.location.hash; if (hash && (hash.includes('type=recovery') || hash.includes('access_token='))) setIsResetModalOpen(true); };
        handleHashChange(); window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      React.useEffect(() => {
        let mounted = true;
        const initAuth = async () => {
          const { data: sessionData } = await supabase.auth.getSession();
          if (sessionData?.session?.user && mounted) { setUser(sessionData.session.user); await loadUserData(sessionData.session.user.id); } 
          else if (mounted) { setIsLoading(false); }
        };
        initAuth();

        let authListener = null;
        if (supabase) {
          const { data } = supabase.auth.onAuthStateChange(async (event, session) => {
            if (event === 'SIGNED_IN' && session?.user && mounted) { setUser(session.user); await loadUserData(session.user.id); } 
            else if (event === 'SIGNED_OUT' && mounted) { setUser(null); setGoals([]); setPlans([]); setHabits([]); setHabitLogs([]); setMemos([]); setIsLoading(false); }
          });
          authListener = data;
        }
        return () => { mounted = false; if (authListener) authListener.subscription.unsubscribe(); };
      }, []);

      const loadUserData = async (userId) => {
        setIsLoading(true);
        try {
          const [userGoals, userPlans, userHabits, userHabitLogs, userMemos] = await Promise.all([ 
            api.data.getGoals(userId), 
            api.data.getPlans(userId), 
            api.data.getHabits(userId), 
            api.data.getHabitLogs(userId),
            api.data.getMemos(userId)
          ]);
          setGoals(userGoals); setPlans(userPlans); setHabits(userHabits); setHabitLogs(userHabitLogs); setMemos(userMemos);
        } catch (e) {} finally { setIsLoading(false); }
      };

      const handleSaveGoal = async (goal) => {
        try { const saved = await api.data.saveGoal(user.id, goal); setGoals(prev => prev.findIndex(g => g.id === saved.id) >= 0 ? prev.map(g => g.id === saved.id ? saved : g) : [...prev, saved]); } 
        catch (e) {}
      };
      const handleToggleGoalComplete = async (goal) => {
        const updatedGoal = { ...goal, is_completed: !goal.is_completed }; setGoals(prev => prev.map(g => g.id === goal.id ? updatedGoal : g)); 
        try { await api.data.saveGoal(user.id, updatedGoal); } catch(e) { setGoals(prev => prev.map(g => g.id === goal.id ? goal : g)); }
      };
      const handleDeleteGoal = async (goalId) => { try { await api.data.deleteGoal(goalId); setGoals(prev => prev.filter(g => g.id !== goalId)); } catch(e) {} };

      const handleSavePlan = async (plan) => { try { const saved = await api.data.savePlan(user.id, plan); setPlans(prev => [saved, ...prev]); return saved; } catch(e) { throw e; } };
      const handleUpdatePlan = async (plan) => { setPlans(prev => prev.map(p => p.id === plan.id ? plan : p)); try { await api.data.savePlan(user.id, plan); } catch(e) {} };
      const handleDeletePlan = async (planId) => { try { await api.data.deletePlan(planId); setPlans(prev => prev.filter(p => p.id !== planId)); } catch(e) {} };

      const handleSaveHabit = async (habit) => {
        try { const saved = await api.data.saveHabit(user.id, habit); if (saved) { const refreshedHabits = await api.data.getHabits(user.id); setHabits(refreshedHabits); } } 
        catch(e) {}
      };
      const handleDeleteHabit = async (habitId) => { try { await api.data.deleteHabit(habitId); setHabits(prev => prev.filter(h => h.id !== habitId)); } catch(e) {} };
      
      const handleToggleHabitLog = async (habitId, dateStr, isCompleted) => {
        const previousLogs = [...habitLogs];
        if (isCompleted) setHabitLogs(prev => prev.filter(log => !(log.habitId === habitId && log.date === dateStr)));
        else setHabitLogs(prev => [...prev, { id: crypto.randomUUID(), habitId, userId: user.id, date: dateStr }]);
        const result = await api.data.toggleHabitLog(user.id, habitId, dateStr, isCompleted);
        if (result && result.error) setHabitLogs(previousLogs);
      };

      const handleSaveMemo = async (memo) => {
        try { const saved = await api.data.saveMemo(user.id, memo); setMemos(prev => prev.findIndex(m => m.id === saved.id) >= 0 ? prev.map(m => m.id === saved.id ? saved : m).sort((a,b)=>a.sort_order - b.sort_order) : [...prev, saved].sort((a,b)=>a.sort_order - b.sort_order)); }
        catch (e) {}
      };
      const handleDeleteMemo = async (memoId) => { try { await api.data.deleteMemo(memoId); setMemos(prev => prev.filter(m => m.id !== memoId)); } catch(e) {} };
      const handleUpdateMemoOrders = async (updatedMemos) => {
        setMemos(updatedMemos);
        api.data.updateMemoOrders(updatedMemos);
      };

      if (isLoading) {
        return (
          <div className="min-h-screen bg-black flex items-center justify-center">
            <div className="flex flex-col items-center gap-3"><Icon name="Loader2" className="animate-spin text-orange-500" size={40} /><p className="text-sm font-semibold text-orange-500">데이터를 불러오는 중입니다...</p></div>
          </div>
        );
      }

      if (!user) return <><AuthView onLoginSuccess={async (u) => { setUser(u); await loadUserData(u.id); }} /><ResetPasswordModal isOpen={isResetModalOpen} onClose={() => setIsResetModalOpen(false)} /></>;

      return (
        <div className="min-h-screen flex flex-col bg-black text-slate-100">
          <header className="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
            <div className="max-w-5xl mx-auto px-4 flex items-center justify-between h-16">
              <div className="flex items-center gap-2 mr-2 shrink-0">
                <div className="w-8 h-8 bg-orange-600 rounded-lg flex items-center justify-center text-white font-black">최</div>
                <span className="font-bold text-white text-sm hidden sm:inline">최강 목표</span>
              </div>
              
              <div className="flex items-center flex-1 justify-end gap-1 sm:gap-2">
                <nav className="flex space-x-1 sm:space-x-2">
                  {[
                    { id: 'goals', label: '목표', icon: 'Target' },
                    { id: 'execution', label: '계획', icon: 'Edit3' },
                    { id: 'journal', label: '실행', icon: 'CheckSquare' },
                    { id: 'habits', label: '습관', icon: 'Activity' }
                  ].map(tab => (
                    <button key={tab.id} onClick={() => setCurrentTab(tab.id)} className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition ${currentTab === tab.id ? 'bg-orange-600 text-white shadow-lg shadow-orange-600/20' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'}`}>
                      <Icon name={tab.icon} size={15} /> <span className="hidden xs:inline">{tab.label}</span>
                    </button>
                  ))}
                </nav>

                <div className="relative" ref={dropdownRef}>
                  <button onClick={() => setIsDropdownOpen(!isDropdownOpen)} className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition ${['stats', 'finance', 'memo'].includes(currentTab) ? 'bg-orange-600 text-white shadow-lg shadow-orange-600/20' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'}`}>
                    <Icon name="MoreVertical" size={15} /> <span className="hidden xs:inline">더보기</span>
                  </button>
                  {isDropdownOpen && (
                    <div className="absolute right-0 mt-2 w-48 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl overflow-hidden z-50 animate-fadeIn">
                      <button onClick={() => { setCurrentTab('stats'); setIsDropdownOpen(false); }} className="w-full text-left px-4 py-3 text-xs text-slate-300 hover:bg-slate-800 hover:text-white flex items-center gap-2 transition">
                        <Icon name="BarChart2" size={15} /> 통계 리포트
                      </button>
                      <button onClick={() => { setCurrentTab('finance'); setIsDropdownOpen(false); }} className="w-full text-left px-4 py-3 text-xs text-slate-300 hover:bg-slate-800 hover:text-white flex items-center gap-2 transition">
                        <Icon name="DollarSign" size={15} /> 가계부 관리
                      </button>
                      <button onClick={() => { setCurrentTab('memo'); setIsDropdownOpen(false); }} className="w-full text-left px-4 py-3 text-xs text-slate-300 hover:bg-slate-800 hover:text-white flex items-center gap-2 transition">
                        <Icon name="FileText" size={15} /> 자유 메모
                      </button>
                    </div>
                  )}
                </div>

                <div className="w-px h-6 bg-slate-800 mx-1"></div>
                <button onClick={() => { api.auth.signOut(); setUser(null); }} className="text-slate-500 hover:text-slate-300 p-2 rounded-lg shrink-0" title="로그아웃"><Icon name="LogOut" size={18} /></button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 pb-20">
            {currentTab === 'goals' && <GoalsView goals={goals} onSaveGoal={handleSaveGoal} onToggleComplete={handleToggleGoalComplete} onDeleteGoal={handleDeleteGoal} />}
            {currentTab === 'execution' && <ExecutionView goals={goals} onSavePlan={handleSavePlan} />}
            {currentTab === 'journal' && <JournalView plans={plans} goals={goals} onUpdatePlan={handleUpdatePlan} onDeletePlan={handleDeletePlan} />}
            {currentTab === 'habits' && <HabitsView habits={habits} habitLogs={habitLogs} onSaveHabit={handleSaveHabit} onDeleteHabit={handleDeleteHabit} onToggleHabitLog={handleToggleHabitLog} />}
            {currentTab === 'stats' && <StatsView plans={plans} goals={goals} />}
            {currentTab === 'finance' && <FinanceView user={user} />}
            {currentTab === 'memo' && <MemoView memos={memos} onSaveMemo={handleSaveMemo} onDeleteMemo={handleDeleteMemo} onUpdateOrders={handleUpdateMemoOrders} />}
          </main>

          <ResetPasswordModal isOpen={isResetModalOpen} onClose={() => setIsResetModalOpen(false)} />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
