<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>최강 목표</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen selection:bg-blue-500 selection:text-white relative font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = "https://tuvzubjiucnlvtdagqqe.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_WG9ZK-Xugns3X_fsksQ2jw_9XV7UQCD";

    let supabase;
    try {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: true, autoRefreshToken: true }
      });
    } catch (e) {
      console.warn("Supabase 생성 경고:", e.message);
    }

    window.customAlert = (msg) => {
      const container = document.getElementById('toast-container') || (() => {
        const c = document.createElement('div');
        c.id = 'toast-container';
        c.className = 'fixed top-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 w-[90%] max-w-sm';
        document.body.appendChild(c);
        return c;
      })();
      const toast = document.createElement('div');
      toast.className = 'bg-white border border-slate-200 text-slate-800 px-5 py-4 rounded-xl shadow-lg shadow-slate-200/50 flex items-start gap-3 text-sm animate-fadeIn break-all';
      toast.innerHTML = `<svg class="shrink-0 mt-0.5 text-blue-600" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> <div>${msg}</div>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    };

    const getKSTDate = (date = new Date()) => {
      const utc = date.getTime() + (date.getTimezoneOffset() * 60000);
      return new Date(utc + (9 * 3600000));
    };
    const getKSTYYYYMMDD = (date) => {
      const d = getKSTDate(date);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const Icon = ({ name, size = 20, className = "" }) => {
      const spanRef = React.useRef(null);
      React.useEffect(() => {
        if (spanRef.current && window.lucide && window.lucide.icons[name]) {
          spanRef.current.innerHTML = '';
          const svg = window.lucide.createElement(window.lucide.icons[name]);
          svg.setAttribute('width', size); svg.setAttribute('height', size); svg.setAttribute('stroke-width', '2');
          if (className) svg.setAttribute('class', className);
          spanRef.current.appendChild(svg);
        }
      }, [name, size, className]);
      return <span ref={spanRef} className={`inline-flex items-center justify-center ${className}`} />;
    };

    const BlurInput = ({ value, onChange, ...props }) => {
      const [localVal, setLocalVal] = React.useState(value);
      React.useEffect(() => { setLocalVal(value); }, [value]);
      return <input value={localVal || ''} onChange={(e) => setLocalVal(e.target.value)} onBlur={() => onChange(localVal)} {...props} />;
    };

    const BlurTextarea = ({ value, onChange, ...props }) => {
      const [localVal, setLocalVal] = React.useState(value);
      React.useEffect(() => { setLocalVal(value); }, [value]);
      return <textarea value={localVal || ''} onChange={(e) => setLocalVal(e.target.value)} onBlur={() => onChange(localVal)} {...props} />;
    };

    const api = {
      auth: {
        signIn: async (email, password) => await supabase.auth.signInWithPassword({ email, password }),
        signOut: async () => await supabase.auth.signOut(),
      },
      data: {
        getGoals: async (userId) => {
          const { data, error } = await supabase.from('goals').select('*').eq('userId', userId).order('created_at', { ascending: true });
          if (error) { window.customAlert(`목표 조회 에러: ${error.message}`); return []; }
          return data || [];
        },
        saveGoal: async (goalData, userId) => {
          const payload = { ...goalData, userId };
          const { data, error } = payload.id 
            ? await supabase.from('goals').update(payload).eq('id', payload.id).eq('userId', userId).select()
            : await supabase.from('goals').insert(payload).select();
          if (error) throw error;
          return data[0];
        },
        deleteGoal: async (id, userId) => {
          const { error } = await supabase.from('goals').delete().eq('id', id).eq('userId', userId);
          if (error) throw error;
        },
        getPlans: async (userId) => {
          const { data, error } = await supabase.from('plans').select('*').eq('userId', userId).order('created_at', { ascending: false });
          if (error) { window.customAlert(`계획 조회 에러: ${error.message}`); return []; }
          return data || [];
        },
        savePlan: async (planData, userId) => {
          const { timeMemo, ...rest } = planData; 
          const payload = { ...rest, userId };
          const { data, error } = payload.id 
            ? await supabase.from('plans').update(payload).eq('id', payload.id).eq('userId', userId).select()
            : await supabase.from('plans').insert(payload).select();
          if (error) throw error;
          return data[0];
        },
        deletePlan: async (id, userId) => {
          const { error } = await supabase.from('plans').delete().eq('id', id).eq('userId', userId);
          if (error) throw error;
        },
        getHabits: async (userId) => {
          const { data, error } = await supabase.from('habits').select('*').eq('user_id', userId).order('created_at', { ascending: true });
          if (error) { window.customAlert(`습관 조회 에러: ${error.message}`); return []; }
          return data || [];
        },
        saveHabit: async (habitData, userId) => {
          const payload = { title: habitData.title, exec_time: habitData.time || null, repeat_days: habitData.repeatDays, user_id: userId };
          const { data, error } = habitData.id 
            ? await supabase.from('habits').update(payload).eq('id', habitData.id).eq('user_id', userId).select()
            : await supabase.from('habits').insert(payload).select();
          if (error) throw error;
          return data[0];
        },
        deleteHabit: async (id, userId) => {
          const { error } = await supabase.from('habits').delete().eq('id', id).eq('user_id', userId);
          if (error) throw error;
        },
        getHabitLogs: async (userId) => {
          const { data, error } = await supabase.from('habit_logs').select('*').eq('user_id', userId);
          if (error) { window.customAlert(`습관 기록 에러: ${error.message}`); return []; }
          return data || [];
        },
        toggleHabitLog: async (habitId, userId, dateStr, isCompleted) => {
          if (isCompleted) {
            const { error } = await supabase.from('habit_logs').upsert({ habit_id: habitId, user_id: userId, completed_date: dateStr, is_completed: true });
            if (error) throw error;
          } else {
            const { error } = await supabase.from('habit_logs').delete().eq('habit_id', habitId).eq('completed_date', dateStr).eq('user_id', userId);
            if (error) throw error;
          }
        }
      }
    };

    const CustomModal = ({ isOpen, title, children, onClose }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-fadeIn">
          <div className="bg-white border border-slate-200 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl text-slate-800 flex flex-col max-h-[90vh]">
            <div className="flex justify-between items-center px-6 py-4 border-b border-slate-100 bg-slate-50 shrink-0">
              <h3 className="text-lg font-bold text-slate-900">{title}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-700 p-1 rounded-lg transition"><Icon name="X" size={20} /></button>
            </div>
            <div className="p-6 overflow-y-auto custom-scrollbar">{children}</div>
          </div>
        </div>
      );
    };

    const ConfirmModal = ({ isOpen, title, message, onConfirm, onClose }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-fadeIn">
          <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl border border-slate-200 text-center">
            <div className="w-12 h-12 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="AlertTriangle" size={24} /></div>
            <h3 className="text-lg font-bold text-slate-900 mb-2">{title}</h3>
            <p className="text-sm text-slate-500 mb-6">{message}</p>
            <div className="flex gap-3">
              <button onClick={onClose} className="flex-1 py-3 bg-slate-100 text-slate-700 font-semibold rounded-xl hover:bg-slate-200 transition">취소</button>
              <button onClick={() => { onConfirm(); onClose(); }} className="flex-1 py-3 bg-red-500 text-white font-semibold rounded-xl hover:bg-red-600 transition shadow-md shadow-red-500/20">삭제</button>
            </div>
          </div>
        </div>
      );
    };

    const generateGoogleCalendarLink = (title, details, startTimeText) => {
      const baseUrl = 'https://calendar.google.com/calendar/render?action=TEMPLATE';
      const text = encodeURIComponent(title);
      const dates = '20261231T090000Z/20261231T100000Z'; // 임시 날짜 (실제 앱에서는 startTimeText 파싱 후 KST->UTC 변환 필요)
      const detailsParam = encodeURIComponent(details);
      return `${baseUrl}&text=${text}&dates=${dates}&details=${detailsParam}`;
    };

    const AuthView = ({ onLoginSuccess }) => {
      const [email, setEmail] = React.useState('');
      const [password, setPassword] = React.useState('');
      const [loading, setLoading] = React.useState(false);
      const handleSubmit = async (e) => {
        e.preventDefault(); setLoading(true);
        const { data, error } = await api.auth.signIn(email, password);
        setLoading(false);
        if (error) window.customAlert('로그인 실패: ' + error.message);
        else if (data?.user) onLoginSuccess(data.user);
      };
      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-slate-50 relative z-10">
          <div className="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-8 shadow-xl shadow-slate-200/50">
            <div className="text-center mb-8">
              <div className="w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4"><Icon name="Target" size={32} /></div>
              <h1 className="text-2xl font-black text-slate-900 tracking-tight">최강 목표</h1>
              <p className="text-sm text-slate-500 mt-2">목표 수립과 실행 대시보드</p>
            </div>
            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1.5 ml-1">이메일</label>
                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:border-blue-500 transition" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1.5 ml-1">비밀번호</label>
                <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:border-blue-500 transition" />
              </div>
              <button type="submit" disabled={loading} className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-md mt-4">
                {loading ? '로그인 중...' : '시작하기'}
              </button>
            </form>
          </div>
        </div>
      );
    };

    const GoalsView = ({ goals, onUpdate, onDelete, user }) => {
      const [title, setTitle] = React.useState('');
      const [saving, setSaving] = React.useState(false);
      const [confirmObj, setConfirmObj] = React.useState({ isOpen: false, id: null });

      const handleAdd = async (e) => {
        e.preventDefault(); if (!title.trim() || saving) return;
        setSaving(true);
        try {
          const newGoal = await api.data.saveGoal({ title, is_completed: false }, user.id);
          onUpdate(newGoal); setTitle('');
        } catch (e) { window.customAlert(e.message); }
        finally { setSaving(false); }
      };

      const toggleComplete = async (goal) => {
        try {
          const updated = await api.data.saveGoal({ id: goal.id, is_completed: !goal.is_completed }, user.id);
          onUpdate(updated);
        } catch (e) { window.customAlert(e.message); }
      };

      const doDelete = async () => {
        try {
          await api.data.deleteGoal(confirmObj.id, user.id);
          onDelete(confirmObj.id);
        } catch (e) { window.customAlert(e.message); }
      };

      return (
        <div className="space-y-6">
          <form onSubmit={handleAdd} className="flex gap-2">
            <input type="text" value={title} onChange={e => setTitle(e.target.value)} placeholder="새로운 목표를 입력하세요" className="flex-1 bg-white border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition" />
            <button type="submit" disabled={saving} className="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition whitespace-nowrap shadow-md">추가</button>
          </form>
          <div className="grid gap-3">
            {goals.map(goal => (
              <div key={goal.id} className={`flex items-center gap-3 p-4 bg-white border border-slate-200 rounded-xl shadow-sm transition ${goal.is_completed ? 'opacity-60' : ''}`}>
                <button onClick={() => toggleComplete(goal)} className={`shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center transition ${goal.is_completed ? 'bg-blue-500 border-blue-500 text-white' : 'border-slate-300 hover:border-blue-400'}`}>
                  {goal.is_completed && <Icon name="Check" size={14} />}
                </button>
                <div className={`flex-1 font-semibold ${goal.is_completed ? 'line-through text-slate-500' : 'text-slate-800'}`}>{goal.title}</div>
                <button onClick={() => setConfirmObj({ isOpen: true, id: goal.id })} className="text-slate-400 hover:text-red-500 p-2 rounded-lg transition"><Icon name="Trash2" size={18} /></button>
              </div>
            ))}
            {goals.length === 0 && <div className="text-center py-10 text-slate-400 text-sm">등록된 목표가 없습니다.</div>}
          </div>
          <ConfirmModal isOpen={confirmObj.isOpen} title="목표 삭제" message="이 목표를 정말 삭제하시겠습니까?" onConfirm={doDelete} onClose={() => setConfirmObj({ isOpen: false, id: null })} />
        </div>
      );
    };

    const ExecutionView = ({ goals, onPlanSaved, user }) => {
      const [step, setStep] = React.useState(1);
      const [selectedGoal, setSelectedGoal] = React.useState(null);
      const [planTitle, setPlanTitle] = React.useState('');
      const [planTime, setPlanTime] = React.useState('');
      const [planMemo, setPlanMemo] = React.useState('');
      const [saving, setSaving] = React.useState(false);
      const [savedPlan, setSavedPlan] = React.useState(null);

      const activeGoals = goals.filter(g => !g.is_completed);

      const handleSave = async () => {
        if (!selectedGoal || !planTitle || saving) return;
        setSaving(true);
        try {
          const newPlan = await api.data.savePlan({ title: planTitle, goal_id: selectedGoal.id, plan_time: planTime, memo: planMemo, status: 'pending' }, user.id);
          onPlanSaved(newPlan);
          setSavedPlan(newPlan);
          setStep(4); // 완료 모달
        } catch (e) { window.customAlert(e.message); }
        finally { setSaving(false); }
      };

      const reset = () => { setStep(1); setSelectedGoal(null); setPlanTitle(''); setPlanTime(''); setPlanMemo(''); setSavedPlan(null); };

      return (
        <div className="max-w-2xl mx-auto mt-4">
          {step === 1 && (
            <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm animate-fadeIn">
              <h2 className="text-xl font-bold mb-6 text-slate-800">Q1. 어떤 목표를 위한 실행인가요?</h2>
              <div className="grid gap-3">
                {activeGoals.map(g => (
                  <button key={g.id} onClick={() => { setSelectedGoal(g); setStep(2); }} className="text-left p-4 rounded-xl border border-slate-200 hover:border-blue-500 hover:bg-blue-50 transition font-semibold text-slate-700">
                    {g.title}
                  </button>
                ))}
                {activeGoals.length === 0 && <div className="text-sm text-slate-500 p-4 text-center">진행 중인 목표가 없습니다.</div>}
              </div>
            </div>
          )}
          {step === 2 && (
            <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm animate-fadeIn">
              <button onClick={() => setStep(1)} className="text-sm text-blue-600 font-semibold mb-4 flex items-center gap-1"><Icon name="ArrowLeft" size={16} /> 이전</button>
              <h2 className="text-xl font-bold mb-2 text-slate-800">Q2. 구체적으로 무엇을 하실 건가요?</h2>
              <p className="text-sm text-slate-500 mb-6">목표: {selectedGoal.title}</p>
              <input type="text" autoFocus value={planTitle} onChange={e => setPlanTitle(e.target.value)} placeholder="예: 3km 러닝, 영단어 50개 암기" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-lg font-semibold focus:outline-none focus:border-blue-500 mb-6" />
              <button onClick={() => setStep(3)} disabled={!planTitle.trim()} className="w-full py-4 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-bold rounded-xl transition shadow-md">다음</button>
            </div>
          )}
          {step === 3 && (
            <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm animate-fadeIn">
              <button onClick={() => setStep(2)} className="text-sm text-blue-600 font-semibold mb-4 flex items-center gap-1"><Icon name="ArrowLeft" size={16} /> 이전</button>
              <h2 className="text-xl font-bold mb-6 text-slate-800">Q3. 언제 하시겠어요?</h2>
              <div className="space-y-4 mb-6">
                <div>
                  <label className="block text-sm font-semibold text-slate-700 mb-2">실행 예정 시간 (선택)</label>
                  <input type="time" value={planTime} onChange={e => setPlanTime(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:outline-none focus:border-blue-500 text-slate-700" />
                </div>
                <div>
                  <label className="block text-sm font-semibold text-slate-700 mb-2">상세 메모 (선택)</label>
                  <textarea value={planMemo} onChange={e => setPlanMemo(e.target.value)} rows="3" placeholder="장소, 준비물 등..." className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:outline-none focus:border-blue-500 text-sm text-slate-700 custom-scrollbar"></textarea>
                </div>
              </div>
              <button onClick={handleSave} disabled={saving} className="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-md">
                {saving ? '저장 중...' : '계획 저장하기'}
              </button>
            </div>
          )}
          
          <CustomModal isOpen={step === 4} title="저장 완료!" onClose={reset}>
            <div className="text-center py-4">
              <div className="w-16 h-16 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="CheckCircle" size={32} /></div>
              <h3 className="text-xl font-bold text-slate-900 mb-2">계획이 멋지게 등록되었습니다.</h3>
              <p className="text-sm text-slate-500 mb-8">캘린더에 연동하여 잊지 말고 실행해 보세요!</p>
              <div className="flex gap-3">
                <a href={generateGoogleCalendarLink(planTitle, planMemo, planTime)} target="_blank" rel="noreferrer" onClick={reset} className="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition flex items-center justify-center gap-2">
                  <Icon name="Calendar" size={18} /> 구글 캘린더
                </a>
                <button onClick={() => { window.customAlert('애플 캘린더 다운로드가 시작됩니다.'); reset(); }} className="flex-1 py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl transition flex items-center justify-center gap-2">
                  <Icon name="Calendar" size={18} /> 애플 캘린더
                </button>
              </div>
            </div>
          </CustomModal>
        </div>
      );
    };

    const JournalView = ({ plans, goals, onUpdatePlan, onDeletePlan, user }) => {
      const [visibleCount, setVisibleCount] = React.useState(5);
      const visiblePlans = plans.slice(0, visibleCount);

      const updateField = async (plan, field, value) => {
        try {
          const updated = await api.data.savePlan({ id: plan.id, [field]: value }, user.id);
          onUpdatePlan(updated);
        } catch (e) { window.customAlert(e.message); }
      };

      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between mb-4 px-2">
            <h2 className="font-bold text-slate-800">최근 실행 계획</h2>
            <span className="text-xs text-slate-500">총 {plans.length}개</span>
          </div>
          {visiblePlans.map(plan => {
            const goal = goals.find(g => g.id === plan.goal_id);
            return (
              <div key={plan.id} className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                <div className="flex justify-between items-start mb-3">
                  <div>
                    <div className="text-xs font-bold text-blue-600 mb-1">{goal ? goal.title : '삭제된 목표'}</div>
                    <div className="font-bold text-slate-900 text-lg">{plan.title}</div>
                  </div>
                  <select value={plan.status || 'pending'} onChange={(e) => updateField(plan, 'status', e.target.value)} className={`text-xs font-bold px-3 py-1.5 rounded-lg border-2 appearance-none focus:outline-none transition ${plan.status === 'completed' ? 'border-green-500 text-green-600 bg-green-50' : plan.status === 'failed' ? 'border-red-500 text-red-600 bg-red-50' : 'border-slate-300 text-slate-600 bg-slate-50'}`}>
                    <option value="pending">진행 전</option>
                    <option value="completed">완료됨</option>
                    <option value="failed">실패/연기</option>
                  </select>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4 pt-4 border-t border-slate-100">
                  <div>
                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">결과물 / 복기</label>
                    <BlurTextarea value={plan.result_memo} onChange={(val) => updateField(plan, 'result_memo', val)} rows="2" placeholder="무엇을 배우고 느꼈나요?" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500 custom-scrollbar" />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">실제 투입 시간</label>
                    <BlurInput type="text" value={plan.time_spent} onChange={(val) => updateField(plan, 'time_spent', val)} placeholder="예: 2시간 30분" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500" />
                  </div>
                </div>
              </div>
            );
          })}
          {plans.length === 0 && <div className="text-center py-10 text-slate-400">등록된 실행 계획이 없습니다.</div>}
          {visibleCount < plans.length && (
            <button onClick={() => setVisibleCount(v => v + 5)} className="w-full py-4 mt-2 bg-white border border-slate-200 text-slate-600 font-bold rounded-xl hover:bg-slate-50 transition shadow-sm">더보기 ↓</button>
          )}
        </div>
      );
    };

    const HabitsView = ({ habits, habitLogs, onUpdate, onDelete, onLogUpdate, user }) => {
      const todayNum = getKSTDate().getDay(); 
      const [selectedDay, setSelectedDay] = React.useState(todayNum === 0 ? 6 : todayNum - 1); // UI: 월(0)~일(6) 매핑
      const [isModalOpen, setIsModalOpen] = React.useState(false);
      const [editHabit, setEditHabit] = React.useState(null);

      const openModal = (habit = null) => { setEditHabit(habit); setIsModalOpen(true); };
      
      const filteredHabits = habits.filter(h => h.repeat_days && h.repeat_days.includes(selectedDay));

      const todayStr = getKSTYYYYMMDD(new Date());

      const toggleCheck = async (habit) => {
        const isCompleted = habitLogs.some(log => log.habit_id === habit.id && log.completed_date === todayStr);
        // 낙관적 업데이트 생략 (정확성을 위해 API 호출 후 re-fetch)
        try {
          await api.data.toggleHabitLog(habit.id, user.id, todayStr, !isCompleted);
          onLogUpdate(); 
        } catch(e) { window.customAlert('체크 에러: '+e.message); }
      };

      const doSaveHabit = async (data) => {
        try {
          const res = await api.data.saveHabit(data, user.id);
          onUpdate(res); setIsModalOpen(false);
        } catch(e) { window.customAlert(e.message); }
      };
      
      const doDeleteHabit = async (id) => {
        try {
          await api.data.deleteHabit(id, user.id);
          onDelete(id); setIsModalOpen(false);
        } catch(e) { window.customAlert(e.message); }
      };

      const renderDots = (habit) => {
        const dots = [];
        let completedCount = 0;
        let currentDate = getKSTDate();
        let occurrencesFound = 0;

        // 과거 7번의 반복 요일을 역추적하여 완료 여부 확인
        while(occurrencesFound < 7 && dots.length < 30) { // 무한루프 방지
          let dayJs = currentDate.getDay();
          let dayUi = dayJs === 0 ? 6 : dayJs - 1; 
          
          if(habit.repeat_days.includes(dayUi)) {
            const dateStr = getKSTYYYYMMDD(currentDate);
            const isDone = habitLogs.some(log => log.habit_id === habit.id && log.completed_date === dateStr);
            dots.unshift(isDone);
            if(isDone) completedCount++;
            occurrencesFound++;
          }
          currentDate.setDate(currentDate.getDate() - 1);
        }

        return (
          <div className="flex flex-col items-end gap-1 shrink-0">
            <span className="text-[10px] font-bold text-slate-400">7회 중 <span className="text-blue-600">{completedCount}</span>회</span>
            <div className="flex gap-1">
              {dots.map((done, i) => (
                <div key={i} className={`w-2 h-2 rounded-full ${done ? 'bg-blue-500' : 'bg-slate-200'}`} />
              ))}
            </div>
          </div>
        );
      };

      return (
        <div>
          <div className="flex bg-white rounded-xl p-1 shadow-sm mb-6 border border-slate-200">
            {['월', '화', '수', '목', '금', '토', '일'].map((day, idx) => (
              <button key={idx} onClick={() => setSelectedDay(idx)} className={`flex-1 py-2 text-sm font-bold rounded-lg transition ${selectedDay === idx ? 'bg-blue-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`}>
                {day}
              </button>
            ))}
          </div>

          <div className="space-y-3">
            {filteredHabits.map(habit => {
              const isTodayCompleted = habitLogs.some(log => log.habit_id === habit.id && log.completed_date === todayStr);
              return (
                <div key={habit.id} className={`flex items-center gap-3 p-4 bg-white border border-slate-200 rounded-xl shadow-sm transition ${isTodayCompleted ? 'opacity-60 bg-slate-50' : ''}`}>
                  <button onClick={() => toggleCheck(habit)} className={`shrink-0 w-7 h-7 rounded-xl border-2 flex items-center justify-center transition ${isTodayCompleted ? 'bg-blue-500 border-blue-500 text-white' : 'border-slate-300 hover:border-blue-400'}`}>
                    {isTodayCompleted && <Icon name="Check" size={16} />}
                  </button>
                  <div className="flex-1 flex flex-col justify-center cursor-pointer" onClick={() => openModal(habit)}>
                    <div className={`font-bold ${isTodayCompleted ? 'line-through text-slate-500' : 'text-slate-900'}`}>{habit.title}</div>
                    {habit.exec_time && <div className="text-xs text-blue-600 font-semibold mt-0.5"><Icon name="Clock" size={12} className="mr-0.5 mb-0.5 inline" />{habit.exec_time.slice(0,5)}</div>}
                  </div>
                  {renderDots(habit)}
                </div>
              );
            })}
            <button onClick={() => openModal()} className="w-full py-4 border-2 border-dashed border-slate-300 text-slate-500 font-bold rounded-xl hover:border-blue-500 hover:text-blue-600 transition bg-slate-50 flex justify-center items-center gap-2">
              <Icon name="Plus" size={20} /> 새 습관 추가
            </button>
          </div>

          <CustomModal isOpen={isModalOpen} title={editHabit ? "습관 수정" : "새 습관"} onClose={() => setIsModalOpen(false)}>
            <HabitForm habit={editHabit} onSave={doSaveHabit} onDelete={doDeleteHabit} />
          </CustomModal>
        </div>
      );
    };

    const HabitForm = ({ habit, onSave, onDelete }) => {
      const [title, setTitle] = React.useState(habit?.title || '');
      const [time, setTime] = React.useState(habit?.exec_time?.slice(0,5) || '');
      const [days, setDays] = React.useState(habit?.repeat_days || [0,1,2,3,4,5,6]);
      
      const toggleDay = (d) => setDays(prev => prev.includes(d) ? prev.filter(x => x !== d) : [...prev, d].sort());
      const handleSubmit = (e) => { e.preventDefault(); onSave({ id: habit?.id, title, time, repeatDays: days }); };

      return (
        <form onSubmit={handleSubmit} className="space-y-4">
          <div>
            <label className="block text-xs font-bold text-slate-500 mb-1">습관명</label>
            <input type="text" required value={title} onChange={e => setTitle(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:outline-none focus:border-blue-500 text-slate-900" />
          </div>
          <div>
            <label className="block text-xs font-bold text-slate-500 mb-1">시간 (선택)</label>
            <input type="time" value={time} onChange={e => setTime(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:outline-none focus:border-blue-500 text-slate-900" />
          </div>
          <div>
            <label className="block text-xs font-bold text-slate-500 mb-2">반복 요일</label>
            <div className="flex gap-1">
              {['월', '화', '수', '목', '금', '토', '일'].map((d, i) => (
                <button type="button" key={i} onClick={() => toggleDay(i)} className={`flex-1 py-2 text-sm font-bold rounded-lg border-2 transition ${days.includes(i) ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-200 text-slate-400 hover:border-blue-300'}`}>{d}</button>
              ))}
            </div>
          </div>
          <div className="pt-4 flex gap-2">
            {habit && <button type="button" onClick={() => onDelete(habit.id)} className="px-4 py-3 bg-red-50 text-red-500 font-bold rounded-xl hover:bg-red-100 transition"><Icon name="Trash2" size={18} /></button>}
            <button type="submit" disabled={!title || days.length===0} className="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 disabled:opacity-50 transition shadow-md">저장하기</button>
          </div>
        </form>
      );
    };

    const StatsView = ({ goals, plans, habits }) => {
      const activeGoals = goals.filter(g => !g.is_completed).length;
      const completedGoals = goals.filter(g => g.is_completed).length;
      const completedPlans = plans.filter(p => p.status === 'completed').length;
      
      return (
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-4">
            <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col items-center justify-center text-center">
              <div className="text-slate-400 mb-2"><Icon name="Target" size={24} /></div>
              <div className="text-3xl font-black text-slate-900 mb-1">{activeGoals}</div>
              <div className="text-xs font-bold text-slate-500">진행 중 목표</div>
            </div>
            <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col items-center justify-center text-center">
              <div className="text-blue-500 mb-2"><Icon name="Award" size={24} /></div>
              <div className="text-3xl font-black text-blue-600 mb-1">{completedGoals}</div>
              <div className="text-xs font-bold text-slate-500">달성한 목표</div>
            </div>
          </div>
          <div className="bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl p-6 shadow-lg text-white">
            <div className="flex items-center gap-2 mb-4 text-blue-400"><Icon name="Zap" size={20} /> <span className="font-bold">실행력 배터리</span></div>
            <div className="flex items-end gap-2">
              <span className="text-5xl font-black">{completedPlans}</span>
              <span className="text-slate-400 font-semibold mb-1">개의 계획을 완료했습니다!</span>
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [user, setUser] = React.useState(null);
      const [currentTab, setCurrentTab] = React.useState('goals');
      const [isLoading, setIsLoading] = React.useState(true);
      
      const [goals, setGoals] = React.useState([]);
      const [plans, setPlans] = React.useState([]);
      const [habits, setHabits] = React.useState([]);
      const [habitLogs, setHabitLogs] = React.useState([]);

      const loadData = async (uid) => {
        try {
          const [g, p, h, hl] = await Promise.all([
            api.data.getGoals(uid), api.data.getPlans(uid), api.data.getHabits(uid), api.data.getHabitLogs(uid)
          ]);
          setGoals(g); setPlans(p); setHabits(h); setHabitLogs(hl);
        } catch (e) { console.error(e); }
      };

      React.useEffect(() => {
        let mounted = true;
        const init = async () => {
          const { data } = await supabase.auth.getSession();
          if (data?.session?.user && mounted) {
            setUser(data.session.user);
            await loadData(data.session.user.id);
          }
          if (mounted) setIsLoading(false);
        };
        init();

        const { data: listener } = supabase.auth.onAuthStateChange(async (event, session) => {
          if (event === 'SIGNED_IN' && session?.user && mounted) {
            setUser(session.user); await loadData(session.user.id);
          } else if (event === 'SIGNED_OUT' && mounted) {
            setUser(null); setGoals([]); setPlans([]); setHabits([]); setHabitLogs([]);
          }
        });
        return () => { mounted = false; listener?.subscription.unsubscribe(); };
      }, []);

      if (isLoading) return <div className="min-h-screen flex items-center justify-center bg-slate-50"><Icon name="Loader2" size={32} className="animate-spin text-blue-600" /></div>;
      if (!user) return <AuthView onLoginSuccess={(u) => { setUser(u); loadData(u.id); }} />;

      const tabs = [
        { id: 'goals', label: '목표', icon: 'Target' },
        { id: 'execution', label: '계획', icon: 'Edit3' },
        { id: 'journal', label: '실행', icon: 'CheckSquare' },
        { id: 'habits', label: '습관', icon: 'Activity' },
        { id: 'stats', label: '통계', icon: 'BarChart2' }
      ];

      return (
        <div className="min-h-screen flex flex-col">
          <header className="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200 shadow-sm">
            <div className="max-w-5xl mx-auto px-4 flex items-center justify-between h-16">
              <div className="flex items-center gap-2 shrink-0 pr-4">
                <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-black shadow-sm">최</div>
                <span className="font-bold text-slate-900 text-sm hidden sm:inline">최강 목표</span>
              </div>
              <div className="flex items-center flex-1 justify-end gap-1 overflow-x-auto custom-scrollbar pb-1 sm:pb-0">
                <nav className="flex space-x-1">
                  {tabs.map(tab => (
                    <button key={tab.id} onClick={() => setCurrentTab(tab.id)} className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-[11px] sm:text-xs font-bold whitespace-nowrap transition-all ${currentTab === tab.id ? 'bg-blue-600 text-white shadow-md shadow-blue-600/20' : 'text-slate-500 hover:text-slate-900 hover:bg-slate-100'}`}>
                      <Icon name={tab.icon} size={15} /> <span className="hidden xs:inline">{tab.label}</span>
                    </button>
                  ))}
                </nav>
                <div className="w-px h-6 bg-slate-200 mx-2 shrink-0"></div>
                <button onClick={api.auth.signOut} className="text-slate-400 hover:text-red-500 p-2 rounded-lg shrink-0 transition" title="로그아웃"><Icon name="LogOut" size={18} /></button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-2xl w-full mx-auto p-4 sm:p-6 pb-20">
            {currentTab === 'goals' && <GoalsView goals={goals} onUpdate={g => setGoals(prev => prev.some(x=>x.id===g.id) ? prev.map(x=>x.id===g.id?g:x) : [...prev,g])} onDelete={id => setGoals(prev => prev.filter(x=>x.id!==id))} user={user} />}
            {currentTab === 'execution' && <ExecutionView goals={goals} onPlanSaved={p => setPlans(prev => [p, ...prev])} user={user} />}
            {currentTab === 'journal' && <JournalView plans={plans} goals={goals} onUpdatePlan={p => setPlans(prev => prev.map(x=>x.id===p.id?p:x))} user={user} />}
            {currentTab === 'habits' && <HabitsView habits={habits} habitLogs={habitLogs} onUpdate={h => setHabits(prev => prev.some(x=>x.id===h.id) ? prev.map(x=>x.id===h.id?h:x) : [...prev,h])} onDelete={id => setHabits(prev => prev.filter(x=>x.id!==id))} onLogUpdate={() => api.data.getHabitLogs(user.id).then(setHabitLogs)} user={user} />}
            {currentTab === 'stats' && <StatsView goals={goals} plans={plans} habits={habits} />}
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
