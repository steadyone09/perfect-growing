<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal & Execution Tracker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Tailwind Config for Custom Colors (Dark Theme) -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1', // Indigo 500
                        primaryHover: '#818cf8', // Indigo 400
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #020617; /* slate-950 */
            color: #f8fafc; /* slate-50 */
            color-scheme: dark; /* 브라우저 기본 UI(스크롤, 달력 등) 다크모드 적용 */
        }
        /* Custom Scrollbar for dark theme */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Modal Animation */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-overlay { animation: fadeIn 0.2s ease-out forwards; }
        .modal-content { animation: slideUp 0.3s ease-out forwards; }
        
        /* 탭 네비게이션 스크롤바 숨김 */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        const Icons = {
            Target: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
            Play: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>,
            BookOpen: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            BarChart: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>,
            Users: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            LogOut: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            X: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Trash: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Check: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>,
            AlertCircle: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Calendar: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
            ChevronRight: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>,
            Lock: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
            GripVertical: () => <svg className="w-5 h-5 cursor-grab active:cursor-grabbing text-slate-500 hover:text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/></svg>
        };

        // Supabase 초기화 및 연동 변수 (실제 프로젝트에서는 환경변수로 관리 권장)
        const SUPABASE_URL = "https://tuvzubjiucnlvtdagqqe.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_WG9ZK-Xugns3X_fsksQ2jw_9XV7UQCD";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // fallback용 ID 생성 함수
        const generateId = () => window.crypto?.randomUUID ? window.crypto.randomUUID() : Math.random().toString(36).substring(2, 9);

        // 회원가입 후 자동 로그인 전환 시 사용되는 지연(delay) 함수
        const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // Supabase 연동 API 객체
        const api = {
            auth: {
                signIn: async (email, password) => {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) throw new Error(error.message);
                    const role = data.user.user_metadata?.role || 'user';
                    return { id: data.user.id, email: data.user.email, role };
                },
                signUp: async (email, password, role = 'user') => {
                    const { data, error } = await supabase.auth.signUp({ 
                        email, 
                        password,
                        options: { data: { role } } 
                    });
                    if (error) throw new Error(error.message);
                    return { id: data.user.id, email: data.user.email, role: data.user.user_metadata?.role || 'user' };
                },
                resetPasswordForEmail: async (email) => {
                    const { error } = await supabase.auth.resetPasswordForEmail(email);
                    if (error) throw new Error(error.message);
                    return true;
                },
                updateUser: async (userId, newPassword) => {
                    const { error } = await supabase.auth.updateUser({ password: newPassword });
                    if (error) throw new Error(error.message);
                    return true;
                },
                deleteUser: async (userId) => {
                    const { error } = await supabase.rpc('delete_user_by_admin', { target_user_id: userId });
                    if (error) throw new Error(error.message);
                }
            },
            data: {
                getGoals: async (userId) => { 
                    const { data, error } = await supabase.from('goals').select('*').eq('userId', userId);
                    if (error) throw new Error(error.message);
                    return data || []; 
                },
                saveGoal: async (goal) => {
                    const goalData = { ...goal };
                    if (!goalData.id) goalData.id = generateId(); 
                    
                    const { data, error } = await supabase.from('goals').upsert(goalData).select().single();
                    if (error) throw new Error(error.message);
                    return data || goalData;
                },
                deleteGoal: async (goalId) => {
                    const { error } = await supabase.from('goals').delete().eq('id', goalId);
                    if (error) throw new Error(error.message);
                },
                getPlans: async (userId) => { 
                    const { data, error } = await supabase.from('plans').select('*').eq('userId', userId);
                    if (error) throw new Error(error.message);
                    return data || []; 
                },
                savePlan: async (plan) => {
                    const planData = { ...plan };
                    if (!planData.id) planData.id = generateId();

                    const { data, error } = await supabase.from('plans').upsert(planData).select().single();
                    if (error) throw new Error(error.message);
                    return data || planData;
                },
                deletePlan: async (planId) => {
                    const { error } = await supabase.from('plans').delete().eq('id', planId);
                    if (error) throw new Error(error.message);
                }
            },
            admin: {
                getAllUsers: async () => { 
                    const { data, error } = await supabase.from('profiles').select('*');
                    if (error) throw new Error(error.message);
                    return data || []; 
                },
                getGlobalStats: async () => {
                    const [usersReq, goalsReq, plansReq, completedReq] = await Promise.all([
                        supabase.from('profiles').select('*', { count: 'exact', head: true }),
                        supabase.from('goals').select('*', { count: 'exact', head: true }),
                        supabase.from('plans').select('*', { count: 'exact', head: true }),
                        supabase.from('plans').select('*', { count: 'exact', head: true }).eq('status', 'completed')
                    ]);
                    
                    return {
                        totalUsers: usersReq.count || 0,
                        totalGoals: goalsReq.count || 0,
                        totalPlans: plansReq.count || 0,
                        completedPlans: completedReq.count || 0
                    }
                }
            }
        };

        const calculateDDay = (deadline) => {
            if (!deadline) return null;
            const today = new Date();
            today.setHours(0,0,0,0);
            const targetDate = new Date(deadline);
            targetDate.setHours(0,0,0,0);
            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return 'D-Day';
            if (diffDays > 0) return `D-${diffDays}`;
            return `D+${Math.abs(diffDays)}`;
        };

        const formatDate = (dateString) => {
            if (!dateString) return '';
            const d = new Date(dateString);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        };

        const getTodayString = () => formatDate(new Date());

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-70 modal-overlay" onClick={onClose}>
                    <div className="bg-slate-900 border border-slate-800 rounded-xl shadow-2xl w-full max-w-lg overflow-hidden modal-content flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
                        <div className="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                            <h3 className="text-lg font-semibold text-white">{title}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-white transition-colors"><Icons.X /></button>
                        </div>
                        <div className="p-6 overflow-y-auto flex-1 text-slate-200">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        // 대체용 Confirm 및 Alert 모달 (alert(), confirm() 사용 금지 룰 준수)
        const ConfirmModal = ({ isOpen, message, onConfirm, onClose }) => (
            <Modal isOpen={isOpen} onClose={onClose} title="확인">
                <p className="text-slate-300 mb-8">{message}</p>
                <div className="flex justify-end gap-3">
                    <Button variant="secondary" onClick={onClose}>취소</Button>
                    <Button variant="danger" onClick={() => { onConfirm(); onClose(); }}>확인</Button>
                </div>
            </Modal>
        );

        const AlertModal = ({ isOpen, message, onClose }) => (
            <Modal isOpen={isOpen} onClose={onClose} title="알림">
                <p className="text-slate-300 mb-8">{message}</p>
                <div className="flex justify-end">
                    <Button onClick={onClose}>확인</Button>
                </div>
            </Modal>
        );

        const Button = ({ children, onClick, variant = 'primary', className = '', type = 'button', disabled = false }) => {
            const baseStyle = "px-4 py-2 rounded-lg font-medium transition-colors focus:outline-none flex items-center justify-center gap-2";
            const variants = {
                primary: "bg-indigo-600 text-white hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-500",
                secondary: "bg-slate-800 text-slate-300 hover:bg-slate-700 disabled:opacity-50",
                danger: "bg-red-900/30 text-red-400 hover:bg-red-900/50 disabled:opacity-50",
                outline: "border border-slate-700 text-slate-300 hover:bg-slate-800 disabled:opacity-50"
            };
            return (
                <button type={type} onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {children}
                </button>
            );
        };

        const Input = ({ label, type = 'text', value, onChange, placeholder, required = false, className="" }) => (
            <div className={`flex flex-col gap-1 ${className}`}>
                {label && <label className="text-sm font-medium text-slate-400">{label}</label>}
                <input 
                    type={type} value={value} onChange={onChange} placeholder={placeholder} required={required}
                    className="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white placeholder-slate-600 focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-shadow"
                />
            </div>
        );

        const AuthScreen = ({ onLogin }) => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [agreed, setAgreed] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [message, setMessage] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setMessage('');
                
                if (!isLogin && !agreed) {
                    setError('개인정보 처리 방침에 동의해야 합니다.');
                    return;
                }

                setLoading(true);
                try {
                    let user;
                    if (isLogin) {
                        user = await api.auth.signIn(email, password);
                    } else {
                        user = await api.auth.signUp(email, password);
                        setMessage('회원가입이 완료되었습니다. 자동으로 로그인됩니다.');
                        await delay(500);
                    }
                    onLogin(user);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleResetPassword = async () => {
                if (!email) {
                    setError('비밀번호를 찾을 이메일을 입력해주세요.');
                    return;
                }
                setLoading(true);
                try {
                    await api.auth.resetPasswordForEmail(email);
                    setMessage('비밀번호 재설정 메일이 발송되었습니다.');
                    setError('');
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="bg-slate-900 p-8 rounded-2xl shadow-2xl border border-slate-800 w-full max-w-md">
                        <div className="flex justify-center mb-6 text-primary">
                            <Icons.Target />
                        </div>
                        <h2 className="text-2xl font-bold text-center text-white mb-8">
                            {isLogin ? '로그인' : '회원가입'}
                        </h2>
                        
                        {error && <div className="mb-4 p-3 bg-red-900/20 border border-red-500/20 text-red-400 text-sm rounded-lg flex items-center gap-2"><Icons.AlertCircle/> {error}</div>}
                        {message && <div className="mb-4 p-3 bg-green-900/20 border border-green-500/20 text-green-400 text-sm rounded-lg flex items-center gap-2"><Icons.Check/> {message}</div>}

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <Input label="이메일" type="email" value={email} onChange={e=>setEmail(e.target.value)} required placeholder="name@example.com" />
                            <Input label="비밀번호" type="password" value={password} onChange={e=>setPassword(e.target.value)} required placeholder="••••••••" />
                            
                            {!isLogin && (
                                <div className="flex items-start gap-2 mt-4">
                                    <input type="checkbox" id="terms" checked={agreed} onChange={e=>setAgreed(e.target.checked)} className="mt-1 accent-primary" />
                                    <label htmlFor="terms" className="text-sm text-slate-400">
                                        [필수] 개인정보 수집 및 데이터 처리에 동의합니다.
                                    </label>
                                </div>
                            )}

                            <Button type="submit" className="w-full mt-6" disabled={loading}>
                                {loading ? '처리 중...' : (isLogin ? '로그인' : '가입하기')}
                            </Button>
                        </form>

                        <div className="mt-6 text-center text-sm">
                            {isLogin ? (
                                <div className="space-y-2 flex flex-col">
                                    <button onClick={handleResetPassword} className="text-slate-400 hover:text-white transition-colors">비밀번호를 잊으셨나요?</button>
                                    <span className="text-slate-500">계정이 없으신가요? <button onClick={()=>setIsLogin(false)} className="text-primary font-medium hover:text-primaryHover">회원가입</button></span>
                                </div>
                            ) : (
                                <span className="text-slate-500">이미 계정이 있으신가요? <button onClick={()=>setIsLogin(true)} className="text-primary font-medium hover:text-primaryHover">로그인</button></span>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const GoalsView = ({ userId, isAdminView }) => {
            const [goals, setGoals] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingGoal, setEditingGoal] = useState(null);
            
            // Custom Confirm State
            const [confirmDelete, setConfirmDelete] = useState(null); 

            const loadGoals = useCallback(async () => {
                setLoading(true);
                const data = await api.data.getGoals(userId);
                setGoals(data);
                setLoading(false);
            }, [userId]);

            useEffect(() => { loadGoals(); }, [loadGoals]);

            const handleSaveGoal = async (goalData) => {
                await api.data.saveGoal({ ...goalData, userId });
                setIsModalOpen(false);
                loadGoals();
            };

            const triggerDeleteGoal = (goalId) => {
                setConfirmDelete(goalId);
            };

            const executeDeleteGoal = async () => {
                if(confirmDelete) {
                    await api.data.deleteGoal(confirmDelete);
                    setConfirmDelete(null);
                    setIsModalOpen(false);
                    loadGoals();
                }
            };

            const openNewGoalModal = () => {
                setEditingGoal({ title: '', category: '', deadline: '', milestones: [] });
                setIsModalOpen(true);
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-xl font-bold text-white">목표 관리</h2>
                            <p className="text-sm text-slate-400">달성하고 싶은 목표와 중간 단계를 설정하세요.</p>
                        </div>
                        {!isAdminView && (
                            <Button onClick={openNewGoalModal}><Icons.Plus /> 새 목표 작성</Button>
                        )}
                    </div>

                    {loading ? (
                        <div className="text-center py-10 text-slate-500">데이터 불러오는 중...</div>
                    ) : goals.length === 0 ? (
                        <div className="bg-slate-900 rounded-xl p-10 text-center border border-dashed border-slate-700">
                            <div className="text-slate-600 mb-2 flex justify-center"><Icons.Target /></div>
                            <p className="text-slate-400 mb-4">등록된 목표가 없습니다.</p>
                            {!isAdminView && <Button onClick={openNewGoalModal} variant="outline" className="mx-auto">첫 목표 세우기</Button>}
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {goals.map(goal => {
                                const dDay = calculateDDay(goal.deadline);

                                    <div key={goal.id} 
                                         className="bg-slate-900 rounded-xl p-5 border border-slate-800 hover:border-indigo-500/50 transition-colors cursor-pointer relative group"

                    <ConfirmModal

                        onClose={() => setConfirmDelete(null)} 
                    />

        };

        const GoalFormModal = ({ isOpen, onClose, initialData, onSave, onDelete }) => {
            const [formData, setFormData] = useState(initialData);

            // 드래그 앤 드롭을 위한 참조 변수
            const dragItem = useRef(null);
            const dragOverItem = useRef(null);

            useEffect(() => { if(isOpen) setFormData(initialData); }, [isOpen, initialData]);

            const addMilestone = () => {
                setFormData(prev => ({
                    ...prev,
                    milestones: [...(prev.milestones || []), { id: generateId(), title: '', deadline: '' }]
                }));
            };

            const updateMilestone = (id, field, value) => {
                setFormData(prev => ({
                    ...prev,
                    milestones: (prev.milestones || []).map(m => (m && m.id === id) ? { ...m, [field]: value } : m)
                }));
            };

            const removeMilestone = (id) => {
                setFormData(prev => ({
                    ...prev,
                    milestones: (prev.milestones || []).filter(m => m && m.id !== id)
                }));
            };

            // 중간 단계 드래그 앤 드롭 핸들러
            const handleDragStart = (e, index) => {
                dragItem.current = index;
                e.currentTarget.style.opacity = '0.4'; 
            };

            const handleDragEnter = (e, index) => {
                dragOverItem.current = index;
            };

            const handleDragEnd = (e) => {
                e.preventDefault();
                e.currentTarget.style.opacity = '1'; 
                
                if (dragItem.current !== null && dragOverItem.current !== null && dragItem.current !== dragOverItem.current) {
                    setFormData(prev => {
                        const newMilestones = [...(prev.milestones || [])];
                        const draggedItemContent = newMilestones[dragItem.current];
                        
                        if (!draggedItemContent) return prev;
                        
                        newMilestones.splice(dragItem.current, 1);
                        newMilestones.splice(dragOverItem.current, 0, draggedItemContent);
                        
                        return { ...prev, milestones: newMilestones.filter(Boolean) };
                    });
                }
                
                dragItem.current = null;
                dragOverItem.current = null;
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave({
                    ...formData,
                    milestones: (formData.milestones || []).filter(Boolean)
                });
            };

            const safeMilestones = (formData.milestones || []).filter(Boolean);

            return (
                <Modal isOpen={isOpen} onClose={onClose} title={formData.id ? "목표 수정" : "새 목표 생성"}>
                    <form onSubmit={handleSubmit} className="space-y-6">
                        <div className="space-y-4">
                            <h4 className="font-semibold text-slate-300 border-b border-slate-700 pb-2">기본 정보</h4>
                            <Input label="목표명" value={formData.title} onChange={e=>setFormData({...formData, title: e.target.value})} required placeholder="예: 토익 900점 달성" />
                            <div className="grid grid-cols-2 gap-4">
                                <Input label="카테고리" value={formData.category} onChange={e=>setFormData({...formData, category: e.target.value})} placeholder="예: 자기계발" />
                                <Input label="최종 기한" type="date" value={formData.deadline} onChange={e=>setFormData({...formData, deadline: e.target.value})} required />
                            </div>
                        </div>

                        <div className="space-y-3">
                            <div className="flex justify-between items-center border-b border-slate-700 pb-2">
                                <h4 className="font-semibold text-slate-300">중간 단계</h4>
                                <button type="button" onClick={addMilestone} className="text-sm text-indigo-400 flex items-center gap-1 hover:text-indigo-300 transition-colors">
                                    <Icons.Plus /> 추가
                                </button>
                            </div>
                            
                            {safeMilestones.length === 0 && (
                                <p className="text-sm text-slate-500 text-center py-2">등록된 중간 단계가 없습니다.</p>
                            )}
                            
                            <div className="space-y-2 max-h-40 overflow-y-auto pr-2">
                                {safeMilestones.map((ms, index) => (
                                    <div key={ms.id} 
                                         draggable
                                         onDragStart={(e) => handleDragStart(e, index)}
                                         onDragEnter={(e) => handleDragEnter(e, index)}
                                         onDragEnd={handleDragEnd}
                                         onDragOver={(e) => e.preventDefault()}
                                         className="flex gap-2 items-start bg-slate-800/50 p-2 rounded-lg border border-transparent hover:border-slate-700 transition-colors">
                                        
                                        <div className="pt-2 flex items-center justify-center cursor-move text-slate-500 hover:text-slate-300 transition-colors" title="드래그하여 순서 변경">
                                            <Icons.GripVertical />
                                        </div>

                                        <div className="pt-2 text-xs font-bold text-slate-500 w-5">{index+1}.</div>
                                        <div className="flex-1 space-y-2">
                                            <input type="text" value={ms.title} onChange={e=>updateMilestone(ms.id, 'title', e.target.value)} placeholder="단계 내용" className="w-full text-sm bg-slate-950 border border-slate-700 rounded px-2 py-1 text-slate-100 focus:border-indigo-500 outline-none" required />
                                            <input type="date" value={ms.deadline} onChange={e=>updateMilestone(ms.id, 'deadline', e.target.value)} className="w-full text-sm bg-slate-950 border border-slate-700 rounded px-2 py-1 text-slate-300 focus:border-indigo-500 outline-none" />
                                        </div>
                                        <button type="button" onClick={()=>removeMilestone(ms.id)} className="text-red-400 hover:text-red-300 p-1 transition-colors" title="삭제"><Icons.Trash /></button>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="flex justify-between pt-4 border-t border-slate-800">
                            {onDelete ? (
                                <Button variant="danger" onClick={onDelete}>삭제</Button>
                            ) : <div></div>}
                            <div className="flex gap-2">
                                <Button variant="secondary" onClick={onClose}>취소</Button>
                                <Button type="submit">저장하기</Button>
                            </div>
                        </div>
                    </form>
                </Modal>
            );
        };

        const ExecutionView = ({ userId }) => {

            const renderSimpleMode = () => (

                    </div>
                    <Input label="2. 구체적으로 무엇을 하실 건가요?" value={actionText} onChange={e=>setActionText(e.target.value)} />
                    <div className="grid grid-cols-2 gap-4">
                        <Input label="3. 언제/어느 시점에?" value={timeText} onChange={e=>setTimeText(e.target.value)} placeholder="예: 퇴근 후, 오후 8시" />
                        <Input label="얼마나 (분 단위)?" type="number" value={durationMinutes} onChange={e=>setDurationMinutes(e.target.value)} placeholder="60" />
                    </div>
                    <div>
                        <label className="block text-sm font-medium text-slate-300 mb-3">4. 방해 요인이 있나요?</label>
                        <div className="flex gap-4 mb-3">
                            <label className="flex items-center gap-2 text-slate-200 cursor-pointer"><input type="radio" checked={hasBlocker===true} onChange={()=>setHasBlocker(true)} className="accent-primary" /> 있음</label>
                            <label className="flex items-center gap-2 text-slate-200 cursor-pointer"><input type="radio" checked={hasBlocker===false} onChange={()=>setHasBlocker(false)} className="accent-primary" /> 없음</label>
                        </div>
                        {hasBlocker && (
                            <div className="space-y-4 mt-4 bg-slate-800/50 p-4 rounded-lg border border-slate-700">
                                <Input label="어떤 문제인가요?" value={blockerText} onChange={e=>setBlockerText(e.target.value)} />
                                <Input label="어떻게 대처할까요?" value={solutionText} onChange={e=>setSolutionText(e.target.value)} />
                            </div>
                        )}
                    </div>
                    <Button onClick={handleSavePlan} className="w-full py-3 text-lg" disabled={!selectedGoalId || !actionText || !durationMinutes}>계획 저장하기</Button>
                </div>
            );

            const renderInteractiveMode = () => {
                const stepClasses = "bg-slate-900 rounded-xl border border-slate-800 p-8 min-h-[300px] flex flex-col justify-center animate-[fadeIn_0.3s_ease-out]";
                const questionClasses = "text-2xl font-bold text-white mb-6 leading-relaxed";
                const inputClasses = "w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-lg text-white focus:border-indigo-500 outline-none";
                
                return (
                    <div className="max-w-2xl mx-auto">
                        <div className="flex justify-between text-xs font-bold text-slate-500 mb-6 px-2">
                            {[1,2,3,4,5].map(s => (
                                <span key={s} className={step >= s ? 'text-indigo-400' : ''}>STEP {s}</span>
                            ))}
                        </div>

                        {step === 1 && (
                            <div className={stepClasses}>
                                <h3 className={questionClasses}>Q1. 오늘은 어떤 목표를 위해 노력하실 건가요?</h3>
                                <select className={`${inputClasses} mb-4`} value={selectedGoalId} onChange={e=>setSelectedGoalId(e.target.value)}>
                                    <option value="">등록된 목표를 선택해주세요</option>
                                    {goals.map(g => <option key={g.id} value={g.id}>{g.title}</option>)}
                                </select>
                                {selectedGoal && selectedGoal.milestones?.length > 0 && (
                                    <div className="mb-4 animate-[slideUp_0.2s_ease-out]">
                                        <p className="text-sm font-medium text-slate-400 mb-3">연관된 중간 단계가 있다면 선택해주세요</p>
                                        <select className={inputClasses} value={selectedMilestoneId} onChange={e=>setSelectedMilestoneId(e.target.value)}>
                                            <option value="">선택 안함</option>
                                            {selectedGoal.milestones.map(m => <option key={m.id} value={m.id}>{m.title}</option>)}
                                        </select>
                                    </div>
                                )}
                                <div className="mt-auto flex justify-end pt-8 border-t border-slate-800">
                                    <Button onClick={()=>setStep(2)} disabled={!selectedGoalId}>다음 <Icons.ChevronRight/></Button>
                                </div>
                            </div>
                        )}

                        {step === 2 && (
                            <div className={stepClasses}>
                                <h3 className={questionClasses}>Q2. 선택한 목표를 위해 구체적으로 무엇을 하실 건가요?</h3>
                                <textarea 
                                    className={`${inputClasses} resize-none h-32 placeholder-slate-600`}
                                    placeholder="예: 리액트 훅(useEffect) 관련 공식 문서 읽고 예제 코드 3개 작성하기"
                                    value={actionText} onChange={e=>setActionText(e.target.value)}
                                />
                                <div className="mt-auto flex justify-between pt-8 border-t border-slate-800">
                                    <Button variant="secondary" onClick={()=>setStep(1)}>이전</Button>
                                    <Button onClick={()=>setStep(3)} disabled={!actionText.trim()}>다음 <Icons.ChevronRight/></Button>
                                </div>
                            </div>
                        )}

                        {step === 3 && (
                            <div className={stepClasses}>
                                <h3 className={questionClasses}>Q3. 그러면 오늘 중에 언제, 얼마나 하시겠어요?</h3>
                                <div className="space-y-6">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-400 mb-2">언제 / 어느 시점?</label>
                                        <input type="text" className={inputClasses} placeholder="예: 저녁 식사 후 8시" value={timeText} onChange={e=>setTimeText(e.target.value)} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-400 mb-2">수행 시간 (분)</label>
                                        <input type="number" className={inputClasses} placeholder="예: 60" value={durationMinutes} onChange={e=>setDurationMinutes(e.target.value)} />
                                    </div>
                                </div>
                                <div className="mt-auto flex justify-between pt-8 border-t border-slate-800">
                                    <Button variant="secondary" onClick={()=>setStep(2)}>이전</Button>
                                    <Button onClick={()=>setStep(4)} disabled={!timeText.trim() || !durationMinutes}>다음 <Icons.ChevronRight/></Button>
                                </div>
                            </div>
                        )}

                        {step === 4 && (
                            <div className={stepClasses}>
                                <h3 className={questionClasses}>Q4. 혹시 오늘 계획을 실천하기 어렵게 만들만한 방해 요소가 있을까요?</h3>
                                <div className="flex gap-4 mb-8">
                                    <button className={`flex-1 py-4 rounded-xl border font-bold text-lg transition-colors ${hasBlocker === true ? 'border-indigo-500 bg-indigo-900/30 text-indigo-400' : 'border-slate-700 text-slate-400 hover:bg-slate-800'}`} onClick={()=>setHasBlocker(true)}>있다</button>
                                    <button className={`flex-1 py-4 rounded-xl border font-bold text-lg transition-colors ${hasBlocker === false ? 'border-green-500 bg-green-900/30 text-green-400' : 'border-slate-700 text-slate-400 hover:bg-slate-800'}`} onClick={()=>{setHasBlocker(false); setStep(5);}}>없다 (바로 다음)</button>
                                </div>
                                
                                {hasBlocker && (
                                    <div className="space-y-5 animate-[slideUp_0.2s_ease-out]">
                                        <Input label="어떤 문제인가요?" value={blockerText} onChange={e=>setBlockerText(e.target.value)} />
                                        <Input label="어떻게 대처해 보시겠어요?" value={solutionText} onChange={e=>setSolutionText(e.target.value)} />
                                    </div>

                                <div className="mt-auto flex justify-between pt-8 border-t border-slate-800">
                                    <Button variant="secondary" onClick={()=>setStep(3)}>이전</Button>
                                    {hasBlocker && <Button onClick={()=>setStep(5)} disabled={!blockerText.trim()}>다음 <Icons.ChevronRight/></Button>}
                                </div>
                            </div>
                        )}

                        {step === 5 && (
                            <div className={stepClasses}>
                                <h3 className={questionClasses}>Q5. 최종적으로, 방금 세우신 오늘 계획 정말 실천 가능하세요?</h3>
                                
                                <div className="bg-slate-800/50 p-6 rounded-xl mb-8 space-y-4 text-sm border border-slate-700">
                                    <p className="flex flex-col gap-1"><strong className="text-slate-500 uppercase text-xs">목표:</strong> <span className="text-white text-base">{selectedGoal?.title}</span></p>
                                    <p className="flex flex-col gap-1"><strong className="text-slate-500 uppercase text-xs">실행내용:</strong> <span className="text-white text-base">{actionText}</span></p>
                                    <p className="flex flex-col gap-1"><strong className="text-slate-500 uppercase text-xs">일시/시간:</strong> <span className="text-white text-base">{timeText} ({parseInt(durationMinutes, 10)}분)</span></p>
                                    {hasBlocker && <p className="flex flex-col gap-1"><strong className="text-red-400 uppercase text-xs">대비책:</strong> <span className="text-slate-300">{blockerText} {'->'} {solutionText}</span></p>}

                                <div className="flex flex-col gap-3">

                    <AlertModal isOpen={!!alertMessage} message={alertMessage} onClose={() => setAlertMessage('')} />

        const JournalView = ({ userId, isAdminView }) => {
            const [plans, setPlans] = useState([]);
            const [goals, setGoals] = useState([]);
            const [loading, setLoading] = useState(true);
            const [confirmDelete, setConfirmDelete] = useState(null); // 삭제 확인 상태

            const loadData = useCallback(async () => {
                setLoading(true);
                const [pData, gData] = await Promise.all([
                    api.data.getPlans(userId),
                    api.data.getGoals(userId)
                ]);
                setPlans(pData.sort((a,b) => new Date(b.date) - new Date(a.date)));
                setGoals(gData);
                setLoading(false);
            }, [userId]);

            useEffect(() => { loadData(); }, [loadData]);

            const updatePlan = async (planId, field, value) => {
                if (isAdminView) return;
                const planToUpdate = plans.find(p => p.id === planId);
                if(planToUpdate) {
                    const updated = { ...planToUpdate, [field]: value };
                    setPlans(plans.map(p => p.id === planId ? updated : p));
                    await api.data.savePlan(updated);
                }
            };

            const toggleComplete = (planId, currentStatus) => {
                const newStatus = currentStatus === 'completed' ? 'pending' : 'completed';
                updatePlan(planId, 'status', newStatus);
            };
            
            const triggerDeletePlan = (planId) => {
                setConfirmDelete(planId);
            };

            const executeDeletePlan = async () => {
                if (confirmDelete) {
                    await api.data.deletePlan(confirmDelete);
                    setPlans(plans.filter(p => p.id !== confirmDelete));
                    setConfirmDelete(null);
                }
            };

            const getGoalTitle = (goalId) => goals.find(g => g.id === goalId)?.title || '삭제된 목표';

            const groupedPlans = plans.reduce((acc, plan) => {
                if(!acc[plan.date]) acc[plan.date] = [];
                acc[plan.date].push(plan);
                return acc;
            }, {});

            if (loading) return <div className="text-center py-10 text-slate-500">로딩 중...</div>;

            return (
                <div className="space-y-8">
                    <div>
                        <h2 className="text-xl font-bold text-white">실행 목록 (일지)</h2>
                        <p className="text-sm text-slate-400">실행 여부를 점검하고 결과를 기록하세요. 이월 기능 없이 엄격하게 관리됩니다.</p>
                    </div>

                    {Object.keys(groupedPlans).length === 0 ? (
                        <div className="bg-slate-900 rounded-xl p-10 text-center border border-dashed border-slate-700">
                            <p className="text-slate-500">기록된 계획이 없습니다.</p>
                        </div>
                    ) : (
                        Object.keys(groupedPlans).sort((a,b) => new Date(b) - new Date(a)).map(date => (
                            <div key={date} className="mb-8">
                                <h3 className="font-bold text-slate-300 mb-4 flex items-center gap-2">
                                    <Icons.Calendar /> {date} {date === getTodayString() && <span className="px-2 py-0.5 bg-indigo-600 text-white text-xs rounded-full">오늘</span>}
                                </h3>
                                <div className="space-y-4">
                                    {groupedPlans[date].map(plan => {
                                        const isCompleted = plan.status === 'completed';
                                        return (
                                            <div key={plan.id} className={`bg-slate-900 rounded-xl p-5 border-l-4 transition-all relative ${isCompleted ? 'border-l-green-500 border-t-transparent border-r-transparent border-b-transparent opacity-90' : 'border-slate-800 hover:border-l-indigo-500'}`}>
                                                {!isAdminView && (
                                                    <button 
                                                        onClick={() => triggerDeletePlan(plan.id)}
                                                        className="absolute top-4 right-4 text-slate-600 hover:text-red-400 transition-colors p-1"
                                                        title="계획 삭제"
                                                    >
                                                        <Icons.Trash />
                                                    </button>
                                                )}
                                                <div className="flex items-start gap-4 pr-8">
                                                    <div className="pt-1">
                                                        <button 
                                                            disabled={isAdminView}
                                                            onClick={() => toggleComplete(plan.id, plan.status)}
                                                            className={`w-6 h-6 rounded border flex items-center justify-center transition-colors ${isCompleted ? 'bg-green-500/20 border-green-500 text-green-400' : 'bg-slate-950 border-slate-600 hover:border-indigo-400'}`}>
                                                            {isCompleted && <Icons.Check />}
                                                        </button>
                                                    </div>
                                                    <div className="flex-1">
                                                        <div className="text-xs font-semibold text-indigo-400 mb-1">{getGoalTitle(plan.goalId)}</div>
                                                        <div className={`text-lg font-medium mb-2 ${isCompleted ? 'text-slate-500 line-through' : 'text-white'}`}>
                                                            {plan.actionText}
                                                        </div>
                                                        <div className="text-sm text-slate-400 mb-4">
                                                            예정: {plan.timeText} / {parseInt(plan.durationPlanned, 10)}분
                                                        </div>
                                                        
                                                        {/* 복기 영역 */}
                                                        <div className="bg-slate-800/50 border border-slate-700 p-4 rounded-lg flex flex-col sm:flex-row gap-4 items-start sm:items-center">
                                                            <div className="flex items-center gap-2">
                                                                <label className="text-xs font-bold text-slate-400 whitespace-nowrap">실제 소요시간(분):</label>
                                                                <input type="number" 
                                                                    disabled={isAdminView}
                                                                    className="w-20 bg-slate-950 border border-slate-600 rounded p-1.5 text-sm text-center text-white focus:border-indigo-500 outline-none" 
                                                                    value={plan.durationActual || ''} 
                                                                    onChange={e=>updatePlan(plan.id, 'durationActual', parseInt(e.target.value, 10) || 0)}
                                                                    placeholder="0" />
                                                            </div>
                                                            <div className="flex-1 w-full">
                                                                <input type="text" 
                                                                    disabled={isAdminView}
                                                                    className="w-full bg-slate-950 border border-slate-600 rounded p-1.5 text-sm text-white focus:border-indigo-500 outline-none placeholder-slate-600" 
                                                                    value={plan.notes || ''} 
                                                                    onChange={e=>updatePlan(plan.id, 'notes', e.target.value)}
                                                                    placeholder="결과물 메모 또는 반성할 점을 남겨주세요." />
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        ))
                    )}
                    
                    <ConfirmModal 
                        isOpen={!!confirmDelete} 
                        message="정말 이 일일 계획을 삭제하시겠습니까?" 
                        onConfirm={executeDeletePlan} 
                        onClose={() => setConfirmDelete(null)} 
                    />
                </div>
            );
        };

        const StatsView = ({ userId }) => {
            const [plans, setPlans] = useState([]);
            const [goals, setGoals] = useState([]);
            const [filter, setFilter] = useState('month'); 

            useEffect(() => {
                Promise.all([api.data.getPlans(userId), api.data.getGoals(userId)]).then(([p, g]) => {
                    setPlans(p); setGoals(g);
                });
            }, [userId]);

            const filteredPlans = useMemo(() => {
                const now = new Date();
                const cutoff = new Date();
                if (filter === 'week') cutoff.setDate(now.getDate() - 7);
                if (filter === 'month') cutoff.setMonth(now.getMonth() - 1);
                if (filter === 'year') cutoff.setFullYear(now.getFullYear() - 1);
                
                return plans.filter(p => new Date(p.date) >= cutoff);
            }, [plans, filter]);

            const stats = useMemo(() => {
                const total = filteredPlans.length;
                const completed = filteredPlans.filter(p => p.status === 'completed').length;
                const completionRate = total === 0 ? 0 : Math.round((completed / total) * 100);
                
                let plannedTime = 0;
                let actualTime = 0;
                
                const goalStats = {};
                goals.forEach(g => goalStats[g.id] = { title: g.title, count: 0, time: 0 });

                filteredPlans.forEach(p => {
                    plannedTime += (parseInt(p.durationPlanned, 10) || 0);
                    if(p.status === 'completed') {
                        actualTime += (parseInt(p.durationActual, 10) || 0);
                        if(goalStats[p.goalId]) {
                            goalStats[p.goalId].count += 1;
                            goalStats[p.goalId].time += (parseInt(p.durationActual, 10) || 0);
                        }
                    }
                });

                const sortedGoals = Object.values(goalStats).sort((a,b) => b.time - a.time);

                return { total, completed, completionRate, plannedTime, actualTime, sortedGoals };
            }, [filteredPlans, goals]);

            // 정수 기반의 완벽한 분 -> 시간 변환 로직 적용
            const formatTime = (mins) => {
                const totalMins = parseInt(mins, 10) || 0;
                if (totalMins === 0) return '0분';
                const h = Math.floor(totalMins / 60);
                const m = totalMins % 60;
                
                if (h === 0) return `${m}분`;
                if (m === 0) return `${h}시간`;
                return `${h}시간 ${m}분`;
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-xl font-bold text-white">통계 리포트</h2>
                        <select className="bg-slate-900 border border-slate-700 text-white rounded-lg p-2 text-sm outline-none focus:border-indigo-500" value={filter} onChange={e=>setFilter(e.target.value)}>
                            <option value="week">최근 1주일</option>
                            <option value="month">최근 1개월</option>
                            <option value="year">최근 1년</option>
                        </select>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-slate-900 p-6 rounded-xl border border-slate-800 flex flex-col justify-center items-center">
                            <span className="text-slate-400 text-sm font-medium mb-3">종합 달성률</span>
                            <div className="text-4xl font-bold text-indigo-400">{stats.completionRate}%</div>
                            <span className="text-xs text-slate-500 mt-2">{stats.completed} / {stats.total} 완료</span>
                        </div>
                        <div className="bg-slate-900 p-6 rounded-xl border border-slate-800 flex flex-col justify-center items-center">
                            <span className="text-slate-400 text-sm font-medium mb-3">총 계획 시간</span>
                            <div className="text-3xl font-bold text-slate-300">{formatTime(stats.plannedTime)}</div>
                        </div>
                        <div className="bg-slate-900 p-6 rounded-xl border border-slate-800 flex flex-col justify-center items-center">
                            <span className="text-slate-400 text-sm font-medium mb-3">실제 투입 시간 (완료)</span>
                            <div className="text-3xl font-bold text-green-400">{formatTime(stats.actualTime)}</div>
                        </div>
                    </div>

                    <div className="bg-slate-900 rounded-xl border border-slate-800 p-6 mt-8">
                        <h3 className="font-bold text-slate-300 mb-6">목표별 기여도 (실제 투입 시간 기준)</h3>
                        <div className="space-y-5">
                            {stats.sortedGoals.map((g, idx) => {
                                const maxTime = stats.sortedGoals[0]?.time || 1;
                                const percent = Math.round((g.time / maxTime) * 100);
                                if(g.time === 0 && g.count === 0) return null;
                                return (
                                    <div key={idx} className="flex items-center gap-4">
                                        <div className="w-1/3 truncate text-sm font-medium text-slate-300" title={g.title}>{g.title}</div>
                                        <div className="flex-1 bg-slate-800 rounded-full h-3 overflow-hidden flex">
                                            <div className="bg-indigo-500 h-full rounded-full transition-all duration-1000" style={{ width: `${percent}%` }}></div>
                                        </div>
                                        <div className="w-32 text-right text-xs text-slate-400">
                                            {formatTime(g.time)} ({g.count}회)
                                        </div>
                                    </div>
                                );
                            })}
                            {stats.sortedGoals.filter(g => g.time > 0).length === 0 && (
                                <p className="text-sm text-slate-500 text-center py-4">해당 기간 내에 완료된 목표 기록이 없습니다.</p>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const AdminView = () => {
            const [users, setUsers] = useState([]);
            const [globalStats, setGlobalStats] = useState(null);
            const [selectedUserId, setSelectedUserId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [confirmDelete, setConfirmDelete] = useState(null);

            const loadAdminData = useCallback(async () => {
                const [u, s] = await Promise.all([api.admin.getAllUsers(), api.admin.getGlobalStats()]);
                setUsers(u);
                setGlobalStats(s);
            }, []);

            useEffect(() => { loadAdminData(); }, [loadAdminData]);
            
            const triggerDeleteUser = (id) => {
                setConfirmDelete(id);
            };

            const executeDeleteUser = async () => {
                if(confirmDelete) {
                    await api.auth.deleteUser(confirmDelete);
                    if(selectedUserId === confirmDelete) setSelectedUserId(null);
                    setConfirmDelete(null);
                    loadAdminData();
                }
            };

            const filteredUsers = users.filter(u => u.email.toLowerCase().includes(searchTerm.toLowerCase()));

            if (selectedUserId) {
                const user = users.find(u => u.id === selectedUserId);
                return (
                    <div className="space-y-8">
                        <div className="flex items-center gap-4 bg-slate-800 border border-slate-700 text-slate-300 p-4 rounded-xl">
                            <Button variant="secondary" className="!py-1.5 !px-3 text-sm bg-slate-900 border border-slate-700" onClick={()=>setSelectedUserId(null)}>← 목록으로</Button>
                            <div>
                                <span className="font-bold text-white">[{user.email}]</span> 유저 데이터 모니터링 중 (읽기 전용)
                            </div>
                        </div>
                        
                        <div className="border-b border-slate-800 pb-8">
                            <h3 className="text-lg font-bold mb-6 text-white border-l-4 border-indigo-500 pl-3">목표 현황</h3>
                            <GoalsView userId={selectedUserId} isAdminView={true} />
                        </div>
                        <div className="border-b border-slate-800 pb-8">
                            <h3 className="text-lg font-bold mb-6 text-white border-l-4 border-indigo-500 pl-3">일일 실행 일지</h3>
                            <JournalView userId={selectedUserId} isAdminView={true} />
                        </div>
                        <div>
                            <h3 className="text-lg font-bold mb-6 text-white border-l-4 border-indigo-500 pl-3">통계 리포트</h3>
                            <StatsView userId={selectedUserId} isAdminView={true} />
                        </div>
                    </div>
                );
            }

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-xl font-bold text-white">관리자 대시보드</h2>
                        <p className="text-sm text-slate-400">시스템 전체 통계 및 유저 관리를 수행합니다.</p>
                    </div>

                    {globalStats && (
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div className="bg-indigo-500/10 p-5 rounded-xl border border-indigo-500/20">
                                <div className="text-indigo-400 text-sm font-medium mb-1">총 가입 유저</div>
                                <div className="text-3xl font-bold text-indigo-300">{globalStats.totalUsers}명</div>
                            </div>
                            <div className="bg-blue-500/10 p-5 rounded-xl border border-blue-500/20">
                                <div className="text-blue-400 text-sm font-medium mb-1">등록된 목표</div>
                                <div className="text-3xl font-bold text-blue-300">{globalStats.totalGoals}개</div>
                            </div>
                            <div className="bg-emerald-500/10 p-5 rounded-xl border border-emerald-500/20">
                                <div className="text-emerald-400 text-sm font-medium mb-1">총 실행 계획</div>
                                <div className="text-3xl font-bold text-emerald-300">{globalStats.totalPlans}건</div>
                            </div>
                            <div className="bg-purple-500/10 p-5 rounded-xl border border-purple-500/20">
                                <div className="text-purple-400 text-sm font-medium mb-1">전체 완료율</div>
                                <div className="text-3xl font-bold text-purple-300">
                                    {globalStats.totalPlans ? Math.round((globalStats.completedPlans/globalStats.totalPlans)*100) : 0}%
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden">
                        <div className="p-4 border-b border-slate-800 bg-slate-900/50 flex flex-col md:flex-row justify-between items-center gap-4">
                            <h3 className="font-bold text-white">유저 목록</h3>
                            <input 
                                type="text" placeholder="이메일 검색..." 
                                className="bg-slate-950 border border-slate-700 text-white rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-indigo-500 w-full md:w-auto"
                                value={searchTerm} onChange={e=>setSearchTerm(e.target.value)}
                            />
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-slate-800 text-slate-400">
                                    <tr>
                                        <th className="p-4 font-medium">ID</th>
                                        <th className="p-4 font-medium">이메일</th>
                                        <th className="p-4 font-medium">권한</th>
                                        <th className="p-4 font-medium text-right">관리</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredUsers.map(user => (
                                        <tr key={user.id} className="border-b border-slate-800 hover:bg-slate-800/50 transition-colors">
                                            <td className="p-4 text-slate-500 font-mono text-xs">{user.id}</td>
                                            <td className="p-4 font-medium text-slate-200">{user.email}</td>
                                            <td className="p-4">
                                                <span className={`px-2 py-1 rounded text-xs font-bold uppercase ${user.role==='admin'?'bg-red-500/20 text-red-400':'bg-slate-700 text-slate-300'}`}>
                                                    {user.role}
                                                </span>
                                            </td>
                                            <td className="p-4 text-right space-x-3">
                                                <button onClick={()=>setSelectedUserId(user.id)} className="text-indigo-400 hover:text-indigo-300 text-sm font-medium transition-colors">조회</button>
                                                {user.role !== 'admin' && (
                                                    <button onClick={()=>triggerDeleteUser(user.id)} className="text-red-400 hover:text-red-300 text-sm font-medium transition-colors">삭제</button>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                    {filteredUsers.length === 0 && (
                                        <tr><td colSpan="4" className="p-8 text-center text-slate-500">검색 결과가 없습니다.</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <ConfirmModal 
                        isOpen={!!confirmDelete} 
                        message="이 유저와 관련된 모든 데이터가 삭제됩니다. 계속하시겠습니까?" 
                        onConfirm={executeDeleteUser} 
                        onClose={() => setConfirmDelete(null)} 
                    />
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [currentView, setCurrentView] = useState('goals'); 
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [newPassword, setNewPassword] = useState('');
            const [alertMessage, setAlertMessage] = useState('');

            const views = [
                { id: 'goals', label: '목표 관리', icon: <Icons.Target /> },
                { id: 'execution', label: '실행 계획', icon: <Icons.Play /> },
                { id: 'journal', label: '실행 목록', icon: <Icons.BookOpen /> },
                { id: 'stats', label: '통계 리포트', icon: <Icons.BarChart /> }
            ];

            if (user?.role === 'admin') {
                views.push({ id: 'admin', label: '관리자 대시보드', icon: <Icons.Users /> });
            }

            const handleLogout = () => setUser(null);

            const handleUpdatePassword = async (e) => {
                e.preventDefault();
                if(!newPassword) return;
                try {
                    await api.auth.updateUser(user.id, newPassword);
                    setAlertMessage('비밀번호가 성공적으로 변경되었습니다.');
                    setIsSettingsOpen(false);
                    setNewPassword('');
                } catch(err) {
                    setAlertMessage(err.message);
                }
            };

            if (!user) return <AuthScreen onLogin={setUser} />;

            return (
                <div className="min-h-screen bg-[#020617] text-slate-200 flex flex-col font-sans selection:bg-indigo-500/30">
                    {/* Top Navigation Bar */}
                    <header className="bg-[#020617] border-b border-slate-800 sticky top-0 z-20 shadow-sm">
                        <div className="max-w-6xl mx-auto px-4 md:px-8">
                            <div className="flex justify-between items-center h-16">
                                <h1 className="text-xl font-extrabold text-indigo-400 flex items-center gap-2">
                                    <Icons.Target /> GoalTracker
                                </h1>
                                <div className="flex items-center gap-4">
                                    {/* User Info (Desktop) */}
                                    <div className="hidden sm:flex items-center gap-2 text-sm bg-slate-900 px-3 py-1.5 rounded-full border border-slate-800">
                                        <div className="w-6 h-6 rounded-full bg-indigo-500/20 flex items-center justify-center text-indigo-400 font-bold text-xs">
                                            {user.email[0].toUpperCase()}
                                        </div>
                                        <span className="font-medium text-slate-300">{user.email}</span>
                                        {user.role === 'admin' && <span className="text-[10px] bg-red-500/20 text-red-400 px-1.5 rounded uppercase font-bold tracking-wider">Admin</span>}
                                    </div>
                                    <div className="flex items-center gap-1 border-l border-slate-800 pl-4 ml-1">
                                        <button onClick={()=>setIsSettingsOpen(true)} className="p-2 text-slate-500 hover:text-slate-300 hover:bg-slate-800 rounded-lg transition-colors" title="설정"><Icons.Settings /></button>
                                        <button onClick={handleLogout} className="p-2 text-red-400/70 hover:text-red-400 hover:bg-red-900/20 rounded-lg transition-colors" title="로그아웃"><Icons.LogOut /></button>
                                    </div>
                                </div>
                            </div>
                            
                            {/* Tabs */}
                            <nav className="flex gap-4 sm:gap-8 overflow-x-auto scrollbar-hide pt-2">
                                {views.map(view => (
                                    <button key={view.id} 
                                        onClick={() => setCurrentView(view.id)}
                                        className={`py-3 px-1 border-b-2 font-medium text-sm whitespace-nowrap flex items-center gap-2 transition-all
                                        ${currentView === view.id ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-500 hover:text-slate-300 hover:border-slate-700'}`}>
                                        {view.icon} {view.label}
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 overflow-y-auto p-4 md:p-8">
                        <div className="max-w-6xl mx-auto pb-10">
                            {currentView === 'goals' && <GoalsView userId={user.id} />}
                            {currentView === 'execution' && <ExecutionView userId={user.id} />}
                            {currentView === 'journal' && <JournalView userId={user.id} />}
                            {currentView === 'stats' && <StatsView userId={user.id} />}
                            {currentView === 'admin' && <AdminView />}
                        </div>
                    </main>

                    {/* Settings Modal */}
                    <Modal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} title="내 정보 / 설정">
                        <div className="space-y-6">
                            <div>
                                <label className="text-xs font-bold text-slate-500 uppercase">계정 정보</label>
                                <div className="mt-2 p-4 bg-slate-950 border border-slate-800 rounded-lg text-sm text-slate-300 space-y-2">
                                    <p className="flex items-center justify-between"><strong>이메일</strong> <span>{user.email}</span></p>
                                    <p className="flex items-center justify-between"><strong>권한</strong> <span className="uppercase text-xs font-bold bg-slate-800 px-2 py-1 rounded">{user.role}</span></p>
                                </div>
                            </div>
                            <form onSubmit={handleUpdatePassword} className="space-y-4 pt-4 border-t border-slate-800">
                                <div>
                                    <label className="text-xs font-bold text-slate-500 uppercase flex items-center gap-1"><Icons.Lock/> 비밀번호 변경</label>
                                    <Input type="password" value={newPassword} onChange={e=>setNewPassword(e.target.value)} placeholder="새 비밀번호 입력" className="mt-2" required />
                                </div>
                                <Button type="submit" className="w-full">변경 저장</Button>
                            </form>
                        </div>
                    </Modal>
                    
                    <AlertModal isOpen={!!alertMessage} message={alertMessage} onClose={() => setAlertMessage('')} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
