<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>목표 및 실행 관리 대시보드</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    // ==========================================
    // 0. Supabase 연동 설정 & 지연 함수
    // ==========================================
    const SUPABASE_URL = "https://tuvzubjiucnlvtdagqqe.supabase.co"; // TODO: 실제 URL로 변경
    const SUPABASE_ANON_KEY = "sb_publishable_WG9ZK-Xugns3X_fsksQ2jw_9XV7UQCD";     // TODO: 실제 Anon Key로 변경

    let supabase;
    try {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
      console.warn("Supabase 클라이언트 생성 경고:", e.message);
    }

    const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // Lucide 아이콘 React 래퍼 컴포넌트
    const Icon = ({ name, size = 20, className = "" }) => {
      const [svgContent, setSvgContent] = React.useState('');
      React.useEffect(() => {
        if (window.lucide && window.lucide.icons && window.lucide.icons[name]) {
          const icon = window.lucide.icons[name];
          const svg = icon.toSvg({ size, class: className });
          setSvgContent(svg);
        }
      }, [name, size, className]);

      return <span dangerouslySetInnerHTML={{ __html: svgContent }} className="inline-flex items-center justify-center" />;
    };

    // 시간 변환 헬퍼 (분 -> 시간/분 표현)
    const formatTime = (minutes) => {
      const m = parseInt(minutes, 10) || 0;
      if (m <= 0) return '0분';
      const hrs = Math.floor(m / 60);
      const mins = m % 60;
      if (hrs > 0 && mins > 0) return `${hrs}시간 ${mins}분`;
      if (hrs > 0) return `${hrs}시간`;
      return `${mins}분`;
    };

    // ==========================================
    // 1. Supabase API 데이터 처리 레이어
    // ==========================================
    const api = {
      auth: {
        signUp: async (email, password) => {
          if (!supabase) return { error: { message: "Supabase 설정이 필요합니다." } };
          return await supabase.auth.signUp({
            email,
            password,
            options: { data: { role: 'user' } }
          });
        },
        signIn: async (email, password) => {
          if (!supabase) return { error: { message: "Supabase 설정이 필요합니다." } };
          return await supabase.auth.signInWithPassword({ email, password });
        },
        signOut: async () => {
          if (!supabase) return { error: null };
          return await supabase.auth.signOut();
        },
        resetPassword: async (email) => {
          if (!supabase) return { error: { message: "Supabase 설정이 필요합니다." } };
          return await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin
          });
        },
        updatePassword: async (newPassword) => {
          if (!supabase) return { error: { message: "Supabase 설정이 필요합니다." } };
          return await supabase.auth.updateUser({ password: newPassword });
        },
        getUser: async () => {
          if (!supabase) return null;
          const { data } = await supabase.auth.getUser();
          return data?.user || null;
        }
      },
      data: {
        getGoals: async (userId) => {
          if (!supabase) return [];
          const { data, error } = await supabase.from('goals').select('*').eq('userId', userId);
          if (error) { console.error(error); return []; }
          return data || [];
        },
        saveGoal: async (userId, goal) => {
          if (!supabase) return goal;
          if (goal.id) {
            const { data, error } = await supabase.from('goals').update(goal).eq('id', goal.id).select();
            return data ? data[0] : goal;
          } else {
            const newGoal = { ...goal, userId, id: crypto.randomUUID() };
            const { data, error } = await supabase.from('goals').insert(newGoal).select();
            return data ? data[0] : newGoal;
          }
        },
        deleteGoal: async (goalId) => {
          if (!supabase) return;
          await supabase.from('goals').delete().eq('id', goalId);
        },
        getPlans: async (userId) => {
          if (!supabase) return [];
          const { data, error } = await supabase.from('plans').select('*').eq('userId', userId);
          if (error) { console.error(error); return []; }
          return data || [];
        },
        savePlan: async (userId, plan) => {
          if (!supabase) return plan;
          if (plan.id) {
            const { data, error } = await supabase.from('plans').update(plan).eq('id', plan.id).select();
            return data ? data[0] : plan;
          } else {
            const newPlan = { ...plan, userId, id: crypto.randomUUID() };
            const { data, error } = await supabase.from('plans').insert(newPlan).select();
            return data ? data[0] : newPlan;
          }
        },
        deletePlan: async (planId) => {
          if (!supabase) return;
          await supabase.from('plans').delete().eq('id', planId);
        },
        getAllAdminData: async () => {
          if (!supabase) return { users: [], goals: [], plans: [] };
          const { data: users } = await supabase.from('profiles').select('*');
          const { data: goals } = await supabase.from('goals').select('*');
          const { data: plans } = await supabase.from('plans').select('*');
          return { users: users || [], goals: goals || [], plans: plans || [] };
        }
      }
    };

    // ==========================================
    // 2. 공통 UI 컴포넌트 (커스텀 모달)
    // ==========================================
    const CustomModal = ({ isOpen, title, children, onClose }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fadeIn">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl text-slate-100 flex flex-col max-h-full">
            <div className="flex justify-between items-center px-6 py-4 border-b border-slate-800 shrink-0">
              <h3 className="text-lg font-bold text-white">{title}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition">
                <Icon name="X" size={20} />
              </button>
            </div>
            <div className="p-6 overflow-y-auto">{children}</div>
          </div>
        </div>
      );
    };

    const AlertModal = ({ isOpen, message, onClose }) => (
      <CustomModal isOpen={isOpen} title="알림" onClose={onClose}>
        <p className="text-sm text-slate-300 mb-6">{message}</p>
        <div className="flex justify-end">
          <button onClick={onClose} className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-xl transition shadow-lg shadow-indigo-600/20">
            확인
          </button>
        </div>
      </CustomModal>
    );

    const ConfirmModal = ({ isOpen, message, onConfirm, onClose }) => (
      <CustomModal isOpen={isOpen} title="확인" onClose={onClose}>
        <p className="text-sm text-slate-300 mb-6">{message}</p>
        <div className="flex justify-end gap-3">
          <button onClick={onClose} className="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium rounded-xl transition">
            취소
          </button>
          <button onClick={() => { onConfirm(); onClose(); }} className="px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white text-sm font-medium rounded-xl transition shadow-lg shadow-red-600/20">
            실행
          </button>
        </div>
      </CustomModal>
    );

    // ==========================================
    // 3. 비밀번호 재설정 모달 (복구 링크 접속 시)
    // ==========================================
    const ResetPasswordModal = ({ isOpen, onClose }) => {
      const [newPassword, setNewPassword] = React.useState('');
      const [confirmPassword, setConfirmPassword] = React.useState('');
      const [loading, setLoading] = React.useState(false);
      const [errorMsg, setErrorMsg] = React.useState('');
      const [successMsg, setSuccessMsg] = React.useState('');

      if (!isOpen) return null;

      const handleReset = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        setSuccessMsg('');

        if (newPassword.length < 6) {
          setErrorMsg('비밀번호는 최소 6자리 이상이어야 합니다.');
          return;
        }
        if (newPassword !== confirmPassword) {
          setErrorMsg('새 비밀번호가 서로 일치하지 않습니다.');
          return;
        }

        setLoading(true);
        const { error } = await api.auth.updatePassword(newPassword);
        setLoading(false);

        if (error) {
          setErrorMsg(error.message || '비밀번호 재설정에 실패했습니다.');
        } else {
          setSuccessMsg('비밀번호가 성공적으로 변경되었습니다!');
          setTimeout(() => {
            window.location.hash = ''; // 해시 제거
            onClose();
          }, 1500);
        }
      };

      return (
        <CustomModal isOpen={isOpen} title="새 비밀번호 설정" onClose={onClose}>
          <form onSubmit={handleReset} className="space-y-4">
            <p className="text-sm text-slate-400">
              새로운 비밀번호를 입력해 주세요. 변경 완료 후 새 비밀번호로 이용 가능합니다.
            </p>

            {errorMsg && (
              <div className="p-3 bg-red-500/10 border border-red-500/30 rounded-lg text-red-400 text-sm flex items-center gap-2">
                <Icon name="AlertCircle" size={16} /> {errorMsg}
              </div>
            )}
            {successMsg && (
              <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-lg text-emerald-400 text-sm flex items-center gap-2">
                <Icon name="CheckCircle" size={16} /> {successMsg}
              </div>
            )}

            <div>
              <label className="block text-xs font-medium text-slate-400 mb-1">새 비밀번호</label>
              <input
                type="password"
                required
                value={newPassword}
                onChange={(e) => setNewPassword(e.target.value)}
                placeholder="6자리 이상 입력"
                className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500"
              />
            </div>

            <div>
              <label className="block text-xs font-medium text-slate-400 mb-1">새 비밀번호 확인</label>
              <input
                type="password"
                required
                value={confirmPassword}
                onChange={(e) => setConfirmPassword(e.target.value)}
                placeholder="비밀번호 재입력"
                className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500"
              />
            </div>

            <div className="pt-2 flex justify-end gap-2">
              <button
                type="submit"
                disabled={loading}
                className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg transition disabled:opacity-50"
              >
                {loading ? '변경 중...' : '비밀번호 변경 완료'}
              </button>
            </div>
          </form>
        </CustomModal>
      );
    };

    // ==========================================
    // 4. 인증 화면 (로그인 / 회원가입)
    // ==========================================
    const AuthView = ({ onLoginSuccess }) => {
      const [isSignUp, setIsSignUp] = React.useState(false);
      const [isForgotPassword, setIsForgotPassword] = React.useState(false);
      const [email, setEmail] = React.useState('');
      const [password, setPassword] = React.useState('');
      const [privacyAgreed, setPrivacyAgreed] = React.useState(false);
      const [loading, setLoading] = React.useState(false);
      const [message, setMessage] = React.useState({ type: '', text: '' });

      const handleSubmit = async (e) => {
        e.preventDefault();
        setMessage({ type: '', text: '' });

        if (isForgotPassword) {
          if (!email) {
            setMessage({ type: 'error', text: '이메일을 입력해주세요.' });
            return;
          }
          setLoading(true);
          const { error } = await api.auth.resetPassword(email);
          setLoading(false);
          if (error) {
            setMessage({ type: 'error', text: error.message || '비밀번호 재설정 이메일 발송 실패' });
          } else {
            setMessage({ type: 'success', text: '비밀번호 재설정 메일이 발송되었습니다. 이메일을 확인해주세요.' });
          }
          return;
        }

        if (isSignUp) {
          if (!privacyAgreed) {
            setMessage({ type: 'error', text: '개인정보 처리 동의는 필수입니다.' });
            return;
          }
          setLoading(true);
          await delay(500);
          const { data, error } = await api.auth.signUp(email, password);
          setLoading(false);
          if (error) {
            setMessage({ type: 'error', text: error.message || '회원가입 중 오류가 발생했습니다.' });
          } else {
            setMessage({ type: 'success', text: '회원가입이 완료되었습니다! 로그인해 주세요.' });
            setIsSignUp(false);
          }
        } else {
          setLoading(true);
          await delay(500);
          const { data, error } = await api.auth.signIn(email, password);
          setLoading(false);
          if (error) {
            setMessage({ type: 'error', text: '로그인 정보가 올바르지 않습니다.' });
          } else if (data?.user) {
            onLoginSuccess(data.user);
          }
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-black">
          <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
            <div className="text-center mb-8">
              <div className="w-12 h-12 bg-indigo-600/20 text-indigo-400 rounded-xl flex items-center justify-center mx-auto mb-3 border border-indigo-500/30">
                <Icon name="Target" size={28} />
              </div>
              <h1 className="text-2xl font-bold text-white">목표 실행 대시보드</h1>
              <p className="text-sm text-slate-400 mt-1">체계적인 목표 수립과 일일 복기 서비스</p>
            </div>

            {message.text && (
              <div className={`p-4 rounded-xl text-sm mb-6 flex items-center gap-2 border ${
                message.type === 'error' ? 'bg-red-500/10 border-red-500/30 text-red-400' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'
              }`}>
                <Icon name={message.type === 'error' ? 'AlertCircle' : 'CheckCircle'} size={18} />
                <span>{message.text}</span>
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">이메일 계정</label>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="name@company.com"
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition"
                />
              </div>

              {!isForgotPassword && (
                <div>
                  <label className="block text-xs font-medium text-slate-400 mb-1">비밀번호</label>
                  <input
                    type="password"
                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition"
                  />
                </div>
              )}

              {isSignUp && (
                <div className="flex items-start gap-2 pt-1">
                  <input
                    type="checkbox"
                    id="privacy"
                    checked={privacyAgreed}
                    onChange={(e) => setPrivacyAgreed(e.target.checked)}
                    className="mt-1 rounded bg-slate-950 border-slate-800 text-indigo-600 focus:ring-0"
                  />
                  <label htmlFor="privacy" className="text-xs text-slate-400 leading-relaxed cursor-pointer">
                    [필수] 개인정보 수집 및 데이터 처리에 동의합니다.
                  </label>
                </div>
              )}

              <button
                type="submit"
                disabled={loading}
                className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition shadow-lg shadow-indigo-600/20 disabled:opacity-50 mt-2"
              >
                {loading ? '처리 중...' : isForgotPassword ? '비밀번호 재설정 메일 발송' : isSignUp ? '회원가입' : '로그인'}
              </button>
            </form>

            <div className="mt-6 flex items-center justify-between text-xs text-slate-400 pt-4 border-t border-slate-800/80">
              {isForgotPassword ? (
                <button onClick={() => setIsForgotPassword(false)} className="hover:text-white transition">
                  ← 로그인 화면으로 돌아가기
                </button>
              ) : (
                <>
                  <button onClick={() => { setIsSignUp(!isSignUp); setMessage({type:'', text:''}); }} className="hover:text-white transition">
                    {isSignUp ? '이미 계정이 있으신가요? 로그인' : '계정이 없으신가요? 회원가입'}
                  </button>
                  {!isSignUp && (
                    <button onClick={() => { setIsForgotPassword(true); setMessage({type:'', text:''}); }} className="hover:text-slate-200 transition">
                      비밀번호 찾기
                    </button>
                  )}
                </>
              )}
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 5. 목표 카드 & 모달 (드래그 앤 드롭 포함)
    // ==========================================
    const GoalFormModal = ({ isOpen, onClose, onSave, goal }) => {
      const [title, setTitle] = React.useState('');
      const [category, setCategory] = React.useState('커리어');
      const [deadline, setDeadline] = React.useState('');
      const [milestones, setMilestones] = React.useState([]);
      const [draggedIndex, setDraggedIndex] = React.useState(null);

      React.useEffect(() => {
        if (goal) {
          setTitle(goal.title || '');
          setCategory(goal.category || '커리어');
          setDeadline(goal.deadline || '');
          setMilestones(goal.milestones || []);
        } else {
          setTitle('');
          setCategory('커리어');
          setDeadline('');
          setMilestones([]);
        }
      }, [goal, isOpen]);

      if (!isOpen) return null;

      const handleAddMilestone = () => {
        setMilestones([...milestones, { id: crypto.randomUUID(), title: '', deadline: '', completed: false }]);
      };

      const handleUpdateMilestone = (id, field, value) => {
        setMilestones(milestones.map(m => m.id === id ? { ...m, [field]: value } : m));
      };

      const handleRemoveMilestone = (id) => {
        setMilestones(milestones.filter(m => m.id !== id));
      };

      const handleDragStart = (e, index) => {
        setDraggedIndex(index);
        e.dataTransfer.effectAllowed = "move";
      };

      const handleDragOver = (e, index) => {
        e.preventDefault();
        if (draggedIndex === null || draggedIndex === index) return;
        const updated = [...milestones];
        const item = updated.splice(draggedIndex, 1)[0];
        if (!item) return;
        updated.splice(index, 0, item);
        setDraggedIndex(index);
        setMilestones(updated);
      };

      const handleDragEnd = () => {
        setDraggedIndex(null);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const validMilestones = (milestones || []).filter(m => m && m.id && m.title.trim() !== '');
        onSave({ id: goal?.id, title, category, deadline, milestones: validMilestones });
        onClose();
      };

      return (
        <CustomModal isOpen={isOpen} title={goal ? "목표 및 중간 단계 수정" : "새 목표 수립"} onClose={onClose}>
          <form onSubmit={handleSubmit} className="space-y-4">
            <div>
              <label className="block text-xs font-medium text-slate-400 mb-1">목표명</label>
              <input
                type="text"
                required
                value={title}
                onChange={(e) => setTitle(e.target.value)}
                placeholder="예: 사이드 프로젝트 출시하기"
                className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500"
              />
            </div>

            <div className="grid grid-cols-2 gap-4">
              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">카테고리</label>
                <select
                  value={category}
                  onChange={(e) => setCategory(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500"
                >
                  <option value="커리어">커리어</option>
                  <option value="자기계발">자기계발</option>
                  <option value="건강">건강</option>
                  <option value="자산">자산</option>
                  <option value="기타">기타</option>
                </select>
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">목표 기한</label>
                <input
                  type="date"
                  required
                  value={deadline}
                  onChange={(e) => setDeadline(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500"
                />
              </div>
            </div>

            <div className="pt-4 border-t border-slate-800">
              <div className="flex justify-between items-center mb-3">
                <label className="text-sm font-semibold text-white">중간 단계 (순서 변경 가능)</label>
                <button
                  type="button"
                  onClick={handleAddMilestone}
                  className="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 bg-indigo-500/10 px-2.5 py-1 rounded-lg border border-indigo-500/20"
                >
                  <Icon name="Plus" size={14} /> 중간 단계 추가
                </button>
              </div>

              <div className="space-y-2 max-h-60 overflow-y-auto pr-1 custom-scrollbar">
                {milestones.length === 0 ? (
                  <p className="text-xs text-slate-500 text-center py-4">등록된 중간 단계가 없습니다.</p>
                ) : (
                  milestones.map((m, idx) => m && m.id ? (
                    <div
                      key={m.id}
                      draggable
                      onDragStart={(e) => handleDragStart(e, idx)}
                      onDragOver={(e) => handleDragOver(e, idx)}
                      onDragEnd={handleDragEnd}
                      className={`flex items-center gap-2 bg-slate-950 p-2 rounded-xl border ${
                        draggedIndex === idx ? 'border-indigo-500 bg-slate-800/50' : 'border-slate-800'
                      }`}
                    >
                      <div className="cursor-grab text-slate-500 hover:text-slate-300 p-1">
                        <Icon name="GripVertical" size={16} />
                      </div>
                      <input
                        type="text"
                        placeholder="세부 행동 단계"
                        value={m.title}
                        onChange={(e) => handleUpdateMilestone(m.id, 'title', e.target.value)}
                        className="flex-1 bg-transparent text-xs text-white focus:outline-none"
                      />
                      <input
                        type="date"
                        value={m.deadline}
                        onChange={(e) => handleUpdateMilestone(m.id, 'deadline', e.target.value)}
                        className="bg-slate-900 border border-slate-800 text-xs text-slate-300 rounded px-2 py-1"
                      />
                      <button
                        type="button"
                        onClick={() => handleRemoveMilestone(m.id)}
                        className="text-slate-500 hover:text-red-400 p-1"
                      >
                        <Icon name="Trash2" size={16} />
                      </button>
                    </div>
                  ) : null)
                )}
              </div>
            </div>

            <div className="pt-4 flex justify-end gap-2 border-t border-slate-800">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2 text-xs font-medium text-slate-400 hover:text-white bg-slate-800 rounded-lg"
              >
                취소
              </button>
              <button
                type="submit"
                className="px-4 py-2 text-xs font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg"
              >
                저장하기
              </button>
            </div>
          </form>
        </CustomModal>
      );
    };

    // ==========================================
    // 6. 뷰 1: 목표 페이지
    // ==========================================
    const GoalsView = ({ goals, onSaveGoal }) => {
      const [selectedGoal, setSelectedGoal] = React.useState(null);
      const [isModalOpen, setIsModalOpen] = React.useState(false);

      const calculateDDay = (deadline) => {
        if (!deadline) return '';
        const today = new Date();
        today.setHours(0,0,0,0);
        const target = new Date(deadline);
        target.setHours(0,0,0,0);
        const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
        if (diff === 0) return 'D-Day';
        return diff > 0 ? `D-${diff}` : `D+${Math.abs(diff)}`;
      };

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center">
            <div>
              <h2 className="text-xl font-bold text-white">목표 현황</h2>
              <p className="text-xs text-slate-400">명확한 목표와 중간 단계를 수립해 성과를 창출하세요.</p>
            </div>
            <button
              onClick={() => { setSelectedGoal(null); setIsModalOpen(true); }}
              className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium rounded-xl flex items-center gap-1.5 shadow-lg shadow-indigo-600/20"
            >
              <Icon name="Plus" size={16} /> 목표 추가
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {goals.length === 0 ? (
              <div className="col-span-full py-12 text-center bg-slate-900/50 border border-slate-800/80 rounded-2xl">
                <Icon name="Target" size={40} className="text-slate-600 mb-2" />
                <p className="text-sm text-slate-400">등록된 목표가 없습니다. 새로운 목표를 세워보세요!</p>
              </div>
            ) : (
              goals.map(goal => {
                const dDay = calculateDDay(goal.deadline);
                const isOverdue = dDay.startsWith('D+');
                const milestones = goal.milestones || [];
                const completedCount = milestones.filter(m => m.completed).length;

                return (
                  <div
                    key={goal.id}
                    onClick={() => { setSelectedGoal(goal); setIsModalOpen(true); }}
                    className="bg-slate-900 border border-slate-800 hover:border-slate-700 p-5 rounded-2xl cursor-pointer transition group relative flex flex-col justify-between"
                  >
                    <div>
                      <div className="flex justify-between items-start mb-3">
                        <span className="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-slate-800 text-indigo-400 border border-indigo-500/20">
                          {goal.category}
                        </span>
                        <span className={`text-xs font-bold px-2 py-0.5 rounded-md ${
                          isOverdue ? 'bg-red-500/10 text-red-400 border border-red-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'
                        }`}>
                          {dDay}
                        </span>
                      </div>
                      <h3 className="font-bold text-white text-base group-hover:text-indigo-400 transition mb-2">
                        {goal.title}
                      </h3>
                    </div>

                    <div className="pt-4 border-t border-slate-800/80 mt-4 flex items-center justify-between text-xs text-slate-400">
                      <span>중간 단계: {completedCount}/{milestones.length}</span>
                      <span className="text-slate-500">{goal.deadline} 까지</span>
                    </div>
                  </div>
                );
              })
            )}
          </div>

          <GoalFormModal
            isOpen={isModalOpen}
            onClose={() => setIsModalOpen(false)}
            onSave={onSaveGoal}
            goal={selectedGoal}
          />
        </div>
      );
    };

    // ==========================================
    // 7. 뷰 2: 실행 페이지 (대화형 대시보드)
    // ==========================================
    const ExecutionView = ({ goals, onSavePlan }) => {
      const [mode, setMode] = React.useState('wizard'); // wizard | simple

          {mode === 'wizard' ? (

                  >

                  {activeGoal && (

              {step === 2 && (

                  <span className="text-xs font-bold text-indigo-400">Q2. 구체적 행동</span>
                  <h3 className="text-lg font-bold text-white">선택한 목표를 위해 구체적으로 뭘 하실 건가요?</h3>
                  <textarea
                    rows="3"
                    value={actionText}
                    onChange={(e) => setActionText(e.target.value)}
                    placeholder="예: 공식 문서 읽고 예제 실습 2개 진행"

                  <div className="flex gap-2">

                  <div className="flex gap-2">

                      <input

                    <p><span className="text-slate-400">실행 행동:</span> <strong className="text-white">{actionText}</strong></p>
                    <p><span className="text-slate-400">수행 시점 및 시간:</span> <strong className="text-white">{timeText} ({formatTime(durationPlanned)})</strong></p>

                <select
                  value={selectedGoalId}
                  onChange={(e) => setSelectedGoalId(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm mb-2"
                >
                  <option value="">-- 목표 선택 --</option>

                />

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-medium text-slate-400 mb-1">수행 시점</label>
                  <input

                    value={timeText}
                    onChange={(e) => setTimeText(e.target.value)}

              >
                일지에 바로 저장하기

    };

    // ==========================================

                      <div>

                          <span className="text-[10px] bg-slate-800 text-slate-300 border border-slate-700 px-2 py-0.5 rounded">

                          <span className="text-xs text-indigo-400 font-semibold">

                        <label className="text-slate-400 block mb-1">실제 투입 시간(분)</label>
                        <input
                          type="number"
                          value={plan.durationActual || ''}
                          onChange={(e) => onUpdatePlan({ ...plan, durationActual: parseInt(e.target.value, 10) || 0 })}
                          placeholder="분 단위 입력"
                          className="w-full bg-slate-900 border border-slate-800 rounded px-2 py-1 text-white"
                        />
                      </div>
                      <div>
                        <label className="text-slate-400 block mb-1">달성 여부</label>
                        <button
                          onClick={() => onUpdatePlan({ ...plan, status: isCompleted ? 'planned' : 'completed' })}
                          className={`w-full py-1 rounded font-semibold text-xs border ${
                            isCompleted ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' : 'bg-slate-800 border-slate-700 text-slate-400'
                          }`}
                        >
                          {isCompleted ? '✓ 완료' : '미달성'}
                        </button>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-medium text-slate-400 mb-1">결과물 메모 및 복기</label>
                      <textarea
                        rows="2"
                        value={plan.notes || ''}
                        onChange={(e) => onUpdatePlan({ ...plan, notes: e.target.value })}
                        placeholder="오늘의 성과나 피드백을 자유롭게 기록하세요."
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white"
                      />
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    };

    // ==========================================
    // 9. 뷰 4: 통계 리포트
    // ==========================================
    const StatsView = ({ plans, goals }) => {
      const [filter, setFilter] = React.useState('weekly');

      const completedPlans = plans.filter(p => p.status === 'completed');
      const totalPlannedTime = plans.reduce((acc, p) => acc + (parseInt(p.durationPlanned, 10) || 0), 0);
      const totalActualTime = completedPlans.reduce((acc, p) => acc + (parseInt(p.durationActual, 10) || 0), 0);
      const completionRate = plans.length > 0 ? Math.round((completedPlans.length / plans.length) * 100) : 0;

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center">
            <div>
              <h2 className="text-xl font-bold text-white">통계 리포트</h2>
              <p className="text-xs text-slate-400">목표 달성 추이와 실제 투입 시간을 모니터링합니다.</p>
            </div>
            <div className="flex bg-slate-900 border border-slate-800 rounded-xl p-1 text-xs">
              {['weekly', 'monthly', 'yearly'].map(type => (
                <button
                  key={type}
                  onClick={() => setFilter(type)}
                  className={`px-3 py-1.5 rounded-lg capitalize ${filter === type ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
                >
                  {type === 'weekly' ? '주간' : type === 'monthly' ? '월간' : '연간'}
                </button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
              <span className="text-xs text-slate-400 block mb-1">종합 달성률</span>
              <span className="text-3xl font-black text-indigo-400">{completionRate}%</span>
              <p className="text-[10px] text-slate-500 mt-2">총 {plans.length}개 계획 중 {completedPlans.length}개 완료</p>
            </div>
            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
              <span className="text-xs text-slate-400 block mb-1">계획된 목표 시간</span>
              <span className="text-3xl font-black text-white">{formatTime(totalPlannedTime)}</span>
            </div>
            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
              <span className="text-xs text-slate-400 block mb-1">실제 순수 투입 시간</span>
              <span className="text-3xl font-black text-emerald-400">{formatTime(totalActualTime)}</span>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 10. 뷰 5: 관리자 전용 대시보드
    // ==========================================
    const AdminView = () => {
      const [adminData, setAdminData] = React.useState({ users: [], goals: [], plans: [] });

      React.useEffect(() => {
        api.data.getAllAdminData().then(setAdminData);
      }, []);

      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-xl font-bold text-white">관리자 전용 대시보드</h2>
            <p className="text-xs text-slate-400">전체 유저 현황 및 서비스 통합 지표를 조회합니다.</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
              <span className="text-xs text-slate-400 block">전체 가입 유저 수</span>
              <span className="text-2xl font-bold text-white mt-1">{adminData.users.length} 명</span>
            </div>
            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
              <span className="text-xs text-slate-400 block">총 등록된 목표 수</span>
              <span className="text-2xl font-bold text-indigo-400 mt-1">{adminData.goals.length} 개</span>
            </div>
            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
              <span className="text-xs text-slate-400 block">전체 실행 계획 수</span>
              <span className="text-2xl font-bold text-emerald-400 mt-1">{adminData.plans.length} 건</span>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 11. 메인 App 컴포넌트
    // ==========================================
    const App = () => {
      const [user, setUser] = React.useState(null);
      const [currentTab, setCurrentTab] = React.useState('goals');
      const [goals, setGoals] = React.useState([]);
      const [plans, setPlans] = React.useState([]);
      
      // 모달 상태 관리
      const [isResetModalOpen, setIsResetModalOpen] = React.useState(false);
      const [logoutConfirm, setLogoutConfirm] = React.useState(false);

      // 비밀번호 재설정 토큰 감지 (URL 해시 파싱)
      React.useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash;
          if (hash && (hash.includes('type=recovery') || hash.includes('access_token='))) {
            setIsResetModalOpen(true);
          }
        };

        handleHashChange(); // 초기 마운트 시 확인
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      // 초기 인증 및 데이터 로드
      React.useEffect(() => {
        api.auth.getUser().then(u => {
          if (u) {
            setUser(u);
            loadUserData(u.id);
          }
        });
      }, []);

      const loadUserData = async (userId) => {
        const userGoals = await api.data.getGoals(userId);
        const userPlans = await api.data.getPlans(userId);
        setGoals(userGoals);
        setPlans(userPlans);
      };

      const handleSaveGoal = async (goal) => {
        const saved = await api.data.saveGoal(user.id, goal);
        setGoals(prev => {
          const idx = prev.findIndex(g => g.id === saved.id);
          if (idx >= 0) {
            const updated = [...prev];
            updated[idx] = saved;
            return updated;
          }
          return [...prev, saved];
        });
      };

      const handleSavePlan = async (plan) => {
        const saved = await api.data.savePlan(user.id, plan);
        setPlans(prev => [saved, ...prev]);
      };

      const handleUpdatePlan = async (plan) => {
        const saved = await api.data.savePlan(user.id, plan);
        setPlans(prev => prev.map(p => p.id === saved.id ? saved : p));
      };

      const handleDeletePlan = async (planId) => {
        await api.data.deletePlan(planId);
        setPlans(prev => prev.filter(p => p.id !== planId));
      };

      const executeLogout = async () => {
        await api.auth.signOut();
        setUser(null);
      };

      // 로그인하지 않은 상태일 때 Auth 화면 표시
      if (!user) {
        return (
          <>
            <AuthView onLoginSuccess={(u) => { setUser(u); loadUserData(u.id); }} />
            {/* 로그인 전에도 URL 타고 들어왔으면 리셋 모달이 보여야 함 */}
            <ResetPasswordModal isOpen={isResetModalOpen} onClose={() => setIsResetModalOpen(false)} />
          </>
        );
      }

      const isAdmin = user.user_metadata?.role === 'admin' || user.email === 'admin@test.com';

      return (
        <div className="min-h-screen flex flex-col bg-black text-slate-100">
          <ConfirmModal 
            isOpen={logoutConfirm} 
            message="로그아웃 하시겠습니까?" 
            onConfirm={executeLogout} 
            onClose={() => setLogoutConfirm(false)} 
          />

          {/* 상단 탭 네비게이션 */}
          <header className="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
            <div className="max-w-5xl mx-auto px-4 flex items-center justify-between h-16">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-black">
                  G
                </div>
                <span className="font-bold text-white text-sm hidden sm:inline">GOAL DASHBOARD</span>
              </div>

              {/* 탭 메뉴 */}
              <nav className="flex space-x-1 sm:space-x-2">
                {[
                  { id: 'goals', label: '목표', icon: 'Target' },
                  { id: 'execution', label: '실행', icon: 'Zap' },
                  { id: 'journal', label: '일일 일지', icon: 'BookOpen' },
                  { id: 'stats', label: '통계', icon: 'BarChart2' },
                  ...(isAdmin ? [{ id: 'admin', label: '관리자', icon: 'Shield' }] : [])
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setCurrentTab(tab.id)}
                    className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold transition ${
                      currentTab === tab.id ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/20' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                    }`}
                  >
                    <Icon name={tab.icon} size={15} />
                    <span>{tab.label}</span>
                  </button>
                ))}
              </nav>

              <button
                onClick={() => setLogoutConfirm(true)}
                className="text-slate-500 hover:text-slate-300 p-2 rounded-lg transition"
                title="로그아웃"
              >
                <Icon name="LogOut" size={18} />
              </button>
            </div>
          </header>

          {/* 메인 컨텐츠 영역 */}
          <main className="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6">
            {currentTab === 'goals' && <GoalsView goals={goals} onSaveGoal={handleSaveGoal} />}
            {currentTab === 'execution' && <ExecutionView goals={goals} onSavePlan={handleSavePlan} />}
            {currentTab === 'journal' && <JournalView plans={plans} goals={goals} onUpdatePlan={handleUpdatePlan} onDeletePlan={handleDeletePlan} />}
            {currentTab === 'stats' && <StatsView plans={plans} goals={goals} />}
            {currentTab === 'admin' && isAdmin && <AdminView />}
          </main>

          {/* 로그인 상태에서도 리셋 모달 노출 가능하게 유지 */}
          <ResetPasswordModal isOpen={isResetModalOpen} onClose={() => setIsResetModalOpen(false)} />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
