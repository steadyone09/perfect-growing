  <script type="text/babel">
    const SUPABASE_URL = "https://tuvzubjiucnlvtdagqqe.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_WG9ZK-Xugns3X_fsksQ2jw_9XV7UQCD";

    let supabase;
    try {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {

    window.customAlert = (msg) => {
      const container = document.getElementById('toast-container') || (() => {
        const c = document.createElement('div');
        c.id = 'toast-container';
        c.className = 'fixed top-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 w-[90%] max-w-sm';
        document.body.appendChild(c);
        return c;
      })();
      const toast = document.createElement('div');
      toast.className = 'bg-slate-900 border border-slate-800 text-white px-5 py-4 rounded-xl shadow-2xl flex items-start gap-3 text-sm animate-fadeIn break-all';
      toast.innerHTML = `<svg class="shrink-0 mt-0.5 text-blue-500" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> <div>${msg}</div>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);

    const getKSTDate = (date = new Date()) => {
      const utc = date.getTime() + (date.getTimezoneOffset() * 60000);
      return new Date(utc + (9 * 3600000));
    };
    
    const getKSTYYYYMMDD = (date) => {
      const d = getKSTDate(date);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const getDDay = (dateStr) => {
      if (!dateStr) return null;
      const target = getKSTDate(new Date(dateStr));
      const today = getKSTDate();
      target.setHours(0,0,0,0);
      today.setHours(0,0,0,0);
      const diffDays = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
      
      if (diffDays === 0) return { text: 'D-Day', color: 'text-orange-600 bg-orange-50 border-orange-200' };
      if (diffDays > 0) return { text: `D-${diffDays}`, color: 'text-blue-600 bg-blue-50 border-blue-200' };
      return { text: `D+${Math.abs(diffDays)}`, color: 'text-red-600 bg-red-50 border-red-200' };
    };

    const formatTimeMins = (mins) => {
        if (!mins || isNaN(mins)) return '0분';
        const num = Number(mins);
        const h = Math.floor(num / 60);
        const m = num % 60;
        return h > 0 ? `${h}시간 ${m}분` : `${m}분`;
    };

    const Icon = ({ name, size = 20, className = "" }) => {
      const spanRef = React.useRef(null);
      React.useEffect(() => {
        if (spanRef.current && window.lucide && window.lucide.icons[name]) {
          spanRef.current.innerHTML = '';
          const svg = window.lucide.createElement(window.lucide.icons[name]);
          svg.setAttribute('width', size); svg.setAttribute('height', size); svg.setAttribute('stroke-width', '2');
          if (className) svg.setAttribute('class', className);
          spanRef.current.appendChild(svg);
        }
      }, [name, size, className]);
      return <span ref={spanRef} className={`inline-flex items-center justify-center ${className}`} />;
    };

    const BlurInput = ({ value, onChange, ...props }) => {
      const [localVal, setLocalVal] = React.useState(value || '');
      React.useEffect(() => { setLocalVal(value || ''); }, [value]);
      return <input value={localVal} onChange={(e) => setLocalVal(e.target.value)} onBlur={() => onChange(localVal)} onKeyDown={(e) => { if(e.key==='Enter') e.target.blur(); }} {...props} />;
    };

    const BlurTextarea = ({ value, onChange, ...props }) => {
      const [localVal, setLocalVal] = React.useState(value || '');
      React.useEffect(() => { setLocalVal(value || ''); }, [value]);
      return <textarea value={localVal} onChange={(e) => setLocalVal(e.target.value)} onBlur={() => onChange(localVal)} {...props} />;
    };

    const api = {
      auth: {
        signIn: async (email, password) => await supabase.auth.signInWithPassword({ email, password }),
        signOut: async () => await supabase.auth.signOut(),
      },
      data: {
        getGoals: async (uid) => {
          const { data, error } = await supabase.from('goals').select('*').eq('userId', uid).order('created_at', { ascending: true });
          if (error) { window.customAlert(`목표 조회 에러: ${error.message}`); throw error; }
          return data || [];
        },
        saveGoal: async (goalData, uid) => {
          const payload = { ...goalData, userId: uid };
          const { data, error } = payload.id 
            ? await supabase.from('goals').update(payload).eq('id', payload.id).eq('userId', uid).select()
            : await supabase.from('goals').insert(payload).select();
          if (error) { window.customAlert(`목표 저장 에러: ${error.message}`); throw error; }
          return data[0];
        },
        deleteGoal: async (id, uid) => {
          const { error } = await supabase.from('goals').delete().eq('id', id).eq('userId', uid);
          if (error) { window.customAlert(`목표 삭제 에러: ${error.message}`); throw error; }
        },
        
        getMilestones: async (uid) => {
          const { data, error } = await supabase.from('goal_milestones').select('*').eq('userId', uid).order('created_at', { ascending: true });
          if (error) { window.customAlert(`중간 목표 조회 에러: ${error.message}`); throw error; }

        saveMilestone: async (msData, uid) => {

            ? await supabase.from('goal_milestones').update(payload).eq('id', payload.id).eq('userId', uid).select()
            : await supabase.from('goal_milestones').insert(payload).select();
          if (error) { window.customAlert(`중간 목표 저장 에러: ${error.message}`); throw error; }
          return data[0];
        },
        deleteMilestone: async (id, uid) => {
          const { error } = await supabase.from('goal_milestones').delete().eq('id', id).eq('userId', uid);
          if (error) { window.customAlert(`중간 목표 삭제 에러: ${error.message}`); throw error; }
        },

        getPlans: async (uid) => {
          const { data, error } = await supabase.from('plans').select('*').eq('userId', uid).order('created_at', { ascending: false });
          if (error) { window.customAlert(`계획 조회 에러: ${error.message}`); throw error; }
          return data || [];
        },
        savePlan: async (planData, uid) => {
          const { timeMemo, ...cleanData } = planData; 
          const payload = { ...cleanData, userId: uid };
          const { data, error } = payload.id 
            ? await supabase.from('plans').update(payload).eq('id', payload.id).eq('userId', uid).select()
            : await supabase.from('plans').insert(payload).select();
          if (error) { window.customAlert(`계획 저장 에러: ${error.message}`); throw error; }
          return data[0];
        },
        deletePlan: async (id, uid) => {
          const { error } = await supabase.from('plans').delete().eq('id', id).eq('userId', uid);
          if (error) { window.customAlert(`계획 삭제 에러: ${error.message}`); throw error; }
        },

        getHabits: async (uid) => {
          const { data, error } = await supabase.from('habits').select('*').eq('user_id', uid).order('created_at', { ascending: true });
          if (error) { window.customAlert(`습관 조회 에러: ${error.message}`); throw error; }

        saveHabit: async (habitData, uid) => {
          const payload = {

          const { data, error } = habitData.id 
            ? await supabase.from('habits').update(payload).eq('id', habitData.id).eq('user_id', uid).select()
            : await supabase.from('habits').insert(payload).select();
          if (error) { window.customAlert(`습관 저장 에러: ${error.message}`); throw error; }

        },
        deleteHabit: async (id, uid) => {
          const { error } = await supabase.from('habits').delete().eq('id', id).eq('user_id', uid);
          if (error) { window.customAlert(`습관 삭제 에러: ${error.message}`); throw error; }

          if (error) { window.customAlert(`습관 기록 조회 에러: ${error.message}`); throw error; }

    };

    const CustomModal = ({ isOpen, title, children, onClose }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-fadeIn">

            <div className="flex justify-between items-center px-6 py-4 border-b border-slate-100 bg-slate-50 shrink-0">

            </div>
            <div className="p-6 overflow-y-auto custom-scrollbar">{children}</div>
          </div>
        </div>
      );
    };

    const ConfirmModal = ({ isOpen, title, message, onConfirm, onClose }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-fadeIn">
          <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-slate-200 text-center">
            <div className="w-14 h-14 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="AlertTriangle" size={28} /></div>
            <h3 className="text-lg font-bold text-slate-900 mb-2">{title}</h3>
            <p className="text-sm text-slate-500 mb-6">{message}</p>
            <div className="flex gap-3">
              <button onClick={onClose} className="flex-1 py-3 bg-slate-100 text-slate-700 font-semibold rounded-xl hover:bg-slate-200 transition">취소</button>
              <button onClick={() => { onConfirm(); onClose(); }} className="flex-1 py-3 bg-red-500 text-white font-semibold rounded-xl hover:bg-red-600 transition shadow-sm">삭제</button>
            </div>
          </div>
        </div>
      );
    };

    const generateGoogleCalendarLink = (title, details, startTimeText) => {
      const baseUrl = 'https://calendar.google.com/calendar/render?action=TEMPLATE';
      const text = encodeURIComponent(title);
      const detailsParam = encodeURIComponent(details || '');
      let datesParam = '';
      if (startTimeText) {
        const today = getKSTDate();
        let [hours, minutes] = startTimeText.split(':').map(Number);
        if (isNaN(hours) || isNaN(minutes)) { hours = 12; minutes = 0; }
        today.setHours(hours, minutes, 0, 0);
        const endDate = new Date(today.getTime() + 30 * 60000); 
        const formatToUTC = (d) => d.toISOString().replace(/-|:|\.\d\d\d/g, '');
        datesParam = `&dates=${formatToUTC(today)}/${formatToUTC(endDate)}`;
      }
      return `${baseUrl}&text=${text}${datesParam}&details=${detailsParam}`;
    };

    const handleAppleCalendarSync = (title, details, startTimeText) => {
      let startDate = getKSTDate();
      let [hours, minutes] = startTimeText ? startTimeText.split(':').map(Number) : [12, 0];
      if (isNaN(hours) || isNaN(minutes)) { hours = 12; minutes = 0; }
      startDate.setHours(hours, minutes, 0, 0);
      const endDate = new Date(startDate.getTime() + 30 * 60000);

      const formatDate = (date) => date.toISOString().replace(/-|:|\.\d\d\d/g, '');
      const icsData = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//My App//EN',
        'BEGIN:VEVENT',
        `DTSTART:${formatDate(startDate)}`,
        `DTEND:${formatDate(endDate)}`,
        `SUMMARY:${title.replace(/,/g, '\\,').replace(/;/g, '\\;')}`,
        `DESCRIPTION:${(details || '').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;')}`,
        'END:VEVENT', 'END:VCALENDAR'
      ].join('\r\n');

      const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.target = '_blank';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 100);
    };

    const AuthView = ({ onLoginSuccess }) => {
      const [email, setEmail] = React.useState('');
      const [password, setPassword] = React.useState('');
      const [loading, setLoading] = React.useState(false);
      
      const handleSubmit = async (e) => {
        e.preventDefault(); setLoading(true);
        try {
            const { data, error } = await api.auth.signIn(email, password);
            if (error) window.customAlert('로그인 실패: ' + error.message);
            else if (data?.user) onLoginSuccess(data.user);
        } catch(e) {
            window.customAlert('오류 발생');
        } finally {
            setLoading(false);
        }
      };
      
      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-slate-50">
          <div className="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-8 shadow-sm">
            <div className="text-center mb-8">
              <div className="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-md">
                <Icon name="Target" size={36} />
              </div>
              <h1 className="text-2xl font-black text-slate-900 tracking-tight">Target Engine</h1>
              <p className="text-sm text-slate-500 mt-2">최강의 목표 달성 시스템</p>
            </div>
            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1.5 ml-1">이메일</label>
                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition shadow-sm" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1.5 ml-1">비밀번호</label>
                <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition shadow-sm" />
              </div>
              <button type="submit" disabled={loading} className="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md mt-4 disabled:opacity-50 transition">
                {loading ? '인증 중...' : '시작하기'}
              </button>
            </form>
          </div>
        </div>
      );
    };

    const GoalsView = ({ goals, milestones, onUpdateGoal, onDeleteGoal, onUpdateMilestone, onDeleteMilestone, user }) => {
      const [title, setTitle] = React.useState('');
      const [goalTargetDate, setGoalTargetDate] = React.useState('');
      const [saving, setSaving] = React.useState(false);
      const [confirmObj, setConfirmObj] = React.useState({ isOpen: false, id: null, type: null });

      const [msInputs, setMsInputs] = React.useState({});
      const [msDates, setMsDates] = React.useState({});

      const handleAddGoal = async (e) => {
        e.preventDefault(); if (!title.trim() || saving) return;
        setSaving(true);
        try {
          const newGoal = await api.data.saveGoal({ title, target_date: goalTargetDate || null, is_completed: false }, user.id);
          onUpdateGoal(newGoal); setTitle(''); setGoalTargetDate('');
        } catch (e) {} finally { setSaving(false); }
      };

      const toggleGoalComplete = async (goal) => {
        try {
          const updated = await api.data.saveGoal({ id: goal.id, is_completed: !goal.is_completed }, user.id);
          onUpdateGoal(updated);
        } catch (e) {}
      };

      const handleAddMilestone = async (e, goalId) => {
        e.preventDefault();
        const msTitle = msInputs[goalId];
        const msDate = msDates[goalId];
        if (!msTitle?.trim()) return;
        try {
          const newMs = await api.data.saveMilestone({ title: msTitle, target_date: msDate || null, goal_id: goalId, is_completed: false }, user.id);
          onUpdateMilestone(newMs);
          setMsInputs(prev => ({ ...prev, [goalId]: '' }));
          setMsDates(prev => ({ ...prev, [goalId]: '' }));
        } catch (e) {}
      };

      const toggleMilestoneComplete = async (ms) => {
        try {
          const updated = await api.data.saveMilestone({ id: ms.id, is_completed: !ms.is_completed }, user.id);
          onUpdateMilestone(updated);
        } catch (e) {}
      };

      const doDelete = async () => {
        try {
          if (confirmObj.type === 'goal') {
            await api.data.deleteGoal(confirmObj.id, user.id); onDeleteGoal(confirmObj.id);
          } else {
            await api.data.deleteMilestone(confirmObj.id, user.id); onDeleteMilestone(confirmObj.id);
          }
        } catch (e) {}
      };

      return (
        <div className="space-y-6">
          <form onSubmit={handleAddGoal} className="flex flex-col sm:flex-row gap-2">
            <input type="text" value={title} onChange={e => setTitle(e.target.value)} placeholder="새로운 목표를 입력하세요" className="flex-1 bg-white border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 shadow-sm transition text-slate-800 font-medium" />
            <div className="flex gap-2">
              <input type="date" value={goalTargetDate} onChange={e => setGoalTargetDate(e.target.value)} className="bg-white border border-slate-200 rounded-xl px-3 py-3 focus:outline-none focus:border-blue-500 shadow-sm text-sm text-slate-600 transition" />
              <button type="submit" disabled={saving} className="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-sm disabled:opacity-50 transition whitespace-nowrap">추가</button>
            </div>
          </form>
          
          <div className="grid gap-4">
            {goals.map(goal => {
              const goalMs = milestones.filter(m => m.goal_id === goal.id);
              return (
                <div key={goal.id} className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                  <div className={`flex items-start sm:items-center gap-3 p-5 border-b border-slate-100 transition ${goal.is_completed ? 'bg-slate-50 opacity-70' : 'bg-white'}`}>
                    <button onClick={() => toggleGoalComplete(goal)} className={`shrink-0 mt-0.5 sm:mt-0 w-6 h-6 rounded-full border-2 flex items-center justify-center transition ${goal.is_completed ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-300 hover:border-blue-400'}`}>
                      {goal.is_completed && <Icon name="Check" size={14} />}
                    </button>
                    <div className="flex-1">
                      <div className={`font-black text-lg tracking-tight ${goal.is_completed ? 'line-through text-slate-400' : 'text-slate-800'}`}>{goal.title}</div>
                      {goal.target_date && (() => {
                          const dday = getDDay(goal.target_date);
                          return (
                            <div className="flex flex-wrap items-center gap-2 mt-1.5">
                                <span className="text-xs text-slate-500 font-semibold flex items-center gap-1"><Icon name="Calendar" size={12}/> 기한: {goal.target_date}</span>
                                <span className={`text-[10px] font-black px-2 py-0.5 rounded border ${dday.color}`}>{dday.text}</span>
                            </div>
                          );
                      })()}
                    </div>
                    <button onClick={() => setConfirmObj({ isOpen: true, id: goal.id, type: 'goal' })} className="text-slate-300 hover:text-red-500 p-2 rounded-lg transition"><Icon name="Trash2" size={18} /></button>
                  </div>
                  
                  <div className={`p-4 sm:p-5 space-y-2 ${goal.is_completed ? 'opacity-50 pointer-events-none' : ''}`}>
                    {goalMs.map(ms => {
                        const msDDay = getDDay(ms.target_date);
                        return (
                          <div key={ms.id} className={`flex items-center gap-3 p-3 bg-slate-50 border border-slate-200 rounded-xl transition ${ms.is_completed ? 'opacity-60' : ''}`}>
                            <button onClick={() => toggleMilestoneComplete(ms)} className={`shrink-0 w-5 h-5 rounded border-2 flex items-center justify-center transition ${ms.is_completed ? 'bg-blue-500 border-blue-500 text-white' : 'border-slate-300 hover:border-blue-400'}`}>
                              {ms.is_completed && <Icon name="Check" size={12} />}
                            </button>
                            <div className="flex-1 flex flex-col justify-center">
                              <span className={`text-sm font-bold ${ms.is_completed ? 'line-through text-slate-400' : 'text-slate-700'}`}>{ms.title}</span>
                              {ms.target_date && (
                                <div className="flex items-center gap-1.5 mt-0.5">
                                    <span className="text-[10px] text-slate-400 font-semibold flex items-center"><Icon name="Calendar" size={10} className="mr-0.5"/>{ms.target_date}</span>
                                    {msDDay && <span className={`text-[9px] font-black px-1.5 py-0 rounded ${msDDay.color.replace('border', 'border-0')}`}>{msDDay.text}</span>}
                                </div>

    const HabitsView = ({ habits, habitLogs, onUpdate, onDelete, setHabitLogs, user }) => {
      const todayNum = getKSTDate().getDay(); 
      const [selectedDay, setSelectedDay] = React.useState(todayNum === 0 ? 6 : todayNum - 1); 
      const [isModalOpen, setIsModalOpen] = React.useState(false);
      const [editHabit, setEditHabit] = React.useState(null);

      const openModal = (habit = null) => { setEditHabit(habit); setIsModalOpen(true); };
      const filteredHabits = habits.filter(h => h.repeat_days && h.repeat_days.includes(selectedDay));
      const todayStr = getKSTYYYYMMDD(new Date());

      const handleToggleHabitLog = async (habit) => {
        const isCompleted = habitLogs.some(log => log.habit_id === habit.id && log.completed_date === todayStr);
        const backup = [...habitLogs];
        
        if (!isCompleted) setHabitLogs([...backup, { habit_id: habit.id, user_id: user.id, completed_date: todayStr, is_completed: true }]);
        else setHabitLogs(backup.filter(log => !(log.habit_id === habit.id && log.completed_date === todayStr)));

        try {
          if (!isCompleted) {
             const { error } = await supabase.from('habit_logs').upsert({ habit_id: habit.id, user_id: user.id, completed_date: todayStr, is_completed: true });
             if(error) throw error;
          } else {
             const { error } = await supabase.from('habit_logs').delete().eq('habit_id', habit.id).eq('completed_date', todayStr);
             if(error) throw error;
          }
        } catch(e) { 
           window.customAlert('체크 동기화 실패'); 
           setHabitLogs(backup); 
        }
      };

      const doSaveHabit = async (e) => {
        e.preventDefault();
        try {
          const days = Array.from(e.target.days).filter(cb=>cb.checked).map(cb=>parseInt(cb.value));
          if(days.length === 0) { window.customAlert('반복 요일을 하나 이상 선택해주세요.'); return; }
          const res = await api.data.saveHabit({ id: editHabit?.id, title: e.target.title.value, exec_time: e.target.time.value || null, repeat_days: days }, user.id);
          onUpdate(res); setIsModalOpen(false);
        } catch(e) {}
      };

      const renderDots = (habit) => {
        const dots = []; let completedCount = 0; let curDate = getKSTDate(); let found = 0;
        while(found < 7 && dots.length < 30) {
          let dayJs = curDate.getDay(); let dayUi = dayJs === 0 ? 6 : dayJs - 1; 
          if(habit.repeat_days.includes(dayUi)) {
            const dateStr = getKSTYYYYMMDD(curDate);
            const isDone = habitLogs.some(log => log.habit_id === habit.id && log.completed_date === dateStr);
            dots.unshift(isDone); if(isDone) completedCount++; found++;
          }
          curDate.setDate(curDate.getDate() - 1);
        }
        return (
          <div className="flex flex-col items-end gap-1.5 shrink-0">
            <span className="text-[10px] font-bold text-slate-400">7회 중 <span className="text-blue-600">{completedCount}</span>회</span>
            <div className="flex gap-1">
              {dots.map((done, i) => <div key={i} className={`w-2 h-2 rounded-full ${done ? 'bg-blue-600' : 'bg-slate-200'}`} />)}
            </div>
          </div>
        );
      };

      return (
        <div>
          <div className="flex bg-white rounded-2xl p-1.5 shadow-sm mb-6 border border-slate-200">
            {['월', '화', '수', '목', '금', '토', '일'].map((day, idx) => (
              <button key={idx} onClick={() => setSelectedDay(idx)} className={`flex-1 py-2.5 text-sm font-black rounded-xl transition ${selectedDay === idx ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-50 hover:text-slate-700'}`}>{day}</button>
            ))}
          </div>
          <div className="space-y-3">
            {filteredHabits.map(habit => {
              const isTodayDone = habitLogs.some(log => log.habit_id === habit.id && log.completed_date === todayStr);
              return (
                <div key={habit.id} className={`flex items-center gap-4 p-5 bg-white border border-slate-200 rounded-2xl shadow-sm transition ${isTodayDone ? 'opacity-60 bg-slate-50' : 'hover:border-blue-300'}`}>
                  <button onClick={() => handleToggleHabitLog(habit)} className={`shrink-0 w-8 h-8 rounded-xl border-2 flex items-center justify-center transition shadow-sm ${isTodayDone ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-300 hover:border-blue-400 bg-white'}`}>
                    {isTodayDone && <Icon name="Check" size={18} />}
                  </button>
                  <div className="flex-1 cursor-pointer" onClick={() => openModal(habit)}>
                    <div className={`font-black text-lg tracking-tight ${isTodayDone ? 'line-through text-slate-400' : 'text-slate-800'}`}>{habit.title}</div>
                    {habit.exec_time && <div className="text-xs text-blue-600 font-bold mt-1.5 flex items-center gap-1"><Icon name="Clock" size={12} />{habit.exec_time.slice(0,5)}</div>}
                  </div>
                  {renderDots(habit)}
                </div>
              );
            })}
            {filteredHabits.length === 0 && <div className="text-center py-10 bg-white border border-slate-200 rounded-2xl text-slate-400 text-sm shadow-sm flex flex-col items-center"><Icon name="Activity" size={28} className="mb-2 text-slate-300"/>등록된 습관이 없습니다.</div>}
            <button onClick={() => openModal()} className="w-full py-4 border-2 border-dashed border-slate-300 text-blue-600 font-black rounded-2xl hover:border-blue-500 hover:bg-blue-50 transition bg-white flex justify-center items-center gap-2 shadow-sm mt-4"><Icon name="Plus" size={20} /> 새 습관 추가</button>
          </div>
          
          <CustomModal isOpen={isModalOpen} title={editHabit ? "습관 수정" : "새 습관"} onClose={() => setIsModalOpen(false)}>
            <form onSubmit={doSaveHabit} className="space-y-6">
              <div>
                <label className="block text-sm font-bold text-slate-700 mb-2">습관명</label>
                <input name="title" type="text" required defaultValue={editHabit?.title || ''} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 focus:outline-none focus:border-blue-500 font-bold transition shadow-sm" placeholder="매일 아침 스트레칭" />
              </div>
              <div>
                <label className="block text-sm font-bold text-slate-700 mb-2">시간 (선택)</label>
                <input name="time" type="time" defaultValue={editHabit?.exec_time?.slice(0,5) || ''} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 focus:outline-none focus:border-blue-500 font-medium transition shadow-sm" />
              </div>
              <div>
                <label className="block text-sm font-bold text-slate-700 mb-3">반복 요일</label>
                <div className="flex gap-2 justify-between bg-slate-50 p-3 rounded-xl border border-slate-200">
                  {['월', '화', '수', '목', '금', '토', '일'].map((d, i) => (
                    <label key={i} className="flex flex-col items-center gap-1.5 cursor-pointer">
                      <input name="days" type="checkbox" value={i} defaultChecked={editHabit ? editHabit.repeat_days.includes(i) : true} className="w-5 h-5 accent-blue-600 cursor-pointer rounded" />
                      <span className="text-xs font-black text-slate-500">{d}</span>
                    </label>
                  ))}
                </div>
              </div>
              <div className="pt-2 flex gap-3">
                {editHabit && <button type="button" onClick={async ()=>{ try { await api.data.deleteHabit(editHabit.id, user.id); onDelete(editHabit.id); setIsModalOpen(false); } catch(e){} }} className="px-5 py-3.5 bg-red-50 text-red-500 rounded-xl hover:bg-red-100 transition"><Icon name="Trash2" size={20} /></button>}
                <button type="submit" className="flex-1 py-3.5 bg-blue-600 text-white font-black rounded-xl shadow-md hover:bg-blue-700 transition">저장하기</button>
              </div>
            </form>
          </CustomModal>
        </div>
      );
    };

    const StatsView = ({ goals, plans }) => {
      const totalGoals = goals.length;
      const completedGoals = goals.filter(g => g.is_completed).length;

      return (
        <div className="space-y-6">
          {/* Top Summary */}
          <div className="grid grid-cols-2 gap-4">
            <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col items-center text-center">
              <div className="text-slate-400 mb-3 bg-slate-50 p-3 rounded-full border border-slate-100"><Icon name="Target" size={24} /></div>
              <div className="text-4xl font-black text-slate-900 mb-1 tracking-tighter">{totalGoals}</div>
              <div className="text-xs font-bold text-slate-500 uppercase tracking-wide">등록된 총 목표</div>
            </div>
            <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col items-center text-center border-b-4 border-b-blue-600">
              <div className="text-blue-600 mb-3 bg-blue-50 p-3 rounded-full border border-blue-100"><Icon name="Award" size={24} /></div>
              <div className="text-4xl font-black text-blue-600 mb-1 tracking-tighter">{completedGoals}</div>
              <div className="text-xs font-bold text-slate-500 uppercase tracking-wide">달성한 목표</div>
            </div>
          </div>

          {/* Goal Detailed Stats */}
          <h3 className="font-black text-slate-900 text-lg tracking-tight px-2 mt-4">목표별 상세 현황</h3>
          <div className="grid gap-4">
              {goals.map(goal => {
                  const goalPlans = plans.filter(p => p.goal_id === goal.id);
                  const totalPlans = goalPlans.length;
                  const completedPlans = goalPlans.filter(p => p.status === 'completed').length;
                  const successRate = totalPlans > 0 ? ((completedPlans / totalPlans) * 100).toFixed(0) : 0;
                  
                  const totalTargetTime = goalPlans.reduce((sum, p) => sum + (Number(p.target_time) || 0), 0);
                  const totalActualTime = goalPlans.reduce((sum, p) => sum + (Number(p.time_spent) || 0), 0);

                  return (
                      <div key={goal.id} className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                          <div className="font-black text-slate-800 text-lg mb-4 tracking-tight flex items-center justify-between">
                              <span className="truncate pr-4">{goal.title}</span>
                              {goal.is_completed && <span className="shrink-0 bg-blue-100 text-blue-700 text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider">달성완료</span>}
                          </div>
                          
                          <div className="space-y-4">
                              {/* Plan completion bar */}
                              <div>
                                  <div className="flex justify-between text-xs font-bold mb-1.5">
                                      <span className="text-slate-500">실행 계획 달성률</span>
                                      <span className="text-blue-600">{completedPlans} / {totalPlans} ({successRate}%)</span>
                                  </div>
                                  <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden border border-slate-200">
                                      <div className="bg-blue-600 h-2 rounded-full transition-all duration-500" style={{ width: `${successRate}%` }}></div>
                                  </div>
                              </div>
                              
                              {/* Time tracking */}
                              <div className="grid grid-cols-2 gap-3 pt-2">
                                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                      <div className="text-[10px] text-slate-400 font-bold mb-1 flex items-center gap-1"><Icon name="Clock" size={10}/> 목표 예상 시간</div>
                                      <div className="text-sm font-black text-slate-700">{formatTimeMins(totalTargetTime)}</div>
                                  </div>
                                  <div className="bg-blue-50 p-3 rounded-xl border border-blue-100">
                                      <div className="text-[10px] text-blue-500 font-bold mb-1 flex items-center gap-1"><Icon name="CheckCircle" size={10}/> 실제 투입 시간</div>
                                      <div className="text-sm font-black text-blue-700">{formatTimeMins(totalActualTime)}</div>
                                  </div>
                              </div>
                          </div>
                      </div>
                  );
              })}
              {goals.length === 0 && <div className="text-center py-10 text-slate-400 text-sm font-medium">등록된 목표가 없어 통계를 표시할 수 없습니다.</div>}
          </div>
        </div>
      );
    };

    const App = () => {
      const [user, setUser] = React.useState(null);
      const [currentTab, setCurrentTab] = React.useState('goals');
      const [isLoading, setIsLoading] = React.useState(true);
      
      const [goals, setGoals] = React.useState([]);
      const [milestones, setMilestones] = React.useState([]); 
      const [plans, setPlans] = React.useState([]);
      const [habits, setHabits] = React.useState([]);
      const [habitLogs, setHabitLogs] = React.useState([]);

      const loadData = async (uid) => {
        try {
          const [g, m, p, h, hl] = await Promise.all([
            api.data.getGoals(uid), api.data.getMilestones(uid), api.data.getPlans(uid), api.data.getHabits(uid), api.data.getHabitLogs(uid)
          ]);
          setGoals(g); setMilestones(m); setPlans(p); setHabits(h); setHabitLogs(hl);
        } catch (e) {
            console.error("데이터 로드 실패", e);
        }
      };

      React.useEffect(() => {
        const init = async () => {
          const { data: { session } } = await supabase.auth.getSession();
          if (session?.user) { setUser(session.user); await loadData(session.user.id); }
          setIsLoading(false);
        };
        init();
        const { data: listener } = supabase.auth.onAuthStateChange((evt, session) => {
          if (evt === 'SIGNED_IN' && session?.user) { setUser(session.user); loadData(session.user.id); }
          else if (evt === 'SIGNED_OUT') { setUser(null); }
        });
        return () => listener?.subscription.unsubscribe();
      }, []);

      if (isLoading) return <div className="min-h-screen flex items-center justify-center bg-slate-50"><Icon name="Loader2" size={36} className="animate-spin text-blue-600" /></div>;
      if (!user) return <AuthView onLoginSuccess={(u) => { setUser(u); loadData(u.id); }} />;

      const tabs = [
        { id: 'goals', label: '목표', icon: 'Target' },
        { id: 'execution', label: '계획', icon: 'Edit3' },
        { id: 'journal', label: '실행', icon: 'CheckSquare' },
        { id: 'habits', label: '습관', icon: 'Activity' },
        { id: 'stats', label: '통계', icon: 'BarChart2' }
      ];

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 font-sans">
          <header className="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm">
            <div className="max-w-2xl mx-auto px-4 flex flex-col sm:flex-row justify-between h-auto sm:h-16 py-3 sm:py-0">
              <div className="flex items-center justify-between mb-3 sm:mb-0">
                <div className="flex items-center gap-2.5">
                  <div className="w-8 h-8 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-sm">
                    <Icon name="Target" size={20} />
                  </div>
                  <span className="font-black text-slate-900 text-lg tracking-tight">Target Engine</span>
                </div>
                <button onClick={api.auth.signOut} className="sm:hidden text-slate-400 hover:text-red-500 p-2"><Icon name="LogOut" size={18} /></button>
              </div>
              <div className="flex items-center gap-1.5 overflow-x-auto custom-scrollbar sm:pb-0 justify-start sm:justify-end pb-1">
                {tabs.map(tab => (
                  <button key={tab.id} onClick={() => setCurrentTab(tab.id)} className={`flex items-center gap-1.5 px-3 py-2.5 sm:py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${currentTab === tab.id ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-100 hover:text-slate-900'}`}>
                    <Icon name={tab.icon} size={15} /> <span>{tab.label}</span>
                  </button>
                ))}
                <div className="hidden sm:block w-px h-5 bg-slate-200 mx-2 shrink-0"></div>
                <button onClick={api.auth.signOut} className="hidden sm:block text-slate-400 hover:text-red-500 p-2 transition"><Icon name="LogOut" size={18} /></button>
              </div>
            </div>
          </header>
          <main className="flex-1 max-w-2xl w-full mx-auto p-4 sm:p-6 pb-24">
            {currentTab === 'goals' && <GoalsView goals={goals} milestones={milestones} onUpdateGoal={g => setGoals(p => p.some(x=>x.id===g.id)?p.map(x=>x.id===g.id?g:x):[...p,g])} onDeleteGoal={id => setGoals(p => p.filter(x=>x.id!==id))} onUpdateMilestone={m => setMilestones(p => p.some(x=>x.id===m.id)?p.map(x=>x.id===m.id?m:x):[...p,m])} onDeleteMilestone={id => setMilestones(p => p.filter(x=>x.id!==id))} user={user} />}
            {currentTab === 'execution' && <ExecutionView goals={goals} milestones={milestones} onPlanSaved={p => setPlans([p, ...plans])} user={user} />}
            {currentTab === 'journal' && <JournalView plans={plans} goals={goals} milestones={milestones} onUpdatePlan={p => setPlans(prev => prev.map(x=>x.id===p.id?p:x))} onDeletePlan={id => setPlans(prev => prev.filter(x=>x.id!==id))} user={user} />}
            {currentTab === 'habits' && <HabitsView habits={habits} habitLogs={habitLogs} setHabitLogs={setHabitLogs} onUpdate={h => setHabits(p => p.some(x=>x.id===h.id)?p.map(x=>x.id===h.id?h:x):[...p,h])} onDelete={id => setHabits(p => p.filter(x=>x.id!==id))} user={user} />}
            {currentTab === 'stats' && <StatsView goals={goals} plans={plans} />}
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
